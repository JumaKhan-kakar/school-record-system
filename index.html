  let d;try{d=JSON.parse(text);}catch(e){return {ok:false,error:t("merge_bad")};}
  if(!d||d.v!==1||!d.settings||!Array.isArray(d.students))return {ok:false,error:t("merge_bad")};
  takeSnapshot("before-merge");
  const norm=function(s){return String(s==null?"":s).trim().toLowerCase();};
  const rep={students:0,exams:0,marks:0,certs:0,lab:0,filled:0,conflicts:[],newAdmNos:[]};
  const stuIds={},examIds={},labIds={},certSerials={},admTaken={};
  db().students.forEach(function(s){stuIds[s.id]=1;admTaken[s.admNo]=1;});
  db().exams.forEach(function(e){examIds[e.id]=1;});
  (db().labItems||[]).forEach(function(l){labIds[l.id]=1;});
  (db().certificates||[]).forEach(function(c){if(c.serial)certSerials[c.serial]=1;});
  const byIdent={};
  db().students.forEach(function(s){byIdent[norm(s.name)+"|"+norm(s.fatherName)+"|"+String(s.dob||"")]=s;});
  const idMap={};
  /* ---- students ---- */
  (d.students||[]).forEach(function(ins){
    if(!ins||!norm(ins.name))return;
    const key=norm(ins.name)+"|"+norm(ins.fatherName)+"|"+String(ins.dob||"");
    const inId=ins.id;
    const local=byIdent[key];
    if(local){
      idMap[inId]=local.id;
      ["contact","address","photo","pin","gender","cls","section","dob","admDate"].forEach(function(k){
        if(!String(local[k]==null?"":local[k]).trim()&&String(ins[k]==null?"":ins[k]).trim()){local[k]=ins[k];rep.filled++;}
      });
      (ins.history||[]).forEach(function(h){
        const dup=(local.history||[]).some(function(x){return x.ts===h.ts&&x.action===h.action&&x.summary===h.summary;});
        if(!dup)local.history.unshift(h);
      });
      return;
    }
    if(admTaken[ins.admNo]){
      const fresh=nextAdmNo(ins.admDate||todayISO());
      rep.newAdmNos.push(ins.name+" ("+ins.admNo+" → "+fresh+")");
      ins.admNo=fresh;
    }
    admTaken[ins.admNo]=1;
    if(!ins.id||stuIds[ins.id])ins.id=uid("st");
    idMap[inId]=ins.id;
    stuIds[ins.id]=1;byIdent[key]=ins;
    ins.history=ins.history||[];
    db().students.push(ins);rep.students++;
  });
  /* ---- exams + marks ---- */
  const examByKey={};
  db().exams.forEach(function(e){examByKey[e.term+"|"+e.year+"|"+e.cls+"|"+e.section]=e;});
  (d.exams||[]).forEach(function(ine){
    if(!ine||!ine.term)return;
    const key=ine.term+"|"+ine.year+"|"+ine.cls+"|"+ine.section;
    const inExamId=ine.id;
    let local=examByKey[key];
    if(!local){
      if(!ine.id||examIds[ine.id])ine.id=uid("ex");
      examIds[ine.id]=1;examByKey[key]=ine;
      ine.history=ine.history||[];
      db().exams.push(ine);rep.exams++;
      local=ine;
    }
    (ine.subjects||[]).forEach(function(s){
      if(s&&s.name&&!local.subjects.some(function(x){return x.name===s.name;}))local.subjects.push({name:s.name,max:Number(s.max)||100});
    });
    const mk=((d.marks||{})[inExamId])||{};
    db().marks[local.id]=db().marks[local.id]||{};
    Object.keys(mk).forEach(function(inStuId){
      const localId=idMap[inStuId];
      if(!localId)return;
      const sm=mk[inStuId]||{};
      const lm=db().marks[local.id][localId]=db().marks[local.id][localId]||{};
      Object.keys(sm).forEach(function(sub){
        const v=sm[sub];
        if((lm[sub]==null||lm[sub]==="")&&v!=null&&v!==""){lm[sub]=v;rep.marks++;}
      });
    });
  });
  /* ---- certificates (match by serial — never duplicated) ---- */
  (d.certificates||[]).forEach(function(c){
    if(!c||!c.serial||certSerials[c.serial])return;
    if(!c.id||db().certificates.some(function(x){return x.id===c.id;}))c.id=uid("cert");
    certSerials[c.serial]=1;
    db().certificates.push(c);rep.certs++;
  });
  /* ---- lab items (match by name; merge maintenance history only) ---- */
  const labByName={};
  (db().labItems||[]).forEach(function(l){labByName[norm(l.name)]=l;});
  (d.labItems||[]).forEach(function(it){
    if(!it||!norm(it.name))return;
    const inItemId=it.id;
    const local=labByName[norm(it.name)];
    if(local){
      (d.labMaint||[]).forEach(function(m){
        if(m.itemId!==inItemId)return;
        const dup=(db().labMaint||[]).some(function(x){return x.ts===m.ts&&x.itemId===local.id&&x.note===m.note;});
        if(!dup)db().labMaint.push({id:uid("lm"),itemId:local.id,ts:m.ts,note:m.note,cost:m.cost||0});
      });
      return;
    }
    if(!it.id||labIds[it.id])it.id=uid("lab");
    labIds[it.id]=1;labByName[norm(it.name)]=it;
    db().labItems.push(it);rep.lab++;
    (d.labMaint||[]).forEach(function(m){
      if(m.itemId!==inItemId)return;
      db().labMaint.push({id:uid("lm"),itemId:it.id,ts:m.ts,note:m.note,cost:m.cost||0});
    });
  });
  /* ---- counters: take the max so future numbers never collide ---- */
  ["adm","cert"].forEach(function(k){
    db().seq=db().seq||{};db().seq[k]=db().seq[k]||{};
    const b=(d.seq&&d.seq[k])||{};
    Object.keys(b).forEach(function(yr){
      db().seq[k][yr]=Math.max(Number(db().seq[k][yr]||0),Number(b[yr]||0));
    });
  });
  Store.save();
  audit("merge",t("merge_report")+": "+rep.students+" "+t("mg_students")+", "+rep.marks+" "+t("mg_marks"));
  return {ok:true,rep:rep};
}

/* ============ automatic safety snapshots (permanent memory) ============
   The database already saves permanently on the phone (localStorage — instant,
   offline, survives app close). These are extra safety copies INSIDE the app:
   one automatic copy per day, plus one before every restore / merge / erase.
   Nothing ever leaves the phone. */
const SNAP_KEY="srs_v1_snaps", SNAP_MAX=5;
function snapshotsList(){try{const a=JSON.parse(localStorage.getItem(SNAP_KEY)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
function snapshotsSave(l){try{localStorage.setItem(SNAP_KEY,JSON.stringify(l));return true;}catch(e){return false;}}
function snapshotCounts(d){let mk=0;try{Object.keys(d.marks||{}).forEach(function(k){Object.keys(d.marks[k]||{}).forEach(function(s){mk+=Object.keys(d.marks[k][s]||{}).length;});});}catch(e){}return {students:(d.students||[]).length,exams:(d.exams||[]).length,marks:mk,certs:(d.certificates||[]).length};}
function takeSnapshot(reason){
  if(demoMode)return false;
  if(typeof localStorage==="undefined")return false;
  let data;try{data=JSON.stringify(db());}catch(e){return false;}
  const list=snapshotsList();
  const today=todayISO();
  if(reason==="auto"&&list.some(function(s){return s.date===today&&s.reason==="auto";}))return true;
  list.push({ts:tsNow(),date:today,reason:reason,counts:snapshotCounts(db()),data:data});
  while(list.length>SNAP_MAX)list.shift();
  if(!snapshotsSave(list)){list.shift();if(!snapshotsSave(list))return false;}
  return true;
}
function snapReasonName(c){return c==="auto"?t("snap_r_auto"):c==="before-restore"?t("snap_r_brestore"):c==="before-merge"?t("snap_r_bmerge"):c==="before-wipe"?t("snap_r_bwipe"):c;}
function restoreSnapshot(idx){
  const list=snapshotsList();
  const s=list[idx];if(!s)return {ok:false,error:t("merge_bad")};
  takeSnapshot("before-restore");
  let d;try{d=JSON.parse(s.data);}catch(e){return {ok:false,error:t("merge_bad")};}
  if(!d||d.v!==1||!d.settings||!Array.isArray(d.students))return {ok:false,error:t("merge_bad")};
  DB=d;Store.save();
  return {ok:true};
}
/* ================= CSV BULK IMPORT — feed entries from a paper register ====
   Honest design: true offline handwriting OCR is not feasible in a single
   offline HTML file. The working route is: (1) a template CSV with bilingual
   headers + example rows, (2) a strict two-pass importer, (3) a register-page
   photo pinned beside the entry form for fast manual entry, (4) an in-product
   tip pointing at the phone's own Lens/camera OCR + paste.
   TWO-PASS: every row validates first; NOTHING is written unless all rows
   pass. Duplicates (name+father+DOB vs DB or vs another row in the same file)
   are blocked with a per-row error that names the clash. */
var CSV_IMPORT_COLS=["name","fatherName","dob","gender","cls","section","admDate","contact","address"];
function csvTemplateText(){
  var head=["Student name / طالب علم کا نام","Father's name / والد کا نام",
    "Date of birth (YYYY-MM-DD) / تاریخ پیدائش (سال-مہینہ-دن)","Gender (Boy/Girl) / صنف (لڑکا/لڑکی)",
    "Class / جماعت","Section / سیکشن","Admission date (YYYY-MM-DD) / تاریخ داخلہ (سال-مہینہ-دن)",
    "Contact number / رابطہ نمبر","Address / پتہ"];
  var rows=[
    ["Bilal Hussain","Hussain Ahmed","2015-08-20","Boy","6","A","2026-04-01","0300-1111111","House 1, Street 2"],
    ["Ayesha Bibi","Khan Muhammad","2016-07-22","Girl","5","B","2026-04-02","0300-2222222","House 3, Street 4"]
  ];
  return csvOf(head,rows);
}
function parseCSVLine(line){
  var out=[],cur="",q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){
      if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else if(c==='"'){q=true;}
    else if(c===","){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur);
  return out;
}
function parseCSV(text){
  return String(text||"").replace(/\r\n?/g,"\n").split("\n").map(parseCSVLine);
}
function normGender(g){
  var v=String(g==null?"":g).trim().toLowerCase();
  if(v==="male"||v==="boy"||v==="m"||v==="لڑکا")return "male";
  if(v==="female"||v==="girl"||v==="f"||v==="لڑکی")return "female";
  return null;
}
function validISODate(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||"")))return false;
  var d=new Date(String(s)+"T00:00:00Z");
  return !isNaN(d.getTime())&&d.toISOString().slice(0,10)===String(s);
}
function importStudentsCSV(text){
  var lines=parseCSV(text);
  if(!lines.length||lines.every(function(r){return r.join("").trim()==="";}))
    return {ok:false,errors:[t("imp_none")]};
  var start=0;
  if(/name/i.test(String(lines[0][0]||"")))start=1; /* bilingual header row */
  var rows=lines.slice(start).filter(function(r){return r.join("").trim()!=="";});
  if(!rows.length)return {ok:false,errors:[t("imp_none")]};
  var errors=[],good=[],seen={};
  rows.forEach(function(cols,idx){
    var rn=idx+start+1; /* 1-based line number in the file */
    function err(m){errors.push(t("imp_row")+" "+rn+": "+m);}
    var d={};
    CSV_IMPORT_COLS.forEach(function(k,i){d[k]=String(cols[i]==null?"":cols[i]).trim();});
    var req=["name","fatherName","dob","gender","cls","admDate"];
    var missing=req.filter(function(k){return !d[k];});
    if(missing.length){err(t("req")+" ("+missing.join(", ")+")");return;}
    if(!validISODate(d.dob)){err(t("imp_bad_date")+": "+d.dob);return;}
    if(!validISODate(d.admDate)){err(t("imp_bad_date")+": "+d.admDate);return;}
    var g=normGender(d.gender);
    if(!g){err(t("imp_bad_gender")+": "+d.gender);return;}
    d.gender=g;
    var dupDB=findDuplicateStudent(d.name,d.fatherName,d.dob,null);
    if(dupDB){err(t("dup_student")+": "+dupDB.admNo+" ("+dupDB.name+" — "+dupDB.fatherName+")");return;}
    var key=norm(d.name)+"\u0001"+norm(d.fatherName)+"\u0001"+d.dob;
    if(seen[key]){err(t("dup_student")+": "+t("imp_dup_in_file")+" ("+t("imp_row")+" "+seen[key]+")");return;}
    seen[key]=rn;
    good.push(d);
  });
  if(errors.length)return {ok:false,errors:errors}; /* two-pass: nothing written */
  var added=0;
  good.forEach(function(d){var r=addStudent(d);if(r.ok)added++;});
  return {ok:true,count:added};
}

/* ================= SCAN → EXTRACT → REVIEW → RECORDS =====================
   Fully-offline register scanner — the primary first-entry route.
   Honest architecture note (verified 2026-11-04 against
   fuel-bill-app.html): the fuel app's Tesseract pipeline is NOT offline —
   it loads tesseract.min.js from a CDN and downloads eng/urd language data
   over the network on first run (zero embedded traineddata, zero OCRAD in
   that file). That cannot be replicated under this app's
   zero-external-requests rule, so this module:
   - ports the fuel app's preprocessing VERBATIM (proven, offline, no deps);
   - ports its smart-review pattern (green ✓ / amber tap-to-correct);
   - resolves the OCR step as: embedded OCRAD() if vendored into the marked
     slot (the only JS OCR engine that is genuinely offline — ~1MB, zero
     language data) → Tesseract global if separately loaded → honest
     fallback: the enhanced photo is pinned for fast entry + Lens tip.
     Nothing is silently dropped: unparsed OCR lines are listed as raw text.
   Pure + node-testable: normUrduDigits, parseRegisterLine,
   parseRegisterLines, validateScanRows. Browser-only: fileToDataURLScan,
   preprocessForOCR, ocrRecognize, scan UI. */
/* --- image helpers (ported from fuel-bill-app.html) --- */
function loadImageScan(dataURL){
  return new Promise(function(res,rej){
    const img=new Image();
    img.onload=function(){res(img);};
    img.onerror=rej;
    img.src=dataURL;
  });
}
function fileToDataURLScan(file,maxDim){
  maxDim=maxDim||1400;
  return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){
      loadImageScan(r.result).then(function(img){
        const s=Math.min(1,maxDim/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.82));
      },rej);
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}
/* ink-on-paper cleanup before OCR: upscale + grayscale + contrast stretch +
   soft threshold. Falls back to the original image if anything fails. */
function preprocessForOCR(dataURL){
  return new Promise(function(res){
    loadImageScan(dataURL).then(function(img){
      try{
        const scale=Math.min(2.2,Math.max(1,1800/Math.max(img.width,img.height)));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        const x=c.getContext("2d",{willReadFrequently:true});
        x.drawImage(img,0,0,c.width,c.height);
        const d=x.getImageData(0,0,c.width,c.height),p=d.data;
        for(let i=0;i<p.length;i+=4){
          const g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
          let v=(g-128)*1.7+128;
          v=v>205?255:(v<85?0:v);
          p[i]=p[i+1]=p[i+2]=v;
        }
        x.putImageData(d,0,0);
        res(c.toDataURL("image/jpeg",0.92));
      }catch(e){res(dataURL);}
    },function(){res(dataURL);});
  });
}
/* --- OCR engine resolution: embedded OCRAD → Tesseract global → none --- */
function ocrEngine(){
  try{if(typeof OCRAD==="function")return {name:"ocrad"};}catch(e){}
  try{if(typeof Tesseract!=="undefined"&&Tesseract&&Tesseract.createWorker)return {name:"tesseract"};}catch(e){}
  return null;
}
async function ocrRecognize(cleanedDataURL){
  const eng=ocrEngine();
  if(!eng)throw new Error("no-engine");
  if(eng.name==="ocrad"){
    const img=await loadImageScan(cleanedDataURL);
    const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
    c.getContext("2d").drawImage(img,0,0);
    return String(OCRAD(c)||"");
  }
  /* tesseract branch — mirrors the fuel app; only runs if Tesseract was loaded */
  const worker=await Tesseract.createWorker(["eng","urd"],1,{});
  try{const r=await worker.recognize(cleanedDataURL);return (r&&r.data&&r.data.text)||"";}
  finally{try{await worker.terminate();}catch(e){}}
}
/* --- Urdu/Arabic-Indic digit normalization --- */
var SCAN_URDU_DIGITS={"۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9",
  "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
function normUrduDigits(s){return String(s==null?"":s).replace(/[۰-۹٠-٩]/g,function(c){return SCAN_URDU_DIGITS[c]||c;});}
/* confidence per field: "high" | "low" | "missing" */
function scanFld(v,conf){return {v:v==null?"":String(v),conf:conf||(v?"low":"missing")};}
function cleanNameToken(s){
  return String(s||"").replace(/[^A-Za-z\u0600-\u06FF\s'\-.]/g," ").replace(/\s+/g," ").trim();
}
/* one OCR text line → candidate student row, or null when the line carries
   nothing usable (→ listed under "could not read", never silently dropped) */
function parseRegisterLine(line){
  const raw=String(line==null?"":line);
  let w=normUrduDigits(raw).trim();
  if(!w)return null;
  /* 1. date of birth: yyyy-mm-dd, then dd/mm/yyyy (2- or 4-digit year) */
  let dob="",dobConf="missing",m;
  m=w.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){
    const iso=m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    if(validISODate(iso)){dob=iso;dobConf="high";w=w.replace(m[0]," ");}
  }
  if(!dob){
    m=w.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){
      const yy=m[3].length===2?"20"+m[3]:m[3];
      const iso=yy+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
      if(validISODate(iso)){dob=iso;dobConf="high";w=w.replace(m[0]," ");}
    }
  }
  /* 2. class / section tokens ("Class 6 A", "جماعت 6", or standalone "6-A") */
  let cls="",sec="",clsConf="missing",secConf="missing";
  m=w.match(/(?:class|cls|جماعت)\s*(\d{1,2})(?:\s*[-–—/ ]\s*([A-Za-z]))?/i);
  if(m){cls=m[1];sec=(m[2]||"").toUpperCase();clsConf="high";secConf=m[2]?"high":"missing";w=w.replace(m[0]," ");}
  else{
    m=w.match(/(^|\s)(\d{1,2})\s*[-–—/]\s*([A-Za-z])(?=\s|$)/);
    if(m){cls=m[2];sec=m[3].toUpperCase();clsConf="low";secConf="low";w=w.replace(m[0]," ");}
  }
  /* 3. leading serial number — informational only, never used as identity */
  w=w.replace(/^\s*\d{1,3}\s*[.\)\-:]\s*/,"");
  /* 4. father's-name keywords: s/o, d/o, w/o, son of, daughter of, ولد, بنت, بن, والد */
  const FK=["بنت","ولد","والد","بن",/\bs\s?\/?\s?o\b/i,/\bd\s?\/?\s?o\b/i,/\bw\s?\/?\s?o\b/i,
    /\bson of\b/i,/\bdaughter of\b/i,/\bwife of\b/i];
  let name="",father="",nameConf="missing",fatherConf="missing",gender="",ki=-1,klen=0;
  for(let i=0;i<FK.length;i++){
    const k=FK[i];
    if(typeof k==="string"){const ix=w.indexOf(k);if(ix>=0){ki=ix;klen=k.length;break;}}
    else{const mm=w.match(k);if(mm&&mm.index!==undefined){ki=mm.index;klen=mm[0].length;break;}}
  }
  if(ki>=0){
    const kwText=w.slice(ki,ki+klen);
    name=cleanNameToken(w.slice(0,ki));
    father=cleanNameToken(w.slice(ki+klen)).replace(/^(کا نام|کا|نام)\s+/,"");
    if(name)nameConf="high";
    if(father)fatherConf="high";
    const kwN=kwText.toLowerCase().replace(/[\s\/\.]/g,"");
    gender=(kwN==="بنت"||/^(do|daughterof|wo|wifeof)$/.test(kwN))?"female":"male";
  }else{
    name=cleanNameToken(w);
    if(name)nameConf="low";
  }
  const hasLetters=/[A-Za-z\u0600-\u06FF]/.test(name+father);
  if(!hasLetters&&!dob)return null;
  return {name:scanFld(name,name?nameConf:"missing"),
    fatherName:scanFld(father,father?fatherConf:"missing"),
    dob:scanFld(dob,dobConf),
    cls:scanFld(cls,clsConf),section:scanFld(sec,secConf),
    gender:scanFld(gender,gender?"low":"missing"),
    raw:raw};
}
function parseRegisterLines(text){
  const lines=String(text==null?"":text).split("\n");
  const rows=[],unread=[];
  lines.forEach(function(ln,idx){
    const t=String(ln).trim();
    if(!t)return;
    const r=parseRegisterLine(t);
    if(r)rows.push(r);else unread.push({line:t,idx:idx});
  });
  return {rows:rows,unread:unread};
}
/* two-pass validation for scanned rows: nothing is written unless ALL rows
   pass. Duplicates (vs DB or inside the batch) name the clash. */
function validateScanRows(rows){
  const errors=[],clean=[],seen={};
  rows.forEach(function(r,idx){
    const rn=idx+1;
    function err(m){errors.push("Row "+rn+": "+m);}
    const d={name:String(r.name==null?"":r.name).trim(),fatherName:String(r.fatherName==null?"":r.fatherName).trim(),
      dob:String(r.dob==null?"":r.dob).trim(),gender:String(r.gender==null?"":r.gender).trim(),
      cls:String(r.cls==null?"":r.cls).trim(),section:String(r.section==null?"":r.section).trim(),
      admDate:String(r.admDate||todayISO()).trim(),
      contact:String(r.contact==null?"":r.contact).trim(),address:String(r.address==null?"":r.address).trim()};
    const req=["name","fatherName","dob","gender","cls","section"];
    const missing=req.filter(function(k){return !d[k];});
    if(missing.length){err(t("req")+" ("+missing.join(", ")+")");return;}
    if(!validISODate(d.dob)){err(t("imp_bad_date")+": "+d.dob);return;}
    if(d.gender!=="male"&&d.gender!=="female"){err(t("imp_bad_gender")+": "+d.gender);return;}
    const dupDB=findDuplicateStudent(d.name,d.fatherName,d.dob,null);
    if(dupDB){err(t("dup_student")+": "+dupDB.admNo+" ("+dupDB.name+" — "+dupDB.fatherName+")");return;}
    const key=norm(d.name)+""+norm(d.fatherName)+""+d.dob;
    if(seen[key]){err(t("dup_student")+": "+t("imp_dup_in_file"));return;}
    seen[key]=rn;
    clean.push(d);
  });
  if(errors.length)return {ok:false,errors:errors};
  return {ok:true,clean:clean};
}
/* commit: validate everything first, then write; sequential ADM numbers,
   per-record history + audit via addStudent. */
function commitScanRows(rows){
  const v=validateScanRows(rows);
  if(!v.ok)return v;
  const added=[];
  v.clean.forEach(function(d){const r=addStudent(d);if(r.ok)added.push(r.student.admNo);});
  audit("scan-import",added.length+" "+t("scan_saved"));
  return {ok:true,count:added.length,added:added};
}

/* ================= VOICE ENTRY =================
   Mic buttons on text fields: webkitSpeechRecognition (Chrome on Android).
   Recognition language follows the UI toggle ('ur-PK' / 'en-US'); interim
   results appear live in the field, the final transcript lands on end.
   HONEST LIMIT, shown in-product: the phone's speech service needs internet
   WHILE speaking — everything else in the app stays fully offline. No
   speech support → a graceful bilingual message, never silent failure. */
function speechLang(){return (LANGS[lang()]||LANGS.en).speech;}
function speechSupported(){
  try{return (typeof window!=="undefined")&&!!(window.SpeechRecognition||window.webkitSpeechRecognition);}
  catch(e){return false;}
}
let micRec=null,micTarget=null;
function micHTML(fieldId){
  return '<button type="button" class="micbtn" data-mic="'+fieldId+'" title="'+esc(t("mic_hint"))+'" aria-label="'+esc(t("mic_hint"))+'">🎤</button>';
}
function micField(id,inner){
  return '<div class="micwrap">'+inner+micHTML(id)+"</div>";
}
function micNoteHTML(){
  return '<div class="muted" style="font-size:.82rem;margin:.3rem 0">🎤 '+esc(t("mic_note"))+"</div>";
}
function paintMicBtns(){
  if(typeof document==="undefined")return;
  Array.prototype.forEach.call(document.querySelectorAll("[data-mic]"),function(b){
    const on=micTarget&&b.getAttribute("data-mic")===micTarget;
    b.classList.toggle("rec",!!on);
    b.textContent=on?"⏹":"🎤";
  });
}
function micToast(msg){if(typeof document==="undefined")return;var d=$("mic-toast");if(!d){d=document.createElement("div");d.id="mic-toast";document.body.appendChild(d);}d.textContent=msg;d.style.display="block";}
function micToastHide(){if(typeof document==="undefined")return;var d=$("mic-toast");if(d)d.style.display="none";}
function stopMic(){if(micRec){try{micRec.stop();}catch(e){}}micRec=null;micTarget=null;paintMicBtns();micToastHide();}
function toggleMic(fieldId){
  const F=$(fieldId);if(!F)return;
  if(!speechSupported()){alert(t("mic_nosupport"));return;}
  if(micRec){stopMic();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec;
  try{rec=new SR();}catch(e){alert(t("mic_nosupport"));return;}
  rec.lang=speechLang();rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  micTarget=fieldId;micRec=rec;paintMicBtns();
  let finalTxt="";
  rec.onresult=function(e){
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const tr=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalTxt+=tr;else interim+=tr;
    }
    F.value=finalTxt+interim;
    try{F.dispatchEvent(new Event("input",{bubbles:true}));}catch(ee){}
  };
  rec.onstart=function(){micToast("🎙 "+t("mic_listening"));};
  rec.onend=function(){micRec=null;micTarget=null;paintMicBtns();micToastHide();};
  rec.onerror=function(e){
    const code=(e&&e.error)||"";
    micRec=null;micTarget=null;paintMicBtns();micToastHide();
    if(code==="aborted")return;
    alert(code==="not-allowed"||code==="service-not-allowed"?t("mic_err_perm"):code==="no-speech"?t("mic_err_nospeech"):code==="network"?t("mic_err_net"):t("mic_err"));
  };
  try{rec.start();}catch(e){micRec=null;micTarget=null;paintMicBtns();micToastHide();}
}
function bindMic(){
  if(typeof document==="undefined")return;
  Array.prototype.forEach.call(document.querySelectorAll("[data-mic]"),function(b){
    b.onclick=function(){toggleMic(b.getAttribute("data-mic"));};
  });
}

/* ============ RESULT CARD SYSTEM ============
   Part A (MVP): A4 result cards — single + whole-class batch, print-to-PDF.
   Part B (cloud phase, NOT built): parent/student self-download portal.
   Architecture ready now: per-student PIN (nullable), result records keyed
   by student+exam, and resultPayload() — one clean standalone payload the
   future portal will call. Nothing in Part B is built or exposed in UI. */
/* Standalone card payload for ONE student in ONE exam.
   Pure data, no HTML — the future self-download portal calls this. */
/* ================= PARENT PORTAL (round 13) =================
   Parents open the school's result link (?school=<schoolId>#parent) and enter
   admission number + 4-digit PIN + father's name. The app hashes those four
   values (SHA-256) and fetches exactly one public document — no account, no
   app install, no list of students is ever exposed. Security rests on knowing
   all three values; the PIN is the secret the school hands out. */
function sha256Hex(str){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=[];
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<0x80)bytes.push(c);
    else if(c<0x800){bytes.push(0xc0|(c>>6),0x80|(c&0x3f));}
    else if(c<0xd800||c>=0xe000){bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}
    else{i++;var c2=str.charCodeAt(i);var cp=0x10000+((c&0x3ff)<<10)+(c2&0x3ff);
      bytes.push(0xf0|(cp>>18),0x80|((cp>>12)&0x3f),0x80|((cp>>6)&0x3f),0x80|(cp&0x3f));}
  }
  var bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  for(var b=7;b>=0;b--)bytes.push((bitLen/Math.pow(2,b*8))&0xff);
  for(var off=0;off<bytes.length;off+=64){
    var w=[];
    for(var t2=0;t2<16;t2++)w[t2]=(bytes[off+t2*4]<<24)|(bytes[off+t2*4+1]<<16)|(bytes[off+t2*4+2]<<8)|bytes[off+t2*4+3];
    for(var t3=16;t3<64;t3++){
      var s0=rr(w[t3-15],7)^rr(w[t3-15],18)^(w[t3-15]>>>3);
      var s1=rr(w[t3-2],17)^rr(w[t3-2],19)^(w[t3-2]>>>10);
      w[t3]=(w[t3-16]+s0+w[t3-7]+s1)|0;
    }
    var a=H[0],b2=H[1],c2=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(var t4=0;t4<64;t4++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25);
      var ch=(e&f)^(~e&g);
      var temp1=(h+S1+ch+K[t4]+w[t4])|0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22);
      var maj=(a&b2)^(a&c2)^(b2&c2);
      var temp2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+temp1)|0;d=c2;c2=b2;b2=a;a=(temp1+temp2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out="";
  for(var i2=0;i2<8;i2++){var v=H[i2];for(var s=28;s>=0;s-=4)out+="0123456789abcdef"[(v>>>s)&0xf];}
  return out;
}
function parentHash(schoolId,admNo,pin,fatherName){
  return sha256Hex(String(schoolId||"")+"|"+String(admNo||"").trim()+"|"+String(pin||"").trim()+"|"+String(fatherName||"").toLowerCase().trim());
}
function ensurePin(st){
  if(st.pin)return st.pin;
  let pin=null,tries=0;
  do{pin=String(1000+Math.floor(Math.random()*9000));tries++;}
  while(tries<25&&db().students.some(function(s){return s.pin===pin;}));
  st.pin=pin;Store.save();
  return pin;
}
/* Publish a LOCKED exam's results for parents. Only from a locked (approved)
   exam; only in cloud mode with a signed-in teacher. */
function publishResults(examId){
  const ex=db().exams.find(function(e){return e.id===examId;});
  if(!ex)return {ok:false,error:t("no_records")};
  if(!ex.locked)return {ok:false,error:t("publish_locked_only")};
  if(typeof Cloud==="undefined"||!Cloud.enabled||!Cloud.ready||!Cloud.user||!Cloud.schoolId)return {ok:false,error:t("publish_cloud_only")};
  const rows=computeResult(examId);
  const done=rows.filter(function(r){return r.complete;});
  const schoolId=Cloud.schoolId;
  let n=0;
  done.forEach(function(r){
    const st=r.student;
    const pin=ensurePin(st);
    const payload=resultPayload(examId,st.id);
    if(!payload)return;
    payload.student.photo=""; /* keep the public doc small; card renders without it */
    payload.publishedAt=tsNow();
    Cloud.pushDoc("publicResults",parentHash(schoolId,st.admNo,pin,st.fatherName),payload);
    Cloud.pushDoc("verifyDocs",payload.verifyCode,{type:"result",code:payload.verifyCode,student:{name:st.name,fatherName:st.fatherName,admNo:st.admNo,cls:st.cls},exam:{id:ex.id,name:ex.name,year:ex.year,term:ex.term},total:payload.total,maxTotal:payload.maxTotal,pct:payload.pct,grade:payload.grade,division:payload.division,position:payload.position,pass:payload.pass,at:tsNow()});
    n++;
  });
  db().settings.published=db().settings.published||{};
  db().settings.published[examId]={count:n,at:tsNow()};
  audit("publish-results",ex.name+" ("+ex.year+") — "+n+" "+t("dash_marks_done"));
  Store.save();
  return {ok:true,count:n};
}
function unpublishResults(examId){
  const ex=db().exams.find(function(e){return e.id===examId;});
  if(!ex)return {ok:false};
  if(typeof Cloud==="undefined"||!Cloud.enabled||!Cloud.ready||!Cloud.user||!Cloud.schoolId)return {ok:false,error:t("publish_cloud_only")};
  const rows=computeResult(examId);
  const schoolId=Cloud.schoolId;
  let n=0;
  rows.forEach(function(r){
    const st=r.student;
    if(!st.pin)return;
    Cloud.deleteDoc("publicResults",parentHash(schoolId,st.admNo,st.pin,st.fatherName));
    Cloud.deleteDoc("verifyDocs",verifyCodeFor("result",examId+"|"+st.id));
    n++;
  });
  if(db().settings.published)delete db().settings.published[examId];
  audit("unpublish-results",ex.name+" ("+ex.year+")");

}

/* Teacher remarks (Round 18, pain #4): one comment per student per exam,
   written by the teacher in the result sheet and printed on the card. The
   card shows the teacher's remark when one exists, else the automatic
   grade remark. This is what stops teachers typing cards in Word. */
function teacherRemark(examId,studentId){
  const m=(db().remarks||{})[examId];
  return (m&&m[studentId])||"";
}
function setRemark(examId,studentId,text){
  const ex=db().exams.find(function(e){return e.id===examId;});
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!ex||!st)return {ok:false,error:t("req")};
  if(!db().remarks)db().remarks={};
  const v=String(text||"").trim();
  if(!v){if(db().remarks[examId])delete db().remarks[examId][studentId];}
  else{
    if(!db().remarks[examId])db().remarks[examId]={};
    db().remarks[examId][studentId]=v;
  }
  Store.save();
  return {ok:true};
}

function resultPayload(examId,studentId){
  const ex=db().exams.find(function(e){return e.id===examId;});if(!ex)return null;
  const st=db().students.find(function(s){return s.id===studentId;});if(!st)return null;
  const rr=resultRowFor(examId,studentId);if(!rr)return null;
  const r=rr.row;
  const vcode=verifyCodeFor("result",examId+"|"+studentId);
  const vschool=verifySchoolId();
  return {
    school:{name:db().settings.schoolName||"—",logoDataUrl:db().settings.logoDataUrl||""},
    student:{name:st.name,fatherName:st.fatherName,display:displayName(st),admNo:st.admNo,
      cls:st.cls,section:st.section,dob:st.dob,photo:st.photo||""},
    exam:{id:ex.id,name:ex.name,year:ex.year||"",term:ex.term,termName:ex.term==="mid"?t("mid"):t("final")},
    subjects:ex.subjects.map(function(sj){return {name:sj.name,max:sj.max,obtained:r.per[sj.name]};}),
    total:r.complete?r.total:null,maxTotal:r.maxTotal,
    pct:r.pct,grade:r.grade,division:r.division,position:r.position,
    pass:r.pass,complete:r.complete,
    remarks:r.complete?(teacherRemark(ex.id,r.student.id)||remarkFor(r.grade)):"",
    verifyCode:vcode,verifySchool:vschool,verifyUrl:verifyURL(vcode,vschool)
  };
}

  const termB=p.exam.term==="mid"?bl("bl_mid"):bl("bl_final");

    "</b> — "+esc(p.exam.name)+" ("+esc(p.exam.year)+", "+esc(termB)+")</div></div>";
  const id='<div class="rc-id">'+studentPhotoHTML({name:p.student.name,photo:p.student.photo||""},48)+
    "<span><b>"+esc(bl("bl_name"))+":</b> "+esc(p.student.display)+"</span><span><b>"+esc(bl("bl_admno"))+
    ":</b> "+esc(p.student.admNo)+"</span><span><b>"+esc(bl("bl_class"))+":</b> "+esc(p.student.cls)+"-"+esc(p.student.section)+
    "</span><span><b>"+esc(bl("bl_dob"))+":</b> "+fmtDate(p.student.dob)+"</span></div>";

    return "<tr><td>"+esc(s.name)+"</td><td>"+s.max+"</td><td>"+(s.obtained==null?"—":s.obtained)+"</td></tr>";
  }).join("");
  const tbl='<div class="twrap"><table class="grid"><tr><th>'+esc(bl("bl_subject"))+"</th><th class=\"num\">"+esc(bl("bl_max"))+
    "</th><th class=\"num\">"+esc(bl("bl_obtained"))+"</th></tr>"+rows+
    '<tr class="totalrow"><td>'+esc(bl("bl_total"))+'</td><td class="num">'+p.maxTotal+'</td><td class="num">'+(p.total==null?"—":p.total)+"</td></tr></table></div>";
  const sum='<div class="rc-sum"><span class="chip">'+esc(bl("bl_pct"))+": "+(p.pct==null?"—":p.pct.toFixed(1)+"%")+"</span>"+
    '<span class="chip">'+esc(bl("bl_grade"))+": "+p.grade+'</span><span class="chip">'+esc(bl("bl_division"))+": "+p.division+'</span>'+
    '<span class="chip">'+esc(bl("bl_position"))+": "+(p.position==null?"—":p.position)+'</span>'+

  const vfy=(p.verifyCode&&p.verifySchool&&p.verifySchool!=="local")?verifyBlockHTML(p.verifyCode,p.verifyUrl):"";
  return '<div class="rc-page"><div class="rcard">'+head+id+tbl+sum+

function askNorm(q){
  q=String(q||"").toLowerCase();
  const bd={"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9","۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9","०":"0","१":"1","२":"2","३":"3","४":"4","५":"5","६":"6","७":"7","८":"8","९":"9","٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
  return q.replace(/[০-৯۰-۹०-९٠-٩]/g,function(c){return bd[c]||c;}).replace(/\s+/g," ").trim();
}
function askFindStudent(q){
  const nq=askNorm(q);
  let best=null;
  (db().students||[]).forEach(function(s){
    const nm=askNorm(s.name);
    if(nm&&nq.indexOf(nm)>=0&&(!best||nm.length>askNorm(best.name).length))best=s;
  });
  return best;
}
function askFindClass(q){
  const m=askNorm(q).match(/(?:class|grade|کلاس|শ্রেণি|শ্রেণী|कक्षा|कक्षा|darasa|صف)\s*[- ]?\s*(\d{1,2})/);
  return m?m[1]:null;
}

function askAnswer(q){
  const nq=askNorm(q);
  if(!nq)return null;
  const st=askFindStudent(q), cls=askFindClass(q);
  let best=null,bestLen=0;
  ASK_INTENTS.forEach(function(it){
    it.kw.forEach(function(k){
      if(nq.indexOf(k)>=0&&k.length>bestLen){best=it;bestLen=k.length;}
    });
  });
  if(!best)return null;
  return askBuild(best.id,st,cls,q);
}

/* ---- ROUND 25: AI engine (Gemini, layers 2-3) ----
   Layer 1 (local intents) still answers first and works offline with no key.
   When it cannot answer and the school has a free Gemini key (Settings), the
   question goes to Gemini with a COMPACT school summary — counts, class
   lists, exam names, fee totals — never the whole database. If the question
   names a student, only that student's fee + attendance figures are added.
   Google Search grounding is on, so general questions (board dates, rules)
   are answered from the web and labelled with their sources. The key lives
   in this school's own settings; it is never baked into the app file (the
   file is public) and it is stripped from JSON backups. */
const GEMINI_MODEL="gemini-3.8-flash";
function geminiKey(){
  if(typeof Cloud!=="undefined"&&Cloud.enabled&&Cloud.platformKey)return String(Cloud.platformKey).trim();
  return String(((db().settings||{}).geminiKey)||"").trim();
}
function attMonthPct(studentId,month){
  const att=db().attendance||{};let tot=0,pres=0;
  Object.keys(att).forEach(function(date){
    if(date.slice(0,7)!==month)return;
    const v=att[date][studentId];if(!v)return;
    tot++;if(v==="P"||v==="L")pres++;
  });
  return tot?Math.round(pres/tot*100):null;
}
function askGeminiSummary(){
  const d=db(),m=todayISO().slice(0,7),lines=[];
  lines.push("School: "+(d.settings.schoolName||"—"));
  lines.push("Students: "+d.students.length);
  const byCls={};d.students.forEach(function(s){byCls[s.cls]=(byCls[s.cls]||0)+1;});
  lines.push("By class: "+Object.keys(byCls).sort().map(function(c){return "class "+c+": "+byCls[c];}).join(", "));
  lines.push("Exams: "+(d.exams.map(function(e){return e.name+" ("+e.year+", "+(e.term==="mid"?"mid-term":"final")+", class "+e.cls+")";}).join("; ")||"none yet"));
  let due=0,paid=0,defn=0;
  d.students.forEach(function(s){const b=feeBill(s.id,m);due+=Math.max(0,b.total-b.discount+b.fine);paid+=b.paid;if(b.balance>0)defn++;});
  lines.push("Fees "+m+": total due "+due+", collected "+paid+", students with a balance: "+defn);
  const low=(d.labItems||[]).filter(function(l){return Number(l.qty||0)<=Number(l.min||0);});
  lines.push("Low lab stock: "+(low.length?low.map(function(l){return l.name;}).join(", "):"none"));
  const at=attSummary(todayISO());
  lines.push("Attendance today: "+at.P+" present, "+at.A+" absent, "+at.unmarked+" unmarked of "+at.total);
  const sa=staffAttSummary(todayISO());
  lines.push("Staff attendance today: "+sa.P+" present, "+sa.A+" absent, "+sa.unmarked+" unmarked of "+sa.total);
  const ss2=salarySummary(m);
  lines.push("Salaries "+m+": total net "+ss2.total+", paid "+ss2.paid+", outstanding "+ss2.outstanding+", unpaid staff: "+ss2.unpaid);
  return lines.join("\n");
}
function geminiCall(key,body){
  if(typeof fetch==="undefined")return Promise.reject(new Error("no fetch"));
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODEL+":generateContent?key="+encodeURIComponent(key),{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
  }).then(function(res){
    return res.json().then(function(b){return {status:res.status,body:b};}).catch(function(){return {status:res.status,body:null};});
  });
}
/* Why a call failed, from the HTTP status alone. 400 = the key is wrong;
   403 = the key/project may not use this API; 404 = the model name is
   retired; 429 = too many tries. "net" = no connection at all. */
function geminiReason(status,body){
  if(!status)return "net";
  if(status===400)return "invalid_key";
  if(status===403)return "not_allowed";
  if(status===404)return "model";
  if(status===429)return "busy";
  return "other";
}
function geminiPing(key){
  if(!key)return Promise.resolve({ok:false,reason:"no_key"});
  return geminiCall(key,{contents:[{parts:[{text:"Reply with the single word OK."}]}],generationConfig:{temperature:0}})
    .then(function(r){
      if(r.status!==200)return {ok:false,reason:geminiReason(r.status,r.body)};
      const c=(((r.body||{}).candidates)||[])[0],parts=(c&&c.content&&c.content.parts)||[];
      return parts.some(function(p){return (p.text||"").trim().length>0;})?{ok:true}:{ok:false,reason:"empty"};
    }).catch(function(){return {ok:false,reason:"net"};});
}
function askGemini(q){
  const key=geminiKey();
  if(!key)return Promise.resolve({ok:false,error:"gemini_no_key"});
  const st=askFindStudent(q),m=todayISO().slice(0,7);
  let ctx=askGeminiSummary();
  if(st){
    const b=feeBill(st.id,m),pct=attMonthPct(st.id,m);
    ctx+="\nStudent in question: "+displayName(st)+", class "+clsLabel(st.cls,st.section)+", "+st.admNo+
      ". Fee "+m+": due "+Math.max(0,b.total-b.discount+b.fine)+", paid "+b.paid+", balance "+b.balance+
      ". Attendance this month: "+(pct==null?"no record":pct+"%")+".";
  }
  const isDraft=/^(draft|write|compose|\u0644\u06a9\u06be\u06cc\u06ba|\u0644\u06a9\u06be\u0648|\u09b2\u09bf\u0996\u09c1\u09a8|\u09b2\u09c7\u0996\u09cb)/i.test(String(q||"").trim());
  const sys="You are the school record assistant for a small school in Pakistan. Answer ONLY from the school data below. If the data cannot answer the question, use Google Search and say the answer came from the web. Reply in the user's language (Urdu, English, Bengali, Hindi, Nepali, Swahili or Arabic — match the question). Be brief and plain."+(isDraft?" Draft the message so it is ready to send on WhatsApp.":"");
  return geminiCall(key,{
    systemInstruction:{parts:[{text:sys}]},
    contents:[{parts:[{text:"SCHOOL DATA:\n"+ctx+"\n\nQUESTION:\n"+q}]}],
    tools:[{googleSearch:{}}],
    generationConfig:{temperature:0.2}
  }).then(function(r){
    if(r.status!==200){
      const rs=geminiReason(r.status,r.body);
      return {ok:false,error:rs==="invalid_key"||rs==="not_allowed"?"gemini_key_bad":rs==="model"?"gemini_model":rs==="busy"?"gemini_busy":"gemini_offline"};
    }
    const data=r.body||{};
    const cand=(data.candidates||[])[0];
    if(!cand)return {ok:false,error:"gemini_empty"};
    const text=((cand.content&&cand.content.parts)||[]).map(function(p){return p.text||"";}).join("");
    if(!text.trim())return {ok:false,error:"gemini_empty"};
    const chunks=((cand.groundingMetadata||{}).groundingChunks||[]).map(function(c){return c.web;}).filter(Boolean);
    return {ok:true,text:text,sources:chunks,isDraft:isDraft};
  }).catch(function(){return {ok:false,error:"gemini_offline"};});
}
function geminiAnswerHTML(r){
  let h='<div class="card" style="margin-top:.4rem"><div class="muted">✨ '+esc(t("gemini_label"))+'</div>'+
    '<div id="gemini-answer" style="white-space:pre-wrap">'+esc(r.text)+'</div>';
  if(r.sources&&r.sources.length){
    h+='<div style="margin-top:.4rem"><b>'+esc(t("gemini_sources"))+':</b> '+
      r.sources.map(function(s){return '<a href="'+esc(s.uri)+'" target="_blank" rel="noopener">'+esc(s.title||s.uri)+'</a>';}).join(" • ")+'</div>';
  }
  h+='<div class="toolbar"><button type="button" class="btn btn-sm" id="gemini-copy">'+esc(t("gemini_copy"))+'</button> '+
    '<button type="button" class="btn btn-sm" id="gemini-speak">🔊 '+esc(t("gemini_speak"))+'</button></div></div>';
  return h;
}
function speakText(text){
  if(typeof speechSynthesis==="undefined"||typeof SpeechSynthesisUtterance==="undefined")return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text||""));
    u.lang=speechLang();
    speechSynthesis.speak(u);
  }catch(e){}
}
function copyText(text,btn){
  const done=function(){if(btn)btn.textContent=t("gemini_copied");};
  if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(text||"")).then(done).catch(function(){});
  }
}

/* First-run guide: the 5 steps a new school does first, each with a
   button that opens the right tab. When all are done it collapses to
   one line. The timetable step only appears while that module is on. */
function setupSteps(){
  const d=db(),steps=[];
  steps.push({key:"setup_step_school",done:!!(d.settings&&String(d.settings.schoolName||"").trim()),tab:"settings"});
  steps.push({key:"setup_step_students",done:(d.students||[]).length>0,tab:"adm"});
  steps.push({key:"setup_step_fees",done:!feesOn()||(d.feeHeads||[]).length>0,tab:"fee"});
  if(ttOn())steps.push({key:"setup_step_tt",done:Object.keys(d.timetable||{}).length>0,tab:"tt"});
  const anyMarks=Object.keys(d.marks||{}).some(function(e){return Object.keys((d.marks||{})[e]||{}).length>0;});
  steps.push({key:"setup_step_results",done:anyMarks,tab:"result"});
  return steps;
}
function setupCardHTML(){
  const steps=setupSteps(),done=steps.filter(function(x){return x.done;}).length;
  if(done===steps.length)return '<div class="card"><b>✓ '+esc(t("setup_done"))+'</b></div>';
  let h='<div class="card"><h3>🧭 '+esc(t("setup_title"))+'</h3>';
  steps.forEach(function(st){
    h+='<div class="toolbar" style="margin:.25rem 0"><span>'+(st.done?"✅ ":"○ ")+esc(t(st.key))+'</span>';
    if(!st.done)h+='<button type="button" class="btn btn-sm" data-go="'+st.tab+'">'+esc(t("setup_go"))+"</button>";
    h+='</div>';
  });
  return h+'</div>';
}

/* ---- morning briefing: what needs attention today, from local data only ---- */
function briefingHTML(){
  const today=todayISO(),m=today.slice(0,7),items=[];
  if(attOn()){
    const at=attSummary(today);
    items.push(t("brief_att")+": "+at.P+" "+t("att_p")+", "+at.A+" "+t("att_a")+(at.unmarked?", "+at.unmarked+" "+t("brief_unmarked"):"")+" / "+at.total);
  }
  if(feesOn()){
    let defn=0,defAmt=0;
    db().students.forEach(function(s){const b=feeBill(s.id,m);if(b.balance>0){defn++;defAmt+=b.balance;}});
    const sym=(countryPack(schoolCountry())||{}).sym||"";
    items.push(t("brief_fees")+": "+defn+" "+t("brief_students")+" — "+sym+" "+defAmt+" "+t("brief_outstanding"));
  }
  if(attOn()){
    const flags=attFlags(m);
    if(flags.length)items.push(t("brief_flags")+": "+flags.length+" "+t("brief_students"));
  }
  if(staffOn()){
    const sa=staffAttSummary(today);
    if(sa.A)items.push(t("brief_staff")+": "+sa.A);
    const ss=salarySummary(m);
    if(ss.outstanding>0){const sym2=(countryPack(schoolCountry())||{}).sym||"";items.push(t("brief_salary")+": "+sym2+" "+ss.outstanding);}
  }
  if(labOn()){
    const low=(db().labItems||[]).filter(function(l){return Number(l.qty||0)<=Number(l.min||0);});
    if(low.length)items.push(t("brief_stock")+": "+low.map(function(l){return l.name;}).join(", "));
  }
  if(transportOn()){
    const nTr=(db().students||[]).filter(function(s){return s.transport&&s.transport.routeId;}).length;
    if(nTr)items.push(t("brief_transport")+": "+nTr);
  }
  if(libOn()){
    const nOver=libOverdue().length;
    if(nOver)items.push(t("brief_lib_overdue")+": "+nOver);
  }
  if(admAppOn()){
    const nApp=pendingApplications().length;
    if(nApp)items.push(t("brief_applications")+": "+nApp);
  }
  if(cmpOn()){
    const nCmp=openComplaints().length;
    if(nCmp)items.push(t("brief_complaints")+": "+nCmp);
  }
  if(typeof Cloud==="undefined"||!Cloud.enabled||Cloud.isSuperAdmin){
    const nSg=pendingSignups().length;
    if(nSg)items.push(t("brief_signups")+": "+nSg);
  }
  if(hwOn()){
    const dueT=hwDueCount(today);
    const dp=today.split("-");const dObj=new Date(Number(dp[0]),Number(dp[1])-1,Number(dp[2])+1);
    const tmr=dObj.getFullYear()+"-"+String(dObj.getMonth()+1).padStart(2,"0")+"-"+String(dObj.getDate()).padStart(2,"0");
    const dueTm=hwDueCount(tmr);
    if(dueT||dueTm)items.push(t("hw_due_today")+": "+dueT+" • "+t("hw_due_tomorrow")+": "+dueTm);
  }
  if(typeof Cloud!=="undefined"&&Cloud.enabled&&Cloud.school){
    const d=subDue(Cloud.school);
    if(d.state!=="active")items.push(t("brief_renew")+": "+(d.state==="overdue"?t("sub_overdue"):t("sub_due_in").replace("{days}",d.days)));
  }
  if(!items.length)return "";
  return '<div class="card"><h3>☀️ '+esc(t("brief_title"))+'</h3><ul>'+
    items.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul></div>";
}

function kpi(n,l){return '<div class="kpi"><div class="n">'+n+'</div><div class="l">'+esc(l)+"</div></div>";}
function drawDir(){
  const box=$("dir-list");if(!box)return;
  const needle=norm(dirQ);
  const list=studentsOfAll().filter(function(s){
    if(dirCls&&s.cls!==dirCls)return false;
    if(dirSec&&s.section!==dirSec)return false;
    /* identity rule: search matches name + father's name together */
    return !needle||norm(s.name).indexOf(needle)>=0||norm(s.fatherName).indexOf(needle)>=0||norm(s.admNo).indexOf(needle)>=0;
  });
  const rows=list.slice(0,dirLimit).map(function(s){
    return '<button type="button" class="btn" style="display:block;width:100%;text-align:start;margin:.3rem 0" data-open="'+s.id+'">'+
      '<span class="idrow">'+studentPhotoHTML(s,44)+"<span><b>"+esc(displayName(s))+"</b><br><span class=\"muted\">"+esc(s.admNo)+" • "+esc(clsLabel(s.cls,s.section))+
      " • "+t("dob")+": "+fmtDate(s.dob)+"</span></span></span></button>";
  }).join("")+(list.length>dirLimit?'<button type="button" class="btn" id="dir-more" style="width:100%;margin:.4rem 0">'+esc(t("show_more"))+" ("+list.length+")</button>":"");
  box.innerHTML=rows||(studentsOfAll().length?'<p class="muted">'+esc(t("no_records"))+"</p>":emptyStateHTML(t("es_dir_t"),t("es_dir_h"),t("es_dir_b"),"adm"));
  const dm=$("dir-more");if(dm)dm.onclick=function(){dirLimit+=50;drawDir();};
  Array.prototype.forEach.call(box.querySelectorAll("[data-open]"),function(b){
    b.onclick=function(){dossierId=b.getAttribute("data-open");render();};
  });
}
function afterHome(){
  bindMic();
  const aq=$("ask-q"),ag=$("ask-go"),ao=$("ask-out");
  const bindAskAnswer=function(){
    const cp=$("gemini-copy"),sp=$("gemini-speak");
    if(cp)cp.onclick=function(){copyText($("gemini-answer").innerText,cp);};
    if(sp)sp.onclick=function(){speakText($("gemini-answer").innerText);};
  };
  const runAsk=function(){
    if(!aq||!ao)return;
    const q=aq.value;
    const ans=askAnswer(q);
    if(ans){ao.innerHTML=ans;bindAskAnswer();return;}
    if(!geminiKey()){
      ao.innerHTML=askHelpHTML()+'<p class="muted">✨ '+esc(t("gemini_hint_short"))+'</p>';
      Array.prototype.forEach.call(document.querySelectorAll(".ask-ex"),function(b){b.onclick=function(){aq.value=b.getAttribute("data-q");runAsk();};});
      return;
    }
    ao.innerHTML='<div class="msg">'+esc(t("gemini_thinking"))+'</div>';
    askGemini(q).then(function(r){
      if(!r.ok){ao.innerHTML=askHelpHTML()+'<div class="msg err">'+esc(t(r.error||"gemini_offline"))+'</div>';}
      else{ao.innerHTML=geminiAnswerHTML(r);}
      bindAskAnswer();
      Array.prototype.forEach.call(document.querySelectorAll(".ask-ex"),function(b){b.onclick=function(){aq.value=b.getAttribute("data-q");runAsk();};});
    });
    Array.prototype.forEach.call(document.querySelectorAll(".ask-ex"),function(b){
      b.onclick=function(){aq.value=b.getAttribute("data-q");runAsk();};
    });
  };
  if(ag)ag.onclick=runAsk;
  if(aq)aq.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();runAsk();}});
  drawDir();
  if(dossierId)afterDossier();
  $("dir-q").oninput=function(e){dirQ=e.target.value;dirLimit=50;drawDir();};
  $("dir-cls").onchange=function(e){dirCls=e.target.value;dirLimit=50;drawDir();};
  $("dir-sec").onchange=function(e){dirSec=e.target.value;dirLimit=50;drawDir();};
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){
    b.onclick=function(){curTab=b.getAttribute("data-go");render();};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-exgo]"),function(b){
    b.onclick=function(){curExamId=b.getAttribute("data-exgo");curTab="exam";render();};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-clsgo]"),function(b){
    b.onclick=function(){
      const k=b.getAttribute("data-clsgo").split("-");
      dirCls=k[0]||"";dirSec=k.slice(1).join("-")||"";
      const sc=$("dir-cls"),ss=$("dir-sec");
      if(sc)sc.value=dirCls;if(ss)ss.value=dirSec;
      drawDir();if(typeof window!=="undefined")window.scrollTo(0,0);
    };
  });
  /* two-step promotion: arm → confirm → execute */
  const pa=$("p-arm");
  if(pa)pa.onclick=function(){
    const fc=$("p-fcls").value,fs=$("p-fsec").value,tc=$("p-tcls").value.trim(),ts=$("p-tsec").value.trim();
    const n=studentsOf(fc,fs).length;
    if(!n){$("p-msg").innerHTML='<div class="msg err">'+esc(t("no_records"))+"</div>";return;}
    if(!tc){$("p-msg").innerHTML='<div class="msg err">'+esc(t("req"))+"</div>";return;}
    promoteArm={fc:fc,fs:fs,tc:tc,ts:ts,from:clsLabel(fc,fs),to:clsLabel(tc,ts),count:n};
    render();
  };
  const pg=$("p-go");
  if(pg)pg.onclick=function(){
    const r=promoteClass(promoteArm.fc,promoteArm.fs,promoteArm.tc,promoteArm.ts);
    promoteArm=null;
    promoteMsg=r.ok?(r.count+" "+t("promote_done")):r.error;
    render();
  };
  const pc=$("p-cancel");
  if(pc)pc.onclick=function(){promoteArm=null;render();};
  const so=$("idscan-open");
  if(so)so.onclick=function(){idScanOpen=!idScanOpen;if(!idScanOpen)idStopScan();render();};
  const ss=$("idscan-start");
  if(ss)ss.onclick=function(){idStartScan();};
  const stp=$("idscan-stop");
  if(stp)stp.onclick=function(){idStopScan();};
  const sf=$("idscan-file");
  if(sf)sf.onchange=function(){
    const f=sf.files[0];if(!f)return;
    idDecodeScanFile(f).then(function(r){
      idScanMsg(r.ok?'<div class="msg ok">'+esc(t("idscan_found"))+'</div>'
                   :'<div class="msg err">'+esc(t(r.error||"idscan_no_qr"))+'</div>');
    });
  };
}

let scanState=null;

function paintScan(){
  const box=$("scan-body");if(!box||!scanState)return;
  const S=scanState;
  if(S.phase==="cleaning"){box.innerHTML='<p class="muted">🤖 '+esc(t("scan_cleaning"))+"</p>";return;}
  if(S.phase==="reading"){box.innerHTML='<p class="muted">🤖 '+esc(t("scan_reading"))+"</p>";return;}
  if(S.phase==="done"){box.innerHTML='<div class="msg okm">'+esc(S.doneMsg||"")+"</div>";return;}
  if(S.phase==="error"){box.innerHTML='<div class="msg err">'+esc(S.error||"Error")+"</div>";return;}
  if(S.phase==="noengine"){
    box.innerHTML='<div class="msg warnm">'+esc(t("scan_no_engine"))+"</div>"+
      (S.cleaned?'<img class="regphoto-img" src="'+S.cleaned+'" alt="">':"")+
      '<div class="toolbar"><button type="button" class="btn btn-sm" id="scan-pin">'+esc(t("scan_pin"))+"</button></div>";
    const sp=$("scan-pin");
    if(sp)sp.onclick=function(){
      const du=S.cleaned||"";
      if(du.length>410000){alert(t("photo_big"));return;} /* ~300KB guard on bytes */
      db().settings.regPhotoDataUrl=du;Store.save();render();
    };
    return;
  }
  if(S.phase==="review"){paintScanReview();}
}
function scanVal(i,f,fb){const e=scanState.edits[i];return (e&&e[f]!==undefined)?e[f]:fb;}
function scanFieldEd(i,f,labelKey,fldV,kind){
  const cur=scanVal(i,f,fldV.v);
  const E=scanState.edits[i]||{};
  const bad=fldV.conf!=="high";
  if(!bad&&!E[f+"_open"]){
    return '<div class="field"><label>'+esc(t(labelKey))+'</label>'+
      '<div class="rev-val" data-sf="'+i+":"+f+'">'+esc(cur||"—")+' <span class="flag okf">✓</span> <span>✏️</span></div></div>';
  }
  let inp;
  if(kind==="date")inp='<input data-si="'+i+":"+f+'" type="date" value="'+esc(cur)+'"'+(bad?' class="amber"':"")+">";
  else if(kind==="gender")inp='<select data-si="'+i+":"+f+'"'+(bad?' class="amber"':"")+"><option value=\"\">—</option>"+
    '<option value="male"'+(cur==="male"?" selected":"")+'>'+esc(t("male"))+'</option>'+
    '<option value="female"'+(cur==="female"?" selected":"")+'>'+esc(t("female"))+"</option></select>";
  else inp='<input data-si="'+i+":"+f+'" value="'+esc(cur)+'"'+(bad?' class="amber"':"")+">";
  return '<div class="field"><label>'+esc(t(labelKey))+(bad?' <span class="flag">!</span>':"")+"</label>"+inp+"</div>";
}

    P.unread.map(function(u){return "• "+esc(u.line);}).join("<br>")+"</div>";

function paintScanReview(){
  const box=$("scan-body");if(!box)return;
  const S=scanState,P=S.parsed;
  let h="";
  if(!P.rows.length){
    h='<div class="msg warnm">'+esc(t("scan_none"))+"</div>"+scanUnreadHTML(P);
  }else{
    h='<p><b>'+P.rows.length+'</b> '+esc(t("scan_rows_found"))+" — "+esc(t("scan_review"))+"</p>";
    h+='<div class="field"><label>'+esc(t("adm_date"))+" ("+esc(t("scan_batch"))+")</label>"+
       '<input type="date" id="scan-admdate" value="'+esc(S.admDate||todayISO())+'"></div>';
    P.rows.forEach(function(r,i){
      h+='<div class="regphoto"><b>#'+(i+1)+'</b><div class="grid2">'+
        scanFieldEd(i,"name","f_name",r.name)+
        scanFieldEd(i,"fatherName","father_name",r.fatherName)+
        scanFieldEd(i,"dob","dob",r.dob,"date")+
        scanFieldEd(i,"gender","gender",r.gender,"gender")+
        scanFieldEd(i,"cls","cls",r.cls)+
        scanFieldEd(i,"section","section",r.section)+
        "</div></div>";
    });
    h+=scanUnreadHTML(P);
    h+='<button type="button" class="btn btn-primary" id="scan-saveall">'+esc(t("scan_save_all"))+'</button> <span id="scan-smsg"></span>';
  }
  box.innerHTML=h;
  bindScanReview();
}
function bindScanReview(){
  const box=$("scan-body");if(!box)return;
  const sa=$("scan-admdate");
  if(sa)sa.onchange=function(){scanState.admDate=sa.value;};
  Array.prototype.forEach.call(box.querySelectorAll("[data-sf]"),function(el){
    el.onclick=function(){
      const p=el.getAttribute("data-sf").split(":");
      const i=+p[0],f=p[1];
      scanState.edits[i]=scanState.edits[i]||{};
      scanState.edits[i][f+"_open"]=true;
      paintScan();
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-si]"),function(inp){
    inp.oninput=function(){
      const p=inp.getAttribute("data-si").split(":");
      const i=+p[0],f=p[1];
      scanState.edits[i]=scanState.edits[i]||{};
      scanState.edits[i][f]=inp.value;
    };
  });
  const sv=$("scan-saveall");
  if(sv)sv.onclick=commitScanReview;
}
function commitScanReview(){
  const S=scanState,P=S.parsed;
  const rows=P.rows.map(function(r,i){
    function gv(f){return scanVal(i,f,r[f].v);}
    return {name:gv("name"),fatherName:gv("fatherName"),dob:gv("dob"),gender:gv("gender"),
      cls:gv("cls"),section:gv("section"),admDate:S.admDate||todayISO(),contact:"",address:""};
  });
  const res=commitScanRows(rows);
  if(res.ok){
    S.phase="done";S.doneMsg=res.count+" "+t("scan_saved")+".";
    S.parsed={rows:[],unread:[]};S.edits={};
    paintScan();
  }else{
    const m2=$("scan-smsg");
    if(m2)m2.innerHTML='<div class="msg err">'+res.errors.map(function(e){return "• "+esc(e);}).join("<br>")+"</div>";
  }
}
/* round 3: paste copied text (e.g. from Google Lens) straight into the
   existing scan chain: parseRegisterLines → smart review → commitScanRows.
   No new parser — pure wiring. */
function scanFromText(text){
  const P=parseRegisterLines(String(text==null?"":text));
  return {ok:true,parsed:P};
}
function bindScan(){
  const fi=$("idscan-file");
  if(fi)fi.onchange=function(){
    const f=fi.files[0];if(!f)return;
    scanState={phase:"cleaning",photo:"",cleaned:"",ocrText:"",
      parsed:{rows:[],unread:[]},edits:{},admDate:todayISO()};
    paintScan();
    runScanFlow(f);
  };
  /* round 3: paste copied text (Google Lens) into the existing review chain */
  const pb=$("scan-pastebtn");
  if(pb)pb.onclick=function(){
    const tx=$("scan-paste").value;
    if(!String(tx).trim()){alert(t("scan_paste_empty"));return;}
    scanState={phase:"review",photo:"",cleaned:"",ocrText:String(tx),
      parsed:scanFromText(tx).parsed,edits:{},admDate:todayISO()};
    paintScan();
  };
  if(scanState)paintScan(); /* restore in-progress review after re-render */
}
async function runScanFlow(file){
  try{
    const orig=await fileToDataURLScan(file);
    scanState.photo=orig;
    const cleaned=await preprocessForOCR(orig);
    scanState.cleaned=cleaned;
    if(!ocrEngine()){scanState.phase="noengine";paintScan();return;}
    scanState.phase="reading";paintScan();
    const text=await ocrRecognize(cleaned);
    scanState.ocrText=text;
    scanState.parsed=parseRegisterLines(text);
    scanState.phase="review";paintScan();
  }catch(e){
    scanState.phase="error";scanState.error=String((e&&e.message)||e);paintScan();
  }
}

function histHTML(rec){
  if(!rec.history||!rec.history.length)return '<span class="muted">—</span>';
  return rec.history.map(function(h){return "<div>"+fmtDate(h.ts.slice(0,10))+" "+h.ts.slice(11,16)+" — <b>"+esc(h.action)+"</b>: "+esc(h.summary)+"</div>";}).join("");
}

function drawGrid(){
  const box=$("e-grid");if(!box)return;
  const ex=db().exams.find(function(e){return e.id===curExamId;});
  if(!ex){box.innerHTML=emptyStateHTML(t("es_exam_t"),t("es_exam_h"),t("es_exam_b"),"exam");return;}
  const studs=studentsOf(ex.cls,ex.section);
  if(!studs.length){box.innerHTML='<p class="muted">'+esc(t("no_records"))+"</p>";return;}
  const saved=db().marks[ex.id]||{};
  let h='<div id="e-gmsg"></div><h3>'+(ex.locked?"🔒 ":"")+esc(ex.name)+'</h3>'+
    (ex.locked?'<p class="muted">🔒 '+esc(t("locked_badge"))+"</p>":"")+
    '<div class="twrap"><table class="grid"><tr><th>'+t("sno")+"</th><th>"+
    t("f_name")+"</th>"+ex.subjects.map(function(s){return '<th class="num">'+esc(s.name)+"<br>("+s.max+")</th>";}).join("")+
    '<th class="num">'+t("total")+"</th></tr>";
  studs.forEach(function(st,i){
    const m=saved[st.id]||{};
    h+="<tr><td class=\"num\">"+(i+1)+"</td><td><div class=\"idrow\">"+studentPhotoHTML(st,36)+
      "<span><b>"+esc(displayName(st))+"</b><br><span class=\"muted\">"+esc(st.admNo)+"</span></span></div></td>";
    ex.subjects.forEach(function(sj,j){
      const v=m[sj.name];h+='<td class="num"><input class="cell" data-st="'+st.id+'" data-sj="'+esc(sj.name)+'" data-max="'+sj.max+
        '" data-r="'+i+'" data-c="'+j+'" inputmode="numeric" value="'+(v==null?"":v)+'"'+(ex.locked?" disabled":"")+"></td>";
    });
    h+='<td class="num" data-rowtot="'+st.id+'">—</td></tr>';
  });
  h+='<tr class="totalrow"><td></td><td>'+esc(t("col_total"))+"</td>"+
    ex.subjects.map(function(sj){return '<td class="num" data-coltot="'+esc(sj.name)+'">—</td>';}).join("")+"<td></td></tr></table></div>"+
    (ex.locked?"":'<button type="button" class="btn btn-primary" id="e-save">'+esc(t("save"))+"</button>");
  box.innerHTML=h;
  const cells=Array.prototype.slice.call(box.querySelectorAll("input.cell"));
  const live=function(){
    const rt={},ct={};
    cells.forEach(function(c){
      const v=Number(c.value);
      if(c.value!==""&&isFinite(v)){rt[c.getAttribute("data-st")]=(rt[c.getAttribute("data-st")]||0)+v;
        ct[c.getAttribute("data-sj")]=(ct[c.getAttribute("data-sj")]||0)+v;}
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-rowtot]"),function(td){
      td.textContent=rt[td.getAttribute("data-rowtot")]||"—";});
    Array.prototype.forEach.call(box.querySelectorAll("[data-coltot]"),function(td){
      td.textContent=ct[td.getAttribute("data-coltot")]||"—";});
  };
  cells.forEach(function(c){c.oninput=function(){c.classList.remove("bad");live();};});
  /* auto-save: a valid mark saves the moment the teacher leaves the cell — no Save tap to forget */
  cells.forEach(function(c){c.onchange=function(){
    const r=String(c.value).trim();if(r==="")return;
    const v=Number(r),mx=Number(c.getAttribute("data-max"));
    if(!isFinite(v)||v<0||v>mx){c.classList.add("bad");return;}
    const res=setMark(ex.id,c.getAttribute("data-st"),c.getAttribute("data-sj"),c.value);
    if(res.ok)Store.save();
  };});
  live();
  /* keyboard: Tab moves across (native), Enter moves down one row, same subject */
  box.addEventListener("keydown",function(e){
    if(e.key!=="Enter")return;
    const tg=e.target;
    if(!tg.classList||!tg.classList.contains("cell"))return;
    e.preventDefault();
    const nx=box.querySelector('input.cell[data-r="'+(+tg.getAttribute("data-r")+1)+'"][data-c="'+tg.getAttribute("data-c")+'"]');
    if(nx)nx.focus();else{const sv=$("e-save");if(sv)sv.focus();}
  });
  const sv=$("e-save");
  if(!sv)return;
  sv.onclick=function(){
    /* two-pass: validate everything first, save nothing until all valid */
    const errs=[];
    cells.forEach(function(c){
      const r=String(c.value).trim(),mx=Number(c.getAttribute("data-max"));
      let e=null;
      if(r==="")e=t("v_required");
      else{const v=Number(r);if(!isFinite(v))e=t("v_number");else if(v<0||v>mx)e=t("v_range")+" "+mx+".";}
      if(e){errs.push(e);c.classList.add("bad");}
    });
    if(errs.length){$("e-gmsg").innerHTML='<div class="msg err">'+esc(t("v_fix"))+" ("+errs.length+")</div>";return;}
    cells.forEach(function(c){setMark(ex.id,c.getAttribute("data-st"),c.getAttribute("data-sj"),c.value);});
    Store.save();
    const ex2=db().exams.find(function(e){return e.id===ex.id;});
    audit("save-marks",ex2.name+": "+cells.length+" cells");
    $("e-gmsg").innerHTML='<div class="msg okm">'+esc(t("v_saved"))+"</div>";
  };
}

board_term_err:{en:"Classes 8th–10th take only the mid-term exam in school — their final exam is the board exam.",ur:"8ویں تا 10ویں جماعت کا اسکول میں صرف ششماہی امتحان ہوتا ہے — سالانہ امتحان بورڈ کا ہوتا ہے۔",bn:"৮ম–১০ম শ্রেণি স্কুলে শুধু অর্ধবার্ষিক পরীক্ষা দেয় — তাদের বার্ষিক পরীক্ষা বোর্ড নেয়।",hi:"कक्षा 8–10 स्कूल में केवल मध्य-सत्र परीक्षा देती हैं — उनकी अंतिम परीक्षा बोर्ड परीक्षा होती है।",ne:"कक्षा ८–१० ले विद्यालयमा मध्य-सत्र परीक्षा मात्र दिन्छन् — तिनको अन्तिम परीक्षा बोर्ड परीक्षा हो।",sw:"Madarasa ya 8–10 hufanya mtihani wa katikati ya muhula pekee shuleni — mtihani wao wa mwisho ni mtihani wa bodi.",ar:"صفوف 8–10 تعقد امتحان منتصف الفصل فقط في المدرسة — أما امتحانها النهائي فهو امتحان المجلس."},
board_note:{en:"Board class: only the mid-term (ششماہی) exam is held in school; the final exam is taken by the board.",ur:"بورڈ جماعت: اسکول میں صرف ششماہی امتحان ہوتا ہے؛ سالانہ امتحان بورڈ لیتا ہے۔",bn:"বোর্ডের শ্রেণি: স্কুলে শুধু অর্ধবার্ষিক পরীক্ষা হয়; বার্ষিক পরীক্ষা বোর্ড নেয়।",hi:"बोर्ड कक्षा: स्कूल में केवल मध्य-सत्र (ششماہی) परीक्षा होती है; अंतिम परीक्षा बोर्ड लेता है।",ne:"बोर्ड कक्षा: विद्यालयमा मध्य-सत्र (ششماہی) परीक्षा मात्र हुन्छ; अन्तिम परीक्षा बोर्डले लिन्छ।",sw:"Darasa la bodi: mtihani wa katikati ya muhula (ششماہی) pekee hufanyika shuleni; mtihani wa mwisho hufanywa na bodi.",ar:"صف المجلس: يُعقد امتحان منتصف الفصل (ششماہی) فقط في المدرسة؛ أما الامتحان النهائي فيعقده المجلس."},
login_title:{en:"Teacher sign-in",ur:"استاد سائن ان",bn:"শিক্ষক সাইন-ইন",hi:"शिक्षक साइन-इन",ne:"शिक्षक साइन-इन",sw:"Ingia kwa mwalimu",ar:"تسجيل دخول المعلم"},
login_hint:{en:"Only allowed teachers can open this tool. Sign in with your teacher email and password.",ur:"صرف مجاز اساتذہ یہ ٹول کھول سکتے ہیں۔ اپنے استاد ای میل اور پاس ورڈ سے سائن ان کریں۔",bn:"শুধু অনুমোদিত শিক্ষকরাই এই টুলটি খুলতে পারেন। আপনার শিক্ষক ইমেইল ও পাসওয়ার্ড দিয়ে সাইন-ইন করুন।",hi:"केवल अनुमति प्राप्त शिक्षक ही यह टूल खोल सकते हैं। अपने शिक्षक ईमेल और पासवर्ड से साइन इन करें।",ne:"अनुमति प्राप्त शिक्षकले मात्र यो उपकरण खोल्न सक्छन्। तपाईंको शिक्षक इमेल र पासवर्डले साइन इन गर्नुहोस्।",sw:"Walimu walioidhinishwa pekee ndio wanaweza kufungua zana hii. Ingia kwa barua pepe na nenosiri lako la ualimu.",ar:"يمكن للمعلمين المسموح لهم فقط فتح هذه الأداة. سجّل الدخول ببريدك الإلكتروني وكلمة مرورك كمعلم."},

login_notallowed:{en:"This account is not an allowed teacher. Ask the school admin to add it.",ur:"یہ اکاؤنٹ مجاز استاد نہیں ہے۔ اسکول ایڈمن سے اسے شامل کرنے کو کہیں۔",bn:"এই অ্যাকাউন্টটি অনুমোদিত শিক্ষক নয়। স্কুলের অ্যাডমিনকে যোগ করতে বলুন।",hi:"यह खाता अनुमति प्राप्त शिक्षक का नहीं है। स्कूल एडमिन से इसे जोड़ने को कहें।",ne:"यो खाता अनुमति प्राप्त शिक्षक होइन। विद्यालयका एडमिनलाई थप्न भन्नुहोस्।",sw:"Akaunti hii si ya mwalimu aliyeidhinishwa. Mwombe msimamizi wa shule aiongeze.",ar:"هذا الحساب ليس معلمًا مسموحًا به. اطلب من مدير المدرسة إضافته."},
login_reauth:{en:"For safety, sign out and sign in again, then try.",ur:"حفاظت کے لیے سائن آؤٹ کر کے دوبارہ سائن ان کریں، پھر کوشش کریں۔",bn:"নিরাপত্তার জন্য, সাইন-আউট করে আবার সাইন-ইন করুন, তারপর চেষ্টা করুন।",hi:"सुरक्षा के लिए, साइन आउट करके फिर से साइन इन करें, फिर प्रयास करें।",ne:"सुरक्षाका लागि, साइन आउट गरेर फेरि साइन इन गर्नुहोस्, त्यसपछि प्रयास गर्नुहोस्।",sw:"Kwa usalama, toka na uingie tena, kisha ujaribu.",ar:"للسلامة، سجّل الخروج ثم سجّل الدخول مرة أخرى وحاول."},

sub_expired:{en:"Subscription expired — the tool is read-only. Renew to keep entering data.",ur:"سبسکرپشن ختم ہو گئی ہے — ٹول صرف دیکھنے کے لیے ہے۔ ڈیٹا داخل کرنے کے لیے تجدید کروائیں۔",bn:"সদস্যতার মেয়াদ শেষ — টুলটি এখন শুধু পড়ার জন্য। ডেটা লিখতে নবায়ন করুন।",hi:"सब्सक्रिप्शन समाप्त — टूल अब केवल पढ़ने के लिए है। डेटा दर्ज करते रहने के लिए नवीनीकरण करें।",ne:"सदस्यता समाप्त भयो — उपकरण अब पढ्न मात्र मिल्छ। डाटा भर्न जारी राख्न नवीकरण गर्नुहोस्।",sw:"Usajili umeisha — zana ni ya kusoma tu. Fanya upya ili kuendelea kuingiza data.",ar:"انتهى الاشتراك — الأداة للقراءة فقط. جدّد لمواصلة إدخال البيانات."},
sub_renew:{en:"To renew, pay via JazzCash / EasyPaisa / bank transfer and tell the admin — the subscription is switched on after payment.",ur:"تجدید کے لیے JazzCash / EasyPaisa / بینک ٹرانسفر سے ادائیگی کریں اور ایڈمن کو بتائیں — ادائیگی کے بعد سبسکرپشن آن کر دی جائے گی۔",bn:"নবায়ন করতে JazzCash / EasyPaisa / ব্যাংক ট্রান্সফারে পেমেন্ট করে অ্যাডমিনকে জানান — পেমেন্টের পর সদস্যতা চালু করা হবে।",hi:"नवीनीकरण के लिए JazzCash / EasyPaisa / बैंक ट्रांसफ़र से भुगतान करें और एडमिन को बताएं — भुगतान के बाद सब्सक्रिप्शन चालू कर दिया जाएगा।",ne:"नवीकरण गर्न JazzCash / EasyPaisa / बैंक स्थानान्तरणबाट भुक्तानी गरी एडमिनलाई भन्नुहोस् — भुक्तानीपछि सदस्यता खोलिन्छ।",sw:"Ili kufanya upya, lipa kupitia JazzCash / EasyPaisa / uhamisho wa benki na umjulishe msimamizi — usajili huwashwa baada ya malipo.",ar:"للتجديد، ادفع عبر JazzCash / EasyPaisa / تحويل بنكي وأخبر المدير — يُفعّل الاشتراك بعد الدفع."},

board_hint:{en:"Classes 9 and 10 are checked against these rules before board registration. Boards differ — set your own board's limits here.",ur:"جماعت 9 اور 10 بورڈ رجسٹریشن سے پہلے ان اصولوں سے جانچے جاتے ہیں۔ بورڈ مختلف ہوتے ہیں — اپنے بورڈ کی حد یہاں درج کریں۔",bn:"বোর্ডে নিবন্ধনের আগে ৯ম ও ১০ম শ্রেণি এই নিয়মে যাচাই করা হয়। বোর্ড ভিন্ন হয় — এখানে আপনার বোর্ডের সীমা নির্ধারণ করুন।",hi:"बोर्ड पंजीकरण से पहले कक्षा 9 और 10 की जांच इन नियमों से होती है। बोर्ड अलग-अलग होते हैं — यहां अपने बोर्ड की सीमाएं तय करें।",ne:"बोर्ड दर्ता अघि कक्षा ९ र १० यी नियमअनुसार जाँच गरिन्छ। बोर्डहरू फरक हुन्छन् — यहाँ आफ्नो बोर्डको सीमा तोक्नुहोस्।",sw:"Madarasa ya 9 na 10 hukaguliwa kwa kanuni hizi kabla ya usajili wa bodi. Bodi hutofautiana — weka mipaka ya bodi yako hapa.",ar:"تُفحص صفوف 9 و10 وفق هذه القواعد قبل التسجيل لدى المجلس. المجالس تختلف — حدّد حدود مجلسك هنا."},

tt_hint:{en:"Type the subject and teacher in each cell. A warning appears if the same teacher is booked in two classes at the same time.",ur:"ہر خانے میں مضمون اور استاد لکھیں۔ اگر ایک ہی استاد ایک ہی وقت میں دو جماعتوں میں ہو تو خبردار کیا جائے گا۔",bn:"প্রতি ঘরে বিষয় ও শিক্ষকের নাম লিখুন। একই শিক্ষক একই সময়ে দুই শ্রেণিতে থাকলে সতর্কতা দেখাবে।",hi:"हर खाने में विषय और शिक्षक लिखें। अगर एक ही शिक्षक एक ही समय में दो कक्षाओं में हो, तो चेतावनी दिखेगी।",ne:"प्रत्येक कोठामा विषय र शिक्षक लेख्नुहोस्। एउटै शिक्षक एकै समयमा दुई कक्षामा भए चेतावनी देखिन्छ।",sw:"Andika somo na mwalimu katika kila kisanduku. Onyo linaonekana ikiwa mwalimu huyo huyo amepangwa katika madarasa mawili kwa wakati mmoja.",ar:"اكتب المادة والمعلم في كل خلية. يظهر تحذير إذا كان المعلم نفسه محجوزًا في صفين في الوقت نفسه."},

att_hint:{en:"One tap per student. Mark all present first, then tap the absentees — that is the 60-second register.",ur:"ہر طالب علم پر ایک ٹیپ۔ پہلے سب کو حاضر کریں، پھر غیر حاضر پر ٹیپ کریں — یہ 60 سیکنڈ والا رجسٹر ہے۔",bn:"প্রতি শিক্ষার্থীর জন্য এক ট্যাপ। প্রথমে সবাইকে উপস্থিত করুন, তারপর অনুপস্থিতদের ট্যাপ করুন — এটাই ৬০ সেকেন্ডের রেজিস্টার।",hi:"प्रति छात्र एक टैप। पहले सभी को उपस्थित चिह्नित करें, फिर अनुपस्थितों पर टैप करें — यही 60 सेकंड का रजिस्टर है।",ne:"प्रति विद्यार्थी एक ट्याप। पहिले सबैलाई उपस्थित चिन्ह लगाउनुहोस्, त्यसपछि अनुपस्थितलाई ट्याप गर्नुहोस् — यही ६० सेकेन्डको रजिस्टर हो।",sw:"Gusa moja kwa kila mwanafunzi. Weka wote kama waliopo kwanza, kisha gusa wasiokuwepo — hiyo ndiyo rejista ya sekunde 60.",ar:"نقرة واحدة لكل طالب. علّم الجميع حاضرين أولاً، ثم انقر على الغائبين — هذا هو سجل الـ 60 ثانية."},

att_wa_hint:{en:"Opens WhatsApp with the message ready — no SMS cost. Needs the guardian's number saved in the student's contact.",ur:"واٹس ایپ پیغام تیار کھلتا ہے — کوئی SMS خرچ نہیں۔ طالب علم کے رابطہ نمبر کی ضرورت ہے۔",bn:"বার্তা তৈরি করে WhatsApp খুলবে — SMS খরচ নেই। শিক্ষার্থীর যোগাযোগে অভিভাবকের নম্বর থাকতে হবে।",hi:"संदेश तैयार करके WhatsApp खोलता है — कोई SMS खर्च नहीं। छात्र के संपर्क में अभिभावक का नंबर सहेजा होना चाहिए।",ne:"सन्देश तयार गरेर WhatsApp खोल्छ — कुनै SMS खर्च छैन। विद्यार्थीको सम्पर्कमा अभिभावकको नम्बर सुरक्षित हुनुपर्छ।",sw:"Hufungua WhatsApp ujumbe ukiwa tayari — hakuna gharama ya SMS. Inahitaji namba ya mlezi iliyohifadhiwa kwenye mawasiliano ya mwanafunzi.",ar:"يفتح واتساب والرسالة جاهزة — دون تكلفة رسائل. يحتاج إلى رقم ولي الأمر المحفوظ في جهة اتصال الطالب."},
att_wa_msg:{en:"Assalam-o-Alaikum — {school}: your child {name} (Class {cls}) was absent today ({date}). Please inform the school.",ur:"السلام علیکم — {school}: آپ کا بچہ {name} (جماعت {cls}) آج {date} غیر حاضر رہا۔ براہ کرم اسکول کو اطلاع دیں۔",bn:"আসসালামু আলাইকুম — {school}: আপনার সন্তান {name} (শ্রেণি {cls}) আজ ({date}) অনুপস্থিত ছিল। অনুগ্রহ করে স্কুলকে জানাবেন।",hi:"अस्सलाम-ओ-अलैकुम — {school}: आपका बच्चा {name} (कक्षा {cls}) आज ({date}) अनुपस्थित था। कृपया स्कूल को सूचित करें।",ne:"अस्सलाम-ओ-अलैकुम — {school}: तपाईंको बच्चा {name} (कक्षा {cls}) आज ({date}) अनुपस्थित थियो। कृपया विद्यालयलाई जानकारी दिनुहोस्।",sw:"Assalamu alaikum — {school}: mtoto wako {name} (Darasa {cls}) hayupo leo ({date}). Tafadhali mjulishe shule.",ar:"السلام عليكم — {school}: تغيّب طفلك {name} (الصف {cls}) اليوم ({date}). يرجى إبلاغ المدرسة."},

fee_report_hint:{en:"Paid by JazzCash, EasyPaisa or bank? Send the details on WhatsApp — the school confirms it and marks it paid.",ur:"جاز کیش، ایزی پیسہ یا بینک سے ادائیگی کی؟ واٹس ایپ پر تفصیل بھیجیں — اسکول تصدیق کر کے ادا شدہ کر دے گا۔",bn:"JazzCash, EasyPaisa বা ব্যাংকে পরিশোধ করেছেন? WhatsApp-এ তথ্য পাঠান — স্কুল নিশ্চিত করে পরিশোধিত হিসেবে চিহ্নিত করবে।",hi:"JazzCash, EasyPaisa या बैंक से भुगतान किया? WhatsApp पर विवरण भेजें — स्कूल पुष्टि करके भुगतान चिह्नित करेगा।",ne:"JazzCash, EasyPaisa वा बैंकबाट भुक्तानी गर्नुभयो? WhatsApp मा विवरण पठाउनुहोस् — विद्यालयले पुष्टि गरेर भुक्तानी भएको चिन्ह लगाउँछ।",sw:"Umelipa kwa JazzCash, EasyPaisa au benki? Tuma maelezo kwa WhatsApp — shule itathibitisha na kuweka kama imelipwa.",ar:"دفعت عبر JazzCash أو EasyPaisa أو البنك؟ أرسل التفاصيل على واتساب — تؤكد المدرسة ذلك وتسجله مدفوعًا."},
fee_report_msg:{en:"Assalam-o-Alaikum — {school}: fee payment reported. Admission {adm}, Month {month}, Amount {amount}, Method {method}, Transaction ID {txn}. Please confirm.",ur:"السلام علیکم — {school}: فیس ادائیگی کی اطلاع۔ داخلہ {adm}، مہینہ {month}، رقم {amount}، طریقہ {method}، ٹرانزیکشن نمبر {txn}۔ براہ کرم تصدیق کریں۔",bn:"আসসালামু আলাইকুম — {school}: ফি পরিশোধের তথ্য। ভর্তি {adm}, মাস {month}, পরিমাণ {amount}, মাধ্যম {method}, লেনদেন আইডি {txn}। অনুগ্রহ করে নিশ্চিত করুন।",hi:"अस्सलाम-ओ-अलैकुम — {school}: शुल्क भुगतान की सूचना दी गई है। प्रवेश {adm}, महीना {month}, राशि {amount}, तरीका {method}, लेनदेन आईडी {txn}। कृपया पुष्टि करें।",ne:"अस्सलाम-ओ-अलैकुम — {school}: शुल्क भुक्तानी रिपोर्ट गरिएको छ। भर्ना {adm}, महिना {month}, रकम {amount}, विधि {method}, लेनदेन आईडी {txn}। कृपया पुष्टि गर्नुहोस्।",sw:"Assalamu alaikum — {school}: malipo ya ada yameripotiwa. Udahili {adm}, Mwezi {month}, Kiasi {amount}, Njia {method}, Kitambulisho cha muamala {txn}. Tafadhali thibitisha.",ar:"السلام عليكم — {school}: تم الإبلاغ عن دفع رسوم. القبول {adm}، الشهر {month}، المبلغ {amount}، الطريقة {method}، رقم المعاملة {txn}. يرجى التأكيد."},

verify_page_hint:{en:"Enter the code printed on the result card or certificate to check it is genuine.",ur:"رزلٹ کارڈ یا سرٹیفکیٹ پر چھپا کوڈ لکھ کر اس کی اصلیت چیک کریں۔",bn:"ফলাফল কার্ড বা সার্টিফিকেটে ছাপা কোডটি লিখে যাচাই করুন এটি আসল কিনা।",hi:"यह असली है या नहीं, यह जांचने के लिए परिणाम कार्ड या प्रमाणपत्र पर छपा कोड लिखें।",ne:"यो वास्तविक हो कि होइन जाँच्न नतिजा कार्ड वा प्रमाणपत्रमा छापिएको कोड लेख्नुहोस्।",sw:"Weka msimbo uliochapishwa kwenye kadi ya matokeo au cheti ili kuangalia kama ni halisi.",ar:"أدخل الرمز المطبوع على بطاقة النتيجة أو الشهادة للتحقق من صحتها."},

sub_report_hint:{en:"Pay first, then report it here with the transaction ID. The admin switches the subscription on after checking the payment.",ur:"پہلے ادائیگی کریں، پھر ٹرانزیکشن آئی ڈی کے ساتھ یہاں رپورٹ کریں۔ ایڈمن ادائیگی چیک کر کے سبسکرپشن آن کرے گا۔",bn:"প্রথমে পেমেন্ট করুন, তারপর লেনদেন আইডি দিয়ে এখানে জানান। অ্যাডমিন পেমেন্ট যাচাই করে সাবস্ক্রিপশন চালু করবেন।",hi:"पहले भुगतान करें, फिर लेनदेन आईडी के साथ यहां सूचना दें। भुगतान जांचने के बाद एडमिन सब्सक्रिप्शन चालू करेगा।",ne:"पहिले भुक्तानी गर्नुहोस्, त्यसपछि लेनदेन आईडीसहित यहाँ रिपोर्ट गर्नुहोस्। भुक्तानी जाँचेर एडमिनले सदस्यता खोल्छन्।",sw:"Lipa kwanza, kisha iripoti hapa kwa kitambulisho cha muamala. Msimamizi huwasha usajili baada ya kuangalia malipo.",ar:"ادفع أولاً، ثم أبلغ عنه هنا برقم المعاملة. يفعّل المدير الاشتراك بعد التحقق من الدفع."},

sub_admin_hint:{en:"All schools, their subscriptions and reported payments. Confirm a payment to switch a school on; remind schools that have not renewed.",ur:"تمام اسکول، ان کی سبسکرپشن اور رپورٹ شدہ ادائیگیاں۔ ادائیگی کی تصدیق کر کے اسکول آن کریں؛ جنہوں نے تجدید نہیں کی انہیں یاد دلائیں۔",bn:"সব স্কুল, তাদের সাবস্ক্রিপশন ও জানানো পেমেন্ট। পেমেন্ট নিশ্চিত করে স্কুল চালু করুন; যারা নবায়ন করেনি তাদের মনে করিয়ে দিন।",hi:"सभी स्कूल, उनके सब्सक्रिप्शन और रिपोर्ट की गई भुगतान। स्कूल चालू करने के लिए भुगतान की पुष्टि करें; जिन स्कूलों ने नवीनीकरण नहीं किया है उन्हें याद दिलाएं।",ne:"सबै विद्यालय, तिनका सदस्यता र रिपोर्ट गरिएका भुक्तानी। विद्यालय खोल्न भुक्तानी पुष्टि गर्नुहोस्; नवीकरण नगरेका विद्यालयलाई सम्झाउनुहोस्।",sw:"Shule zote, usajili wao na malipo yaliyoripotiwa. Thibitisha malipo ili kuwasha shule; wakumbushe shule ambazo hazijafanya upya.",ar:"جميع المدارس واشتراكاتها والمدفوعات المُبلغ عنها. أكّد الدفع لتشغيل مدرسة؛ وذكّر المدارس التي لم تجدد."},
sub_confirm:{en:"Confirm",ur:"تصدیق کریں",bn:"নিশ্চিত করুন",hi:"पुष्टि करें",ne:"पुष्टि गर्नुहोस्",sw:"Thibitisha",ar:"تأكيد"},
