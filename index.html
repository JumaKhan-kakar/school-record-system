sub_remind_mail:{en:"Email reminder",ur:"ای میل یاد دہانی",bn:"ইমেইল মনে করিয়ে দিন",hi:"ईमेल अनुस्मारक",ne:"इमेल सम्झना",sw:"Kikumbusho cha barua pepe",ar:"تذكير بالبريد"},
sub_remind_msg:{en:"Assalam-o-Alaikum, this is the School Record System. Your subscription for {school} ({cycle}) ended on {until}. Amount due: {amount}. Please pay via JazzCash / EasyPaisa / bank transfer and share the transaction ID — your access will be switched on after payment. Thank you.",ur:"السلام علیکم، یہ اسکول ریکارڈ سسٹم ہے۔ {school} کی سبسکرپشن ({cycle}) {until} کو ختم ہو گئی ہے۔ واجب رقم: {amount}۔ براہ کرم JazzCash / EasyPaisa / بینک ٹرانسفر سے ادائیگی کریں اور ٹرانزیکشن آئی ڈی بھیجیں — ادائیگی کے بعد آپ کی رسائی آن کر دی جائے گی۔ شکریہ۔",bn:"আসসালামু আলাইকুম, এটি স্কুল রেকর্ড সিস্টেম। {school}-এর সাবস্ক্রিপশন ({cycle}) {until} তারিখে শেষ হয়েছে। বাকি পরিমাণ: {amount}। অনুগ্রহ করে জ্যাজক্যাশ / ইজিপয়সা / ব্যাংক ট্রান্সফারের মাধ্যমে পেমেন্ট করুন এবং লেনদেন আইডি পাঠান — পেমেন্টের পর আপনার অ্যাক্সেস চালু করা হবে। ধন্যবাদ।",hi:"अस्सलाम-ओ-अलैकुम, यह स्कूल रिकॉर्ड सिस्टम है। {school} ({cycle}) का आपका सब्सक्रिप्शन {until} को समाप्त हो गया है। बकाया राशि: {amount}। कृपया JazzCash / EasyPaisa / बैंक ट्रांसफ़र से भुगतान करें और लेनदेन आईडी साझा करें — भुगतान के बाद आपका एक्सेस चालू कर दिया जाएगा। धन्यवाद।",ne:"अस्सलाम-ओ-अलैकुम, यो स्कूल रेकर्ड सिस्टम हो। {school} ({cycle}) को तपाईंको सदस्यता {until} मा समाप्त भयो। तिर्नुपर्ने रकम: {amount}। कृपया JazzCash / EasyPaisa / बैंक स्थानान्तरणबाट भुक्तानी गरी लेनदेन आईडी साझा गर्नुहोस् — भुक्तानीपछि तपाईंको पहुँच खोलिन्छ। धन्यवाद।",sw:"Assalamu alaikum, hii ni Mfumo wa Rekodi za Shule. Usajili wako wa {school} ({cycle}) uliisha tarehe {until}. Kiasi kinachodaiwa: {amount}. Tafadhali lipa kupitia JazzCash / EasyPaisa / uhamisho wa benki na ushiriki kitambulisho cha muamala — ufikiaji wako utawashwa baada ya malipo. Asante.",ar:"السلام عليكم، هذا هو نظام سجلات المدرسة. انتهى اشتراكك لـ {school} ({cycle}) في {until}. المبلغ المستحق: {amount}. يرجى الدفع عبر JazzCash / EasyPaisa / تحويل بنكي ومشاركة رقم المعاملة — سيتم تشغيل وصولك بعد الدفع. شكرًا لك."},
sub_remind_subject:{en:"Subscription renewal — {school}",ur:"سبسکرپشن تجدید — {school}",bn:"সাবস্ক্রিপশন নবায়ন — {school}",hi:"सब्सक्रिप्शन नवीनीकरण — {school}",ne:"सदस्यता नवीकरण — {school}",sw:"Upya wa usajili — {school}",ar:"تجديد الاشتراك — {school}"},

idscan_open:{en:"Scan student card",ur:"طالب علم کا کارڈ اسکین کریں",bn:"ছাত্র কার্ড স্ক্যান করুন",hi:"छात्र कार्ड स्कैन करें",ne:"विद्यार्थी कार्ड स्क्यान गर्नुहोस्",sw:"Changanua kadi ya mwanafunzi",ar:"مسح بطاقة الطالب"},
idscan_title:{en:"Scan a student ID card",ur:"طالب علم کا شناختی کارڈ اسکین کریں",bn:"ছাত্র পরিচয়পত্র স্ক্যান করুন",hi:"छात्र आईडी कार्ड स्कैन करें",ne:"विद्यार्थी आईडी कार्ड स्क्यान गर्नुहोस्",sw:"Changanua kadi ya kitambulisho cha mwanafunzi",ar:"مسح بطاقة هوية طالب"},
idscan_hint:{en:"Point the camera at the QR code on the student's ID card — or upload a photo of the card. The student's full record opens at once.",ur:"کیمرہ طالب علم کے شناختی کارڈ کے QR کوڈ کی طرف رکھیں — یا کارڈ کی تصویر اپ لوڈ کریں۔ طالب علم کا مکمل ریکارڈ فوراً کھل جائے گا۔",bn:"ক্যামেরাটি ছাত্রের পরিচয়পত্রের QR কোডের দিকে ধরুন — অথবা কার্ডের ছবি আপলোড করুন। শিক্ষার্থীর সম্পূর্ণ রেকর্ড একবারে খুলবে।",hi:"छात्र के आईडी कार्ड पर QR कोड की ओर कैमरा करें — या कार्ड की फ़ोटो अपलोड करें। छात्र का पूरा रिकॉर्ड एक साथ खुल जाता है।",ne:"विद्यार्थीको आईडी कार्डको QR कोडतर्फ क्यामेरा देखाउनुहोस् — वा कार्डको फोटो अपलोड गर्नुहोस्। विद्यार्थीको पूरा रेकर्ड एकैपटक खुल्छ।",sw:"Elekeza kamera kwenye msimbo wa QR kwenye kadi ya kitambulisho cha mwanafunzi — au pakia picha ya kadi. Rekodi kamili ya mwanafunzi hufunguka mara moja.",ar:"وجّه الكاميرا نحو رمز QR على بطاقة هوية الطالب — أو ارفع صورة للبطاقة. يفتح السجل الكامل للطالب فورًا."},
idscan_start:{en:"Start camera",ur:"کیمرہ شروع کریں",bn:"ক্যামেরা চালু করুন",hi:"कैमरा शुरू करें",ne:"क्यामेरा सुरु गर्नुहोस्",sw:"Anza kamera",ar:"تشغيل الكاميرا"},

idscan_upload:{en:"Upload a photo of the card",ur:"کارڈ کی تصویر اپ لوڈ کریں",bn:"কার্ডের ছবি আপলোড করুন",hi:"कार्ड की फ़ोटो अपलोड करें",ne:"कार्डको फोटो अपलोड गर्नुहोस्",sw:"Pakia picha ya kadi",ar:"ارفع صورة للبطاقة"},
idscan_found:{en:"Student found — opening the record.",ur:"طالب علم مل گیا — ریکارڈ کھل رہا ہے۔",bn:"শিক্ষার্থী পাওয়া গেছে — রেকর্ড খুলছে।",hi:"छात्र मिल गया — रिकॉर्ड खुल रहा है।",ne:"विद्यार्थी भेटियो — रेकर्ड खुल्दैछ।",sw:"Mwanafunzi amepatikana — inafungua rekodi.",ar:"تم العثور على الطالب — جارٍ فتح السجل."},
idscan_notfound:{en:"No student found for this code.",ur:"اس کوڈ کے لیے کوئی طالب علم نہیں ملا۔",bn:"এই কোডের জন্য কোনো শিক্ষার্থী পাওয়া যায়নি।",hi:"इस कोड के लिए कोई छात्र नहीं मिला।",ne:"यो कोडका लागि कुनै विद्यार्थी भेटिएन।",sw:"Hakuna mwanafunzi aliyepatikana kwa msimbo huu.",ar:"لم يتم العثور على طالب بهذا الرمز."},
idscan_wrong_school:{en:"This card belongs to another school.",ur:"یہ کارڈ کسی اور اسکول کا ہے۔",bn:"এই কার্ডটি অন্য স্কুলের।",hi:"यह कार्ड किसी दूसरी स्कूल का है।",ne:"यो कार्ड अर्को विद्यालयको हो।",sw:"Kadi hii ni ya shule nyingine.",ar:"هذه البطاقة تخص مدرسة أخرى."},
idscan_no_camera:{en:"Camera is not available on this device or browser. Use the upload button instead.",ur:"اس آلے یا براؤزر پر کیمرہ دستیاب نہیں۔ اس کے بجائے اپ لوڈ بٹن استعمال کریں۔",bn:"এই ডিভাইস বা ব্রাউজারে ক্যামেরা নেই। আপলোড বোতাম ব্যবহার করুন।",hi:"इस डिवाइस या ब्राउज़र पर कैमरा उपलब्ध नहीं है। इसके बजाय अपलोड बटन इस्तेमाल करें।",ne:"यो यन्त्र वा ब्राउजरमा क्यामेरा उपलब्ध छैन। यसको सट्टा अपलोड बटन प्रयोग गर्नुहोस्।",sw:"Kamera haipatikani kwenye kifaa au kivinjari hiki. Tumia kitufe cha kupakia badala yake.",ar:"الكاميرا غير متوفرة على هذا الجهاز أو المتصفح. استخدم زر الرفع بدلًا من ذلك."},
idscan_no_qr:{en:"No QR code found in this photo. Try a clearer photo of the card.",ur:"اس تصویر میں کوئی QR کوڈ نہیں ملا۔ کارڈ کی واضح تصویر آزمائیں۔",bn:"এই ছবিতে কোনো QR কোড পাওয়া যায়নি। কার্ডের পরিষ্কার ছবি চেষ্টা করুন।",hi:"इस फ़ोटो में कोई QR कोड नहीं मिला। कार्ड की साफ़ फ़ोटो लेकर देखें।",ne:"यो फोटोमा कुनै QR कोड भेटिएन। कार्डको स्पष्ट फोटो लिएर हेर्नुहोस्।",sw:"Hakuna msimbo wa QR uliopatikana katika picha hii. Jaribu picha wazi zaidi ya kadi.",ar:"لم يتم العثور على رمز QR في هذه الصورة. جرّب صورة أوضح للبطاقة."},
idscan_scanning:{en:"Scanning… point the camera at the card's QR code.",ur:"اسکین ہو رہا ہے… کیمرہ کارڈ کے QR کوڈ کی طرف رکھیں۔",bn:"স্ক্যান হচ্ছে… ক্যামেরাটি কার্ডের QR কোডের দিকে ধরুন।",hi:"स्कैन हो रहा है… कैमरा कार्ड के QR कोड की ओर करें।",ne:"स्क्यान हुँदैछ… क्यामेरा कार्डको QR कोडतर्फ देखाउनुहोस्।",sw:"Inachanganua… elekeza kamera kwenye msimbo wa QR wa kadi.",ar:"جارٍ المسح… وجّه الكاميرا نحو رمز QR على البطاقة."},
idcard_title:{en:"Student ID card",ur:"طالب علم کا شناختی کارڈ",bn:"ছাত্র পরিচয়পত্র",hi:"छात्र आईडी कार्ड",ne:"विद्यार्थी आईडी कार्ड",sw:"Kadi ya kitambulisho cha mwanafunzi",ar:"بطاقة هوية الطالب"},
idcard_print:{en:"Print ID card",ur:"شناختی کارڈ پرنٹ کریں",bn:"পরিচয়পত্র প্রিন্ট করুন",hi:"आईडी कार्ड प्रिंट करें",ne:"आईडी कार्ड छाप्नुहोस्",sw:"Chapisha kadi ya kitambulisho",ar:"طباعة بطاقة الهوية"},
idcard_hint:{en:"Keep this card with the student. Scanning its QR code opens the student's full record in the tool.",ur:"یہ کارڈ طالب علم کے پاس رکھیں۔ اس کے QR کوڈ کو اسکین کرنے سے ٹول میں طالب علم کا مکمل ریکارڈ کھل جاتا ہے۔",bn:"এই কার্ডটি শিক্ষার্থীর কাছে রাখুন। এর QR কোড স্ক্যান করলে টুলে শিক্ষার্থীর সম্পূর্ণ রেকর্ড খুলবে।",hi:"यह कार्ड छात्र के पास रखें। इसका QR कोड स्कैन करने पर टूल में छात्र का पूरा रिकॉर्ड खुल जाता है।",ne:"यो कार्ड विद्यार्थीसँग राख्नुहोस्। यसको QR कोड स्क्यान गर्दा उपकरणमा विद्यार्थीको पूरा रेकर्ड खुल्छ।",sw:"Weka kadi hii pamoja na mwanafunzi. Kuchanganua msimbo wake wa QR hufungua rekodi kamili ya mwanafunzi kwenye zana.",ar:"احتفظ بهذه البطاقة مع الطالب. مسح رمز QR الخاص بها يفتح السجل الكامل للطالب في الأداة."},
ai_title:{en:"AI assistant (Gemini)",ur:"اے آئی معاون (جیمنی)",bn:"এআই সহকারী (জেমিনি)",hi:"एआई सहायक (Gemini)",ne:"एआई सहायक (Gemini)",sw:"Msaidizi wa AI (Gemini)",ar:"مساعد الذكاء الاصطناعي (Gemini)"},
ai_hint:{en:"Paste the school's free Gemini API key here (get one at Google AI Studio — free, no billing). It unlocks the Ask box for any question and Google search. The key stays in this school's own data and is NOT included in backups.",ur:"یہاں اسکول کی مفت جیمنی API کی (Google AI Studio سے لیں — مفت، کوئی بلنگ نہیں) چسپاں کریں۔ اس سے 'پوچھیں' والا خانہ ہر سوال کا جواب دے سکے گا اور گوگل تلاش بھی کرے گا۔ یہ کی اسی اسکول کے اپنے ڈیٹا میں رہتی ہے اور بیک اپ میں شامل نہیں ہوتی۔",bn:"এখানে স্কুলের বিনামূল্যের জেমিনি API কী বসান (Google AI Studio থেকে নিন — বিনামূল্যে, কোনো বিলিং নেই)। এটি 'জিজ্ঞাসা করুন' বাক্সকে যেকোনো প্রশ্নের উত্তর দিতে এবং Google অনুসন্ধান করতে দেবে। কীটি এই স্কুলের নিজের ডেটাতেই থাকে এবং ব্যাকআপে অন্তর্ভুক্ত হয় না।",hi:"स्कूल की मुफ़्त Gemini API कुंजी यहां पेस्ट करें (Google AI Studio से लें — मुफ़्त, कोई बिलिंग नहीं)। यह किसी भी सवाल और Google खोज के लिए पूछें वाला बॉक्स खोलती है। कुंजी इसी स्कूल के अपने डेटा में रहती है और बैकअप में शामिल नहीं होती।",ne:"विद्यालयको नि:शुल्क Gemini API की यहाँ टाँस्नुहोस् (Google AI Studio बाट लिनुहोस् — नि:शुल्क, कुनै बिलिङ छैन)। यसले कुनै पनि प्रश्न र Google खोजका लागि सोध्ने बाकस खोल्छ। की यही विद्यालयको आफ्नै डाटामा रहन्छ र ब्याकअपमा समावेश हुँदैन।",sw:"Bandika ufunguo wa bure wa API wa Gemini wa shule hapa (pata moja kwenye Google AI Studio — bure, hakuna malipo). Hufungua kisanduku cha kuuliza kwa swali lolote na utafutaji wa Google. Ufunguo unabaki katika data ya shule hii yenyewe na HAujumuishwi kwenye nakala.",ar:"الصق مفتاح Gemini API المجاني للمدرسة هنا (احصل على واحد من Google AI Studio — مجاني، دون فوترة). يفتح صندوق السؤال لأي سؤال وبحث Google. يبقى المفتاح في بيانات المدرسة نفسها ولا يُضمّن في النسخ الاحتياطية."},
ai_key_label:{en:"Gemini API key",ur:"جیمنی API کی",bn:"জেমিনি API কী",hi:"Gemini API कुंजी",ne:"Gemini API की",sw:"Ufunguo wa API wa Gemini",ar:"مفتاح Gemini API"},
ai_test:{en:"Test the key",ur:"کی جانچیں",bn:"কী পরীক্ষা করুন",hi:"कुंजी जांचें",ne:"की परीक्षण गर्नुहोस्",sw:"Jaribu ufunguo",ar:"اختبار المفتاح"},
ai_test_ok:{en:"Key works — the AI assistant is ready.",ur:"کی کام کرتی ہے — اے آئی معاون تیار ہے۔",bn:"কী কাজ করছে — এআই সহকারী প্রস্তুত।",hi:"कुंजी काम कर रही है — एआई सहायक तैयार है।",ne:"की काम गर्छ — एआई सहायक तयार छ।",sw:"Ufunguo unafanya kazi — msaidizi wa AI yuko tayari.",ar:"المفتاح يعمل — مساعد الذكاء الاصطناعي جاهز."},
ai_test_bad:{en:"That key did not work. Check it and try again.",ur:"یہ کی کام نہیں کرتی۔ اسے جانچ کر دوبارہ آزمائیں۔",bn:"এই কীটি কাজ করেনি। যাচাই করে আবার চেষ্টা করুন।",hi:"वह कुंजी काम नहीं कर रही। जांचें और फिर से प्रयास करें।",ne:"त्यो की काम गरेन। जाँचेर फेरि प्रयास गर्नुहोस्।",sw:"Ufunguo huo haukufanya kazi. Uangalie na ujaribu tena.",ar:"هذا المفتاح لا يعمل. تحقّق منه وحاول مرة أخرى."},
ai_no_key:{en:"Paste the key first.",ur:"پہلے کی چسپاں کریں۔",bn:"প্রথমে কীটি বসান।",hi:"पहले कुंजी पेस्ट करें।",ne:"पहिले की टाँस्नुहोस्।",sw:"Bandika ufunguo kwanza.",ar:"الصق المفتاح أولاً."},
gemini_thinking:{en:"Thinking…",ur:"سوچ رہا ہے…",bn:"ভাবছি…",hi:"सोच रहा हूं…",ne:"सोचिँदैछ…",sw:"Inafikiria…",ar:"جارٍ التفكير…"},

gemini_offline:{en:"Could not reach Gemini. Check the internet and the key, then try again.",ur:"جیمنی تک رسائی نہیں ہو سکی۔ انٹرنیٹ اور کی جانچ کر دوبارہ آزمائیں۔",bn:"জেমিনিতে পৌঁছানো যায়নি। ইন্টারনেট ও কী যাচাই করে আবার চেষ্টা করুন।",hi:"Gemini तक नहीं पहुंच सके। इंटरनेट और कुंजी जांचें, फिर फिर से प्रयास करें।",ne:"Gemini सम्म पुग्न सकिएन। इन्टरनेट र की जाँचेर फेरि प्रयास गर्नुहोस्।",sw:"Haikuweza kufikia Gemini. Angalia mtandao na ufunguo, kisha ujaribu tena.",ar:"تعذر الوصول إلى Gemini. تحقق من الإنترنت والمفتاح، ثم حاول مرة أخرى."},
gemini_empty:{en:"Gemini gave no answer. Try asking differently.",ur:"جیمنی نے کوئی جواب نہیں دیا۔ سوال بدل کر آزمائیں۔",bn:"জেমিনি কোনো উত্তর দেয়নি। অন্যভাবে জিজ্ঞাসা করুন।",hi:"Gemini ने कोई जवाब नहीं दिया। अलग तरह से पूछकर देखें।",ne:"Gemini ले कुनै उत्तर दिएन। फरक तरिकाले सोधेर हेर्नुहोस्।",sw:"Gemini haikutoa jibu. Jaribu kuuliza kwa njia tofauti.",ar:"لم يقدم Gemini أي إجابة. حاول السؤال بطريقة مختلفة."},
gemini_no_key:{en:"No Gemini key is set. Add one in Settings to unlock this.",ur:"کوئی جیمنی کی مقرر نہیں۔ اسے کھولنے کے لیے ترتیبات میں کی شامل کریں۔",bn:"কোনো জেমিনি কী সেট করা নেই। এটি চালু করতে সেটিংসে কী যোগ করুন।",hi:"कोई Gemini कुंजी सेट नहीं है। इसे खोलने के लिए सेटिंग्स में एक जोड़ें।",ne:"कुनै Gemini की सेट छैन। यो खोल्न सेटिङमा एउटा थप्नुहोस्।",sw:"Hakuna ufunguo wa Gemini uliowekwa. Ongeza moja kwenye Mipangilio ili kufungua hii.",ar:"لم يتم تعيين مفتاح Gemini. أضف واحدًا في الإعدادات لفتح هذا."},
gemini_hint_short:{en:"Add a free Gemini key in Settings and the Ask box will answer any question, with Google search.",ur:"ترتیبات میں مفت جیمنی کی شامل کریں تو 'پوچھیں' والا خانہ گوگل تلاش کے ساتھ ہر سوال کا جواب دے گا۔",bn:"সেটিংসে বিনামূল্যের জেমিনি কী যোগ করুন — 'জিজ্ঞাসা করুন' বাক্স Google অনুসন্ধানসহ যেকোনো প্রশ্নের উত্তর দেবে।",hi:"सेटिंग्स में मुफ़्त Gemini कुंजी जोड़ें और पूछें वाला बॉक्स Google खोज के साथ किसी भी सवाल का जवाब देगा।",ne:"सेटिङमा नि:शुल्क Gemini की थप्नुहोस् र सोध्ने बाकसले Google खोजसहित कुनै पनि प्रश्नको उत्तर दिनेछ।",sw:"Ongeza ufunguo wa bure wa Gemini kwenye Mipangilio na kisanduku cha kuuliza kitajibu swali lolote, kwa utafutaji wa Google.",ar:"أضف مفتاح Gemini مجانيًا في الإعدادات وسيجيب صندوق السؤال عن أي سؤال، مع بحث Google."},

platform_key_hint:{en:"One Gemini key for the whole platform. Paste it once here and every school's Ask box works — no school ever fetches a key. The key is stored in the platform's own data, never in the app file.",ur:"پورے پلیٹفارم کے لیے ایک جیمنی کی۔ اسے ایک بار یہاں چسپاں کریں اور ہر اسکول کا 'پوچھیں' والا خانہ کام کرے گا — کوئی اسکول کی نہیں لے گا۔ یہ کی پلیٹفارم کے اپنے ڈیٹا میں محفوظ ہوتی ہے، ایپ کی فائل میں کبھی نہیں۔",bn:"পুরো প্ল্যাটফর্মের জন্য একটি জেমিনি কী। এটি একবার এখানে বসান এবং প্রতিটি স্কুলের 'জিজ্ঞাসা করুন' বাক্স কাজ করবে — কোনো স্কুলকে কী নিতে হবে না। কীটি প্ল্যাটফর্মের নিজের ডেটায় সংরক্ষিত থাকে, অ্যাপের ফাইলে কখনো নয়।",hi:"पूरे प्लेटफ़ॉर्म के लिए एक Gemini कुंजी। इसे एक बार यहां पेस्ट करें और हर स्कूल का पूछें वाला बॉक्स काम करेगा — किसी स्कूल को कभी कुंजी लाने की ज़रूरत नहीं। कुंजी प्लेटफ़ॉर्म के अपने डेटा में संग्रहीत होती है, ऐप की फ़ाइल में कभी नहीं।",ne:"सम्पूर्ण प्लेटफर्मका लागि एउटा Gemini की। यसलाई एकपटक यहाँ टाँस्नुहोस् र हरेक विद्यालयको सोध्ने बाकस काम गर्छ — कुनै विद्यालयले कहिल्यै की लिनु पर्दैन। की प्लेटफर्मको आफ्नै डाटामा भण्डारण हुन्छ, एपको फाइलमा कहिल्यै होइन।",sw:"Ufunguo mmoja wa Gemini kwa jukwaa zima. Ubandike mara moja hapa na kisanduku cha kuuliza cha kila shule kitafanya kazi — hakuna shule itakayohitaji kuchukua ufunguo kamwe. Ufunguo huhifadhiwa katika data ya jukwaa lenyewe, kamwe katika faili la programu.",ar:"مفتاح Gemini واحد للمنصة كاملة. الصقه مرة واحدة هنا وسيعمل صندوق السؤال في كل مدرسة — ولا تحتاج أي مدرسة إلى جلب مفتاح أبدًا. يُخزن المفتاح في بيانات المنصة نفسها، وليس في ملف التطبيق أبدًا."},
platform_key_set:{en:"A platform key is set.",ur:"پلیٹفارم کی مقرر ہے۔",bn:"প্ল্যাটফর্ম কী সেট করা আছে।",hi:"प्लेटफ़ॉर्म कुंजी सेट है।",ne:"प्लेटफर्म की सेट छ।",sw:"Ufunguo wa jukwaa umewekwa.",ar:"تم تعيين مفتاح المنصة."},
platform_key_none:{en:"No platform key set yet.",ur:"ابھی کوئی پلیٹفارم کی مقرر نہیں۔",bn:"এখনো কোনো প্ল্যাটফর্ম কী সেট করা হয়নি।",hi:"अभी कोई प्लेटफ़ॉर्म कुंजी सेट नहीं है।",ne:"अहिलेसम्म कुनै प्लेटफर्म की सेट छैन।",sw:"Hakuna ufunguo wa jukwaa uliowekwa bado.",ar:"لم يتم تعيين مفتاح منصة بعد."},
platform_key_saved:{en:"Platform key saved — every school's AI is now on.",ur:"پلیٹفارم کی محفوظ ہو گئی — ہر اسکول کی اے آئی اب چالو ہے۔",bn:"প্ল্যাটফর্ম কী সংরক্ষিত হয়েছে — প্রতিটি স্কুলের এআই এখন চালু।",hi:"प्लेटफ़ॉर्म कुंजी सहेजी गई — हर स्कूल की एआई अब चालू है।",ne:"प्लेटफर्म की सुरक्षित भयो — हरेक विद्यालयको एआई अब चालु छ।",sw:"Ufunguo wa jukwaa umehifadhiwa — AI ya kila shule sasa imewashwa.",ar:"تم حفظ مفتاح المنصة — الذكاء الاصطناعي في كل مدرسة يعمل الآن."},
ai_platform:{en:"The platform provides the AI key — nothing to do here.",ur:"پلیٹفارم اے آئی کی فراہم کرتا ہے — یہاں کچھ کرنے کی ضرورت نہیں۔",bn:"প্ল্যাটফর্ম এআই কী সরবরাহ করে — এখানে কিছু করার নেই।",hi:"प्लेटफ़ॉर्म एआई कुंजी देता है — यहां कुछ करने की ज़रूरत नहीं।",ne:"प्लेटफर्मले एआई की दिन्छ — यहाँ केही गर्नु पर्दैन।",sw:"Jukwaa hutoa ufunguo wa AI — hakuna cha kufanya hapa.",ar:"المنصة توفر مفتاح الذكاء الاصطناعي — لا شيء عليك فعله هنا."},

login_blocked:{en:"This account has been blocked by the platform. Contact the platform admin.",ur:"یہ اکاؤنٹ پلیٹفارم کی طرف سے بلاک کر دیا گیا ہے۔ پلیٹفارم ایڈمن سے رابطہ کریں۔",bn:"এই অ্যাকাউন্টটি প্ল্যাটফর্ম কর্তৃক ব্লক করা হয়েছে। প্ল্যাটফর্ম অ্যাডমিনের সাথে যোগাযোগ করুন।",hi:"यह खाता प्लेटफ़ॉर्म द्वारा ब्लॉक कर दिया गया है। प्लेटफ़ॉर्म एडमिन से संपर्क करें।",ne:"यो खाता प्लेटफर्मद्वारा ब्लक गरिएको छ। प्लेटफर्म एडमिनसँग सम्पर्क गर्नुहोस्।",sw:"Akaunti hii imezuiliwa na jukwaa. Wasiliana na msimamizi wa jukwaa.",ar:"تم حظر هذا الحساب من المنصة. اتصل بمشرف المنصة."},
login_school_blocked:{en:"This school has been blocked by the platform. Contact the platform admin.",ur:"یہ اسکول پلیٹفارم کی طرف سے بلاک کر دیا گیا ہے۔ پلیٹفارم ایڈمن سے رابطہ کریں۔",bn:"এই স্কুলটি প্ল্যাটফর্ম কর্তৃক ব্লক করা হয়েছে। প্ল্যাটফর্ম অ্যাডমিনের সাথে যোগাযোগ করুন।",hi:"यह स्कूल प्लेटफ़ॉर्म द्वारा ब्लॉक कर दिया गया है। प्लेटफ़ॉर्म एडमिन से संपर्क करें।",ne:"यो विद्यालय प्लेटफर्मद्वारा ब्लक गरिएको छ। प्लेटफर्म एडमिनसँग सम्पर्क गर्नुहोस्।",sw:"Shule hii imezuiliwa na jukwaa. Wasiliana na msimamizi wa jukwaa.",ar:"تم حظر هذه المدرسة من المنصة. اتصل بمشرف المنصة."},

staff_title:{en:"Staff — attendance & salary",ur:"عملہ — حاضری اور تنخواہ",bn:"কর্মী — উপস্থিতি ও বেতন",hi:"स्टाफ — उपस्थिति और वेतन",ne:"कर्मचारी — हाजिरी र तलब",sw:"Wafanyakazi — mahudhurio na mshahara",ar:"الموظفون — الحضور والراتب"},
staff_hint:{en:"Add teachers and staff, mark their daily attendance, and generate monthly salaries. Absent days reduce the salary automatically; approved leave does not.",ur:"اساتذہ اور عملہ شامل کریں، روزانہ حاضری لگائیں، اور ماہانہ تنخواہ بنائیں۔ غیر حاضری کے دن تنخواہ خود بخود کم کرتے ہیں؛ منظور شدہ چھٹی نہیں۔",bn:"শিক্ষক ও কর্মী যোগ করুন, প্রতিদিনের উপস্থিতি নিন এবং মাসিক বেতন তৈরি করুন। অনুপস্থিতির দিন বেতন স্বয়ংক্রিয়ভাবে কমিয়ে দেয়; অনুমোদিত ছুটি দেয় না।",hi:"शिक्षक और स्टाफ जोड़ें, रोज़ उपस्थिति लें और मासिक वेतन बनाएँ। अनुपस्थित दिन वेतन अपने आप घटाते हैं; स्वीकृत छुट्टी नहीं।",ne:"शिक्षक र कर्मचारी थप्नुहोस्, दैनिक हाजिरी लिनुहोस् र मासिक तलब बनाउनुहोस्। अनुपस्थित दिनले तलब आफै घटाउँछ; स्वीकृत बिदाले घटाउँदैन।",sw:"Ongeza walimu na wafanyakazi, weka mahudhurio ya kila siku, na tengeneza mishahara ya kila mwezi. Siku za kutokuwepo hupunguza mshahara kiotomatiki; likizo iliyoidhinishwa haipunguzi.",ar:"أضف المعلمين والموظفين، وسجّل الحضور اليومي، وأنشئ الرواتب الشهرية. أيام الغياب تُخفّض الراتب تلقائيًا؛ أما الإجازة المعتمدة فلا."},

ask_no_admit:{en:"No admit card issued for this student yet.",ur:"اس طالب علم کا ایڈمٹ کارڈ ابھی جاری نہیں ہوا۔",bn:"এই শিক্ষার্থীর প্রবেশপত্র এখনো দেওয়া হয়নি।",hi:"इस छात्र का प्रवेश पत्र अभी जारी नहीं हुआ।",ne:"यो विद्यार्थीको प्रवेशपत्र अझै जारी भएको छैन।",sw:"Bado hakuna kadi ya kuingia ya mwanafunzi huyu.",ar:"لم تُصدر بطاقة دخول لهذا الطالب بعد."},

bc_hint:{en:"Send one message to all parents of a class on WhatsApp. Each message opens with one tap — WhatsApp does not send automatically.",ur:"ایک کلاس کے تمام والدین کو ایک ہی پیغام واٹس ایپ پر بھیجیں۔ ہر پیغام ایک ٹیپ سے کھلتا ہے — واٹس ایپ خودکار نہیں بھیجتا۔",bn:"একটি ক্লাসের সব অভিভাবককে WhatsApp-এ একই বার্তা পাঠান। প্রতিটি বার্তা এক ট্যাপে খোলে — WhatsApp স্বয়ংক্রিয়ভাবে পাঠায় না।",hi:"एक कक्षा के सभी अभिभावकों को WhatsApp पर एक ही संदेश भेजें। प्रत्येक संदेश एक टैप से खुलता है — WhatsApp स्वचालित रूप से नहीं भेजता।",ne:"एउटा कक्षाका सबै अभिभावकहरूलाई WhatsApp मा एउटै सन्देश पठाउनुहोस्। प्रत्येक सन्देश एक ट्यापले खुल्छ — WhatsApp ले स्वचालित रूपमा पठाउँदैन।",sw:"Tuma ujumbe mmoja kwa wazazi wote wa darasa kwenye WhatsApp. Kila ujumbe hufunguka kwa mguso mmoja — WhatsApp haitumi kiotomatiki.",ar:"أرسل رسالة واحدة إلى جميع أولياء أمور الصف على واتساب. تفتح كل رسالة بنقرة واحدة — واتساب لا يرسل تلقائيًا."},

bc_use_placeholders:{en:"Name, father, class and school fill themselves in: {name} {father} {class} {adm} {school} {date}",ur:"نام، والد، کلاس اور اسکول خود بھر جاتے ہیں: {name} {father} {class} {adm} {school} {date}",bn:"নাম, বাবা, ক্লাস ও স্কুল নিজে থেকে বসে যায়: {name} {father} {class} {adm} {school} {date}",hi:"नाम, पिता, कक्षा और स्कूल खुद भर जाते हैं: {name} {father} {class} {adm} {school} {date}",ne:"नाम, बुबा, कक्षा र विद्यालय आफैं भरिन्छन्: {name} {father} {class} {adm} {school} {date}",sw:"Jina, baba, darasa na shule hujaza zenyewe: {name} {father} {class} {adm} {school} {date}",ar:"الاسم والأب والصف والمدرسة تُملأ تلقائيًا: {name} {father} {class} {adm} {school} {date}"},
ask_no_broadcast:{en:"No parent in this class has a WhatsApp number saved.",ur:"اس کلاس میں کسی والد کا واٹس ایپ نمبر درج نہیں ہے۔",bn:"এই ক্লাসের কোনো অভিভাবকের WhatsApp নম্বর সংরক্ষিত নেই।",hi:"इस कक्षा में किसी अभिभावक का WhatsApp नंबर सहेजा नहीं है।",ne:"यो कक्षाका कुनै अभिभावकको WhatsApp नम्बर सुरक्षित छैन।",sw:"Hakuna mzazi wa darasa hili aliye na nambari ya WhatsApp iliyohifadhiwa.",ar:"لا يوجد رقم واتساب محفوظ لأي ولي أمر في هذا الصف."},
bc_msg_absent:{en:"Assalam-o-Alaikum, {name} ({father}) of class {class} was absent from school today ({date}). Please send your child tomorrow. — {school}",ur:"السلام علیکم، {name} ({father}) کلاس {class} آج اسکول نہیں آیا/آئی ({date})۔ براہ کرم کل بچے کو اسکول بھیجیں۔ — {school}",bn:"আসসালামু আলাইকুম, {name} ({father}), ক্লাস {class}, আজ স্কুলে আসেনি ({date})। অনুগ্রহ করে আগামীকাল আপনার সন্তানকে স্কুলে পাঠান। — {school}",hi:"अस्सलाम-ओ-अलैकुम, {name} ({father}), कक्षा {class}, आज स्कूल नहीं आया/आई ({date})। कृपया कल अपने बच्चे को स्कूल भेजें। — {school}",ne:"अस्सलामु अलैकुम, {name} ({father}), कक्षा {class}, आज विद्यालय आएन ({date})। कृपया भोलि आफ्नो बच्चालाई विद्यालय पठाउनुहोस्। — {school}",sw:"Assalamu alaikum, {name} ({father}) wa darasa la {class} hakufika shuleni leo ({date}). Tafadhali mtume mtoto wako kesho. — {school}",ar:"السلام عليكم، {name} ({father}) من الصف {class} لم يحضر إلى المدرسة اليوم ({date}). يرجى إرسال طفلك غدًا. — {school}"},
bc_msg_fee:{en:"Assalam-o-Alaikum, the fee for {name} ({father}), class {class}, is due. Please pay at the school office. — {school}",ur:"السلام علیکم، {name} ({father}) کلاس {class} کی فیس واجب الادا ہے۔ براہ کرم اسکول دفتر میں ادا کریں۔ — {school}",bn:"আসসালামু আলাইকুম, {name} ({father}), ক্লাস {class}-এর ফি বকেয়া আছে। অনুগ্রহ করে স্কুল অফিসে জমা দিন। — {school}",hi:"अस्सलाम-ओ-अलैकुम, {name} ({father}), कक्षा {class} की फीस बकाया है। कृपया स्कूल कार्यालय में जमा करें। — {school}",ne:"अस्सलामु अलैकुम, {name} ({father}), कक्षा {class} को शुल्क बाँकी छ। कृपया विद्यालय कार्यालयमा बुझाउनुहोस्। — {school}",sw:"Assalamu alaikum, ada ya {name} ({father}), darasa la {class}, inastahili kulipwa. Tafadhali lipa ofisini shuleni. — {school}",ar:"السلام عليكم، رسوم {name} ({father})، الصف {class}، مستحقة. يرجى الدفع في مكتب المدرسة. — {school}"},
bc_msg_result:{en:"Assalam-o-Alaikum, the result of {name} ({father}), class {class}, has been published. Please collect the report card from the school. — {school}",ur:"السلام علیکم، {name} ({father}) کلاس {class} کا نتیجہ جاری ہو گیا ہے۔ براہ کرم رپورٹ کارڈ اسکول سے وصول کریں۔ — {school}",bn:"আসসালামু আলাইকুম, {name} ({father}), ক্লাস {class}-এর ফলাফল প্রকাশিত হয়েছে। অনুগ্রহ করে স্কুল থেকে রিপোর্ট কার্ড সংগ্রহ করুন। — {school}",hi:"अस्सलाम-ओ-अलैकुम, {name} ({father}), कक्षा {class} का परिणाम जारी हो गया है। कृपया स्कूल से रिपोर्ट कार्ड लें। — {school}",ne:"अस्सलामु अलैकुम, {name} ({father}), कक्षा {class} को नतिजा प्रकाशित भएको छ। कृपया विद्यालयबाट रिपोर्ट कार्ड लिनुहोस्। — {school}",sw:"Assalamu alaikum, matokeo ya {name} ({father}), darasa la {class}, yametangazwa. Tafadhali chukua kadi ya ripoti shuleni. — {school}",ar:"السلام عليكم، تم إعلان نتيجة {name} ({father})، الصف {class}. يرجى استلام بطاقة التقرير من المدرسة. — {school}"},
bc_msg_datesheet:{en:"Assalam-o-Alaikum, the exam date sheet for class {class} has been announced. Please check with your child. — {school}",ur:"السلام علیکم، کلاس {class} کی امتحانی ڈیٹ شیٹ کا اعلان ہو گیا ہے۔ براہ کرم اپنے بچے سے پوچھیں۔ — {school}",bn:"আসসালামু আলাইকুম, ক্লাস {class}-এর পরীক্ষার ডেট শিট ঘোষণা করা হয়েছে। অনুগ্রহ করে আপনার সন্তানের কাছে জেনে নিন। — {school}",hi:"अस्सलाम-ओ-अलैकुम, कक्षा {class} की परीक्षा तिथि पत्रक घोषित हो गया है। कृपया अपने बच्चे से पूछें। — {school}",ne:"अस्सलामु अलैकुम, कक्षा {class} को परीक्षा तालिका घोषणा भएको छ। कृपया आफ्नो बच्चासँग सोध्नुहोस्। — {school}",sw:"Assalamu alaikum, ratiba ya mtihani ya darasa la {class} imetangazwa. Tafadhali uliza mtoto wako. — {school}",ar:"السلام عليكم، تم الإعلان عن جدول امتحانات الصف {class}. يرجى السؤال من طفلك. — {school}"},
bc_msg_general:{en:"Assalam-o-Alaikum, a message from {school} for the parents of class {class}.",ur:"السلام علیکم، {school} کی طرف سے کلاس {class} کے والدین کے لیے ایک پیغام۔",bn:"আসসালামু আলাইকুম, ক্লাস {class}-এর অভিভাবকদের জন্য {school} থেকে একটি বার্তা।",hi:"अस्सलाम-ओ-अलैकुम, कक्षा {class} के अभिभावकों के लिए {school} की ओर से एक संदेश।",ne:"अस्सलामु अलैकुम, कक्षा {class} का अभिभावकहरूका लागि {school} बाट एउटा सन्देश।",sw:"Assalamu alaikum, ujumbe kutoka {school} kwa wazazi wa darasa la {class}.",ar:"السلام عليكم، رسالة من {school} لأولياء أمور الصف {class}."},

he_prog_in_use:{en:"This program has courses. Delete them first.",ur:"اس پروگرام میں کورسز ہیں۔ پہلے انہیں حذف کریں۔",bn:"এই প্রোগ্রামে কোর্স আছে। আগে সেগুলো মুছুন।",hi:"इस कार्यक्रम में पाठ्यक्रम हैं। पहले उन्हें हटाएं।",ne:"यस कार्यक्रममा पाठ्यक्रमहरू छन्। पहिले तिनीहरूलाई मेटाउनुहोस्।",sw:"Programu hii ina kozi. Zifute kwanza.",ar:"هذا البرنامج يحتوي على مقررات. احذفها أولاً."},
he_no_program:{en:"No programs yet. Add one above.",ur:"ابھی کوئی پروگرام نہیں۔ اوپر سے شامل کریں۔",bn:"এখনও কোনো প্রোগ্রাম নেই। উপরে যোগ করুন।",hi:"अभी कोई कार्यक्रम नहीं। ऊपर से जोड़ें।",ne:"अहिलेसम्म कुनै कार्यक्रम छैन। माथिबाट थप्नुहोस्।",sw:"Hakuna programu bado. Ongeza moja hapo juu.",ar:"لا توجد برامج بعد. أضف واحدًا أعلاه."},
ask_no_gpa:{en:"No GPA record for this student yet.",ur:"اس طالب علم کا ابھی کوئی GPA ریکارڈ نہیں۔",bn:"এই শিক্ষার্থীর এখনও কোনো GPA রেকর্ড নেই।",hi:"इस छात्र का अभी कोई GPA रिकॉर्ड नहीं है।",ne:"यस विद्यार्थीको अहिलेसम्म कुनै GPA रेकर्ड छैन।",sw:"Hakuna rekodi ya GPA kwa mwanafunzi huyu bado.",ar:"لا يوجد سجل معدل لهذا الطالب بعد."},

team_hint:{en:"Add your school's teachers by email. Each teacher signs in with their own account and sees only this school — one account can never open two schools.",ur:"اپنے اسکول کے اساتذہ کو ای میل سے شامل کریں۔ ہر استاد اپنے اکاؤنٹ سے سائن ان کرتا ہے اور صرف یہی اسکول دیکھتا ہے — ایک اکاؤنٹ کبھی دو اسکول نہیں کھول سکتا۔",bn:"ইমেইল দিয়ে আপনার স্কুলের শিক্ষকদের যোগ করুন। প্রত্যেক শিক্ষক নিজের অ্যাকাউন্টে সাইন ইন করেন এবং শুধু এই স্কুলটিই দেখেন — একটি অ্যাকাউন্ট কখনো দুটি স্কুল খুলতে পারে না।",hi:"ईमेल से अपने स्कूल के शिक्षकों को जोड़ें। प्रत्येक शिक्षक अपने खाते से साइन इन करता है और केवल यही स्कूल देखता है — एक खाता कभी दो स्कूल नहीं खोल सकता।",ne:"इमेलबाट आफ्नो विद्यालयका शिक्षकहरू थप्नुहोस्। प्रत्येक शिक्षक आफ्नै खाताबाट साइन इन गर्छन् र यो विद्यालय मात्र देख्छन् — एउटा खाताले कहिल्यै दुई विद्यालय खोल्न सक्दैन।",sw:"Ongeza walimu wa shule yako kwa barua pepe. Kila mwalimu huingia kwa akaunti yake na huona shule hii tu — akaunti moja haiwezi kamwe kufungua shule mbili.",ar:"أضف معلمي مدرستك بالبريد الإلكتروني. يسجّل كل معلم بحسابه الخاص ويرى هذه المدرسة فقط — لا يمكن لحساب واحد أن يفتح مدرستين أبدًا."},

team_sent:{en:"Invitation sent — they set their own password from the email.",ur:"دعوت بھیج دی گئی — وہ ای میل سے اپنا پاس ورڈ خود بنائیں گے۔",bn:"আমন্ত্রণ পাঠানো হয়েছে — তারা ইমেইল থেকে নিজের পাসওয়ার্ড সেট করবেন।",hi:"निमंत्रण भेजा गया — वे ईमेल से अपना पासवर्ड खुद बनाएंगे।",ne:"निमन्त्रणा पठाइयो — उनीहरूले इमेलबाट आफ्नो पासवर्ड आफैं बनाउनेछन्।",sw:"Mwaliko umetumwa — wataweka nenosiri lao wenyewe kutoka barua pepe.",ar:"تم إرسال الدعوة — سيضعون كلمة مرورهم بأنفسهم من البريد الإلكتروني."},
team_no_sdk:{en:"Could not reach the sign-in service. Try again.",ur:"سائن ان سروس تک نہیں پہنچ سکے۔ دوبارہ کوشش کریں۔",bn:"সাইন-ইন পরিষেবায় পৌঁছানো যায়নি। আবার চেষ্টা করুন।",hi:"साइन-इन सेवा तक नहीं पहुंच सके। फिर से प्रयास करें।",ne:"साइन-इन सेवामा पुग्न सकिएन। फेरि प्रयास गर्नुहोस्।",sw:"Imeshindwa kufikia huduma ya kuingia. Jaribu tena.",ar:"تعذّر الوصول إلى خدمة تسجيل الدخول. حاول مرة أخرى."},
team_exists:{en:"This email already has an account.",ur:"اس ای میل کا اکاؤنٹ پہلے سے موجود ہے۔",bn:"এই ইমেইলের অ্যাকাউন্ট ইতিমধ্যেই আছে।",hi:"इस ईमेल का खाता पहले से मौजूद है।",ne:"यो इमेलको खाता पहिले नै छ।",sw:"Barua pepe hii tayari ina akaunti.",ar:"هذا البريد الإلكتروني لديه حساب بالفعل."},
team_resend:{en:"Resend setup email",ur:"سیٹ اپ ای میل دوبارہ بھیجیں",bn:"সেটআপ ইমেইল আবার পাঠান",hi:"सेटअप ईमेल फिर से भेजें",ne:"सेटअप इमेल फेरि पठाउनुहोस्",sw:"Tuma tena barua pepe ya kusanidi",ar:"إعادة إرسال بريد الإعداد"},
team_list:{en:"No teachers yet — invite one above.",ur:"ابھی کوئی استاد نہیں — اوپر سے مدعو کریں۔",bn:"এখনও কোনো শিক্ষক নেই — উপরে আমন্ত্রণ জানান।",hi:"अभी कोई शिक्षक नहीं — ऊपर से आमंत्रित करें।",ne:"अहिलेसम्म कुनै शिक्षक छैनन् — माथिबाट निमन्त्रणा गर्नुहोस्।",sw:"Hakuna walimu bado — mwalike mmoja hapo juu.",ar:"لا يوجد معلمون بعد — ادعُ واحدًا أعلاه."},

gemini_key_bad:{en:"This key is not valid. Copy it again from Google AI Studio — use the Copy button, and check there are no extra spaces.",ur:"یہ کی درست نہیں ہے۔ اسے گوگل اے آئی اسٹوڈیو سے دوبارہ کاپی کریں — کاپی بٹن استعمال کریں اور یقینی بنائیں کہ کوئی اضافی جگہ نہ ہو۔",bn:"এই কীটি বৈধ নয়। Google AI Studio থেকে আবার কপি করুন — Copy বোতামটি ব্যবহার করুন এবং অতিরিক্ত ফাঁকা জায়গা নেই তা দেখুন।",hi:"यह कुंजी मान्य नहीं है। Google AI Studio से इसे फिर से कॉपी करें — Copy बटन का उपयोग करें और देखें कि कोई अतिरिक्त स्थान न हो।",ne:"यो की मान्य छैन। Google AI Studio बाट फेरि प्रतिलिपि गर्नुहोस् — Copy बटन प्रयोग गर्नुहोस् र अतिरिक्त खाली ठाउँ छैन भनी जाँच गर्नुहोस्।",sw:"Ufunguo huu si halali. Nakili tena kutoka Google AI Studio — tumia kitufe cha Copy, na hakikisha hakuna nafasi za ziada.",ar:"هذا المفتاح غير صالح. انسخه مجددًا من Google AI Studio — استخدم زر النسخ وتأكد من عدم وجود مسافات زائدة."},
gemini_model:{en:"Google has retired this AI model, so the key cannot be tested. Update the app to the newest version and try again.",ur:"گوگل نے یہ اے آئی ماڈل بند کر دیا ہے، اس لیے کی کی جانچ نہیں ہو سکتی۔ ایپ کو نئے ورژن میں اپ ڈیٹ کریں اور دوبارہ کوشش کریں۔",bn:"Google এই AI মডেলটি বন্ধ করে দিয়েছে, তাই কীটি পরীক্ষা করা যাচ্ছে না। অ্যাপটি নতুন সংস্করণে আপডেট করে আবার চেষ্টা করুন।",hi:"Google ने यह AI मॉडल बंद कर दिया है, इसलिए कुंजी जांची नहीं जा सकती। ऐप को नवीनतम संस्करण में अपडेट करें और फिर से प्रयास करें।",ne:"Google ले यो AI मोडेल बन्द गरेको छ, त्यसैले की परीक्षण गर्न सकिँदैन। एपलाई नयाँ संस्करणमा अद्यावधिक गर्नुहोस् र फेरि प्रयास गर्नुहोस्।",sw:"Google imesitisha mtindo huu wa AI, kwa hivyo ufunguo hauwezi kujaribiwa. Sasisha programu hadi toleo jipya zaidi na ujaribu tena.",ar:"أوقفت Google نموذج الذكاء الاصطناعي هذا، لذا لا يمكن اختبار المفتاح. حدّث التطبيق إلى أحدث إصدار وحاول مرة أخرى."},
gemini_busy:{en:"Too many tries in a short time. Wait a minute and test again.",ur:"تھوڑے وقت میں بہت سی کوششیں ہو گئیں۔ ایک منٹ انتظار کریں اور دوبارہ جانچیں۔",bn:"অল্প সময়ে অনেকবার চেষ্টা হয়েছে। এক মিনিট অপেক্ষা করে আবার পরীক্ষা করুন।",hi:"थोड़े समय में बहुत अधिक प्रयास हुए। एक मिनट प्रतीक्षा करें और फिर से जांचें।",ne:"छोटो समयमा धेरै प्रयास भए। एक मिनेट पर्खनुहोस् र फेरि परीक्षण गर्नुहोस्।",sw:"Majaribio mengi sana kwa muda mfupi. Subiri dakika moja na ujaribu tena.",ar:"محاولات كثيرة جدًا في وقت قصير. انتظر دقيقة وحاول مرة أخرى."},

login_promise:{en:"Your whole school — admissions, fees, exams, results — on one phone, in your language, even offline.",ur:"آپ کا پورا اسکول — داخلے، فیس، امتحانات، نتائج — ایک فون پر، آپ کی زبان میں، آف لائن بھی۔",bn:"আপনার পুরো স্কুল — ভর্তি, ফি, পরীক্ষা, ফলাফল — এক ফোনে, আপনার ভাষায়, অফলাইনেও।",hi:"आपका पूरा स्कूल — दाखिले, शुल्क, परीक्षाएँ, परिणाम — एक फ़ोन पर, आपकी भाषा में, ऑफ़लाइन भी।",ne:"तपाईंको पूरा विद्यालय — भर्ना, शुल्क, परीक्षा, नतिजा — एउटा फोनमा, तपाईंको भाषामा, अफलाइन पनि।",sw:"Shule yako yote — udahili, ada, mitihani, matokeo — kwenye simu moja, kwa lugha yako, hata bila mtandao.",ar:"مدرستك كلها — القبول، الرسوم، الامتحانات، النتائج — على هاتف واحد، بلغتك، حتى دون إنترنت."},
demo_try:{en:"Try the demo school",ur:"نمونہ اسکول آزمائیں",bn:"ডেমো স্কুল চেষ্টা করুন",hi:"डेमो स्कूल आज़माएँ",ne:"डेमो विद्यालय प्रयास गर्नुहोस्",sw:"Jaribu shule ya majaribio",ar:"جرّب المدرسة التجريبية"},
demo_school:{en:"Demo School",ur:"نمونہ اسکول",bn:"ডেমো স্কুল",hi:"डेमो स्कूल",ne:"डेमो विद्यालय",sw:"Shule ya Majaribio",ar:"المدرسة التجريبية"},
demo_banner:{en:"You are viewing the demo school. Nothing here touches real data.",ur:"آپ نمونہ اسکول دیکھ رہے ہیں۔ یہاں کچھ بھی اصل ڈیٹا کو نہیں چھوتا۔",bn:"আপনি ডেমো স্কুল দেখছেন। এখানে কিছুই আসল ডেটা স্পর্শ করে না।",hi:"आप डेमो स्कूल देख रहे हैं। यहाँ कुछ भी असली डेटा को नहीं छूता।",ne:"तपाईं डेमो विद्यालय हेर्दै हुनुहुन्छ। यहाँ केहीले पनि वास्तविक डाटा छुँदैन।",sw:"Unaangalia shule ya majaribio. Hakuna chochote hapa kinachogusa data halisi.",ar:"أنت تشاهد المدرسة التجريبية. لا شيء هنا يمسّ البيانات الحقيقية."},
demo_leave:{en:"Leave demo",ur:"ڈیمو چھوڑیں",bn:"ডেমো ছাড়ুন",hi:"डेमो छोड़ें",ne:"डेमो छोड्नुहोस्",sw:"Ondoka kwenye majaribio",ar:"مغادرة العرض"},
demo_signedin:{en:"Sign out first to try the demo school.",ur:"نمونہ اسکول آزمانے کے لیے پہلے سائن آؤٹ کریں۔",bn:"ডেমো স্কুল চেষ্টা করতে প্রথমে সাইন আউট করুন।",hi:"डेमो स्कूल आज़माने के लिए पहले साइन आउट करें।",ne:"डेमो विद्यालय प्रयास गर्न पहिले साइन आउट गर्नुहोस्।",sw:"Toka kwanza ili ujaribu shule ya majaribio.",ar:"سجّل خروجك أولًا لتجربة المدرسة التجريبية."},
es_dir_t:{en:"No students yet",ur:"ابھی کوئی طالب علم نہیں",bn:"এখনো কোনো শিক্ষার্থী নেই",hi:"अभी कोई छात्र नहीं है",ne:"अहिलेसम्म कुनै विद्यार्थी छैन",sw:"Hakuna mwanafunzi bado",ar:"لا يوجد طلاب بعد"},
es_dir_h:{en:"Your student directory lives here. Add your first student and their full record — admission, fees, exams, results — opens in one click.",ur:"آپ کے طلبہ کی فہرست یہاں ہوگی۔ اپنا پہلا طالب علم شامل کریں — داخلہ، فیس، امتحانات اور نتائج ایک کلک میں کھل جائیں گے۔",bn:"আপনার শিক্ষার্থী তালিকা এখানে থাকবে। আপনার প্রথম শিক্ষার্থী যোগ করুন — ভর্তি, ফি, পরীক্ষা ও ফলাফল এক ক্লিকে খুলবে।",hi:"आपकी छात्र निर्देशिका यहाँ रहेगी। अपना पहला छात्र जोड़ें — दाखिला, शुल्क, परीक्षा और परिणाम एक क्लिक में खुलेंगे।",ne:"तपाईंको विद्यार्थी निर्देशिका यहाँ रहन्छ। आफ्नो पहिलो विद्यार्थी थप्नुहोस् — भर्ना, शुल्क, परीक्षा र नतिजा एक क्लिकमा खुल्छ।",sw:"Orodha ya wanafunzi wako itakuwa hapa. Ongeza mwanafunzi wako wa kwanza — udahili, ada, mitihani na matokeo hufunguka kwa mbofyo mmoja.",ar:"سيكون دليل طلابك هنا. أضف أول طالب — القبول والرسوم والامتحانات والنتائج تفتح بنقرة واحدة."},
es_dir_b:{en:"Add your first student",ur:"اپنا پہلا طالب علم شامل کریں",bn:"আপনার প্রথম শিক্ষার্থী যোগ করুন",hi:"अपना पहला छात्र जोड़ें",ne:"आफ्नो पहिलो विद्यार्थी थप्नुहोस्",sw:"Ongeza mwanafunzi wako wa kwanza",ar:"أضف أول طالب"},
es_fee_t:{en:"No fee heads yet",ur:"ابھی فیس کی کوئی مد نہیں",bn:"এখনো কোনো ফি হেড নেই",hi:"अभी कोई शुल्क शीर्ष नहीं है",ne:"अहिलेसम्म कुनै शुल्क शीर्षक छैन",sw:"Hakuna kichwa cha ada bado",ar:"لا توجد بنود رسوم بعد"},
es_fee_h:{en:"Fee heads are the charges on every monthly bill — tuition, lab, transport. Set them once and every bill adds up itself.",ur:"فیس کی مدیں ہر ماہ کے بل کے اخراجات ہیں — ٹیوشن، لیب، ٹرانسپورٹ۔ ایک بار مقرر کریں تو ہر بل خود بن جائے گا۔",bn:"ফি হেড হল প্রতি মাসের বিলের খরচ — টিউশন, ল্যাব, পরিবহন। একবার সেট করলে প্রতিটি বিল নিজে নিজেই তৈরি হবে।",hi:"शुल्क शीर्ष हर मासिक बिल के शुल्क हैं — ट्यूशन, लैब, परिवहन। एक बार तय करें और हर बिल अपने आप बन जाएगा।",ne:"शुल्क शीर्षकहरू हरेक मासिक बिलका शुल्कहरू हुन् — ट्युसन, प्रयोगशाला, यातायात। एक पटक सेट गर्नुहोस् र हरेक बिल आफै बन्छ।",sw:"Vichwa vya ada ni malipo kwenye kila bili ya mwezi — masomo, maabara, usafiri. Viweke mara moja na kila bili itajijumlisha yenyewe.",ar:"بنود الرسوم هي التكاليف في كل فاتورة شهرية — الرسوم الدراسية والمختبر والنقل. حدّدها مرة واحدة وستُحسب كل فاتورة تلقائيًا."},
es_fee_b:{en:"Set up fee heads",ur:"فیس کی مدیں مقرر کریں",bn:"ফি হেড সেট করুন",hi:"शुल्क शीर्ष निर्धारित करें",ne:"शुल्क शीर्षकहरू सेट गर्नुहोस्",sw:"Weka vichwa vya ada",ar:"حدّد بنود الرسوم"},
es_exam_t:{en:"No exams yet",ur:"ابھی کوئی امتحان نہیں",bn:"এখনো কোনো পরীক্ষা নেই",hi:"अभी कोई परीक्षा नहीं है",ne:"अहिलेसम्म कुनै परीक्षा छैन",sw:"Hakuna mtihani bado",ar:"لا توجد امتحانات بعد"},
es_exam_h:{en:"Exams hold the marks grid, the date sheet and the result cards. Create your first exam and enter marks for the class.",ur:"امتحانات میں نمبروں کی جدول، ڈیٹ شیٹ اور رزلٹ کارڈ ہوتے ہیں۔ اپنا پہلا امتحان بنائیں اور جماعت کے نمبر درج کریں۔",bn:"পরীক্ষায় নম্বরের তালিকা, ডেট শিট ও রেজাল্ট কার্ড থাকে। আপনার প্রথম পরীক্ষা তৈরি করুন এবং ক্লাসের নম্বর দিন।",hi:"परीक्षाओं में अंक तालिका, तिथि-पत्र और परिणाम कार्ड होते हैं। अपनी पहली परीक्षा बनाएँ और कक्षा के अंक दर्ज करें।",ne:"परीक्षाहरूमा अङ्क तालिका, मिति तालिका र नतिजा कार्ड हुन्छन्। आफ्नो पहिलो परीक्षा सिर्जना गर्नुहोस् र कक्षाको अङ्क राख्नुहोस्।",sw:"Mitihani ina jedwali la alama, ratiba ya tarehe na kadi za matokeo. Unda mtihani wako wa kwanza na uweke alama za darasa.",ar:"تحتوي الامتحانات على جدول الدرجات وجدول التواريخ وبطاقات النتائج. أنشئ أول امتحان وأدخل درجات الصف."},
es_exam_b:{en:"Create your first exam",ur:"اپنا پہلا امتحان بنائیں",bn:"আপনার প্রথম পরীক্ষা তৈরি করুন",hi:"अपनी पहली परीक्षा बनाएँ",ne:"आफ्नो पहिलो परीक्षा सिर्जना गर्नुहोस्",sw:"Unda mtihani wako wa kwanza",ar:"أنشئ أول امتحان"},
es_att_t:{en:"No students to mark",ur:"حاضری کے لیے کوئی طالب علم نہیں",bn:"উপস্থিতি নেওয়ার মতো কোনো শিক্ষার্থী নেই",hi:"उपस्थिति लेने के लिए कोई छात्र नहीं है",ne:"हाजिरी लिन कुनै विद्यार्थी छैन",sw:"Hakuna mwanafunzi wa kuweka mahudhurio",ar:"لا يوجد طلاب لتسجيل الحضور"},
es_att_h:{en:"Attendance is marked here every morning — present, absent, late or on leave. First add students, then the register fills itself.",ur:"حاضری یہاں ہر صبح لگائی جاتی ہے — حاضر، غیر حاضر، دیر سے یا چھٹی پر۔ پہلے طلبہ شامل کریں، پھر رجسٹر خود بھر جائے گا۔",bn:"উপস্থিতি এখানে প্রতি সকালে নেওয়া হয় — উপস্থিত, অনুপস্থিত, দেরি বা ছুটি। প্রথমে শিক্ষার্থী যোগ করুন, তারপর রেজিস্টার নিজে ভরে যাবে।",hi:"उपस्थिति यहाँ हर सुबह ली जाती है — उपस्थित, अनुपस्थित, देर से या छुट्टी पर। पहले छात्र जोड़ें, फिर रजिस्टर अपने आप भर जाएगा।",ne:"हाजिरी यहाँ हरेक बिहान लिइन्छ — उपस्थित, अनुपस्थित, ढिलो वा बिदामा। पहिले विद्यार्थीहरू थप्नुहोस्, त्यसपछि रजिस्टर आफै भरिन्छ।",sw:"Mahudhurio huchukuliwa hapa kila asubuhi — alikuwepo, hayupo, amechelewa au likizo. Kwanza ongeza wanafunzi, kisha rejista itajijaza yenyewe.",ar:"يُسجَّل الحضور هنا كل صباح — حاضر أو غائب أو متأخر أو في إجازة. أضف الطلاب أولًا، ثم يمتلئ السجل تلقائيًا."},
es_att_b:{en:"Add your first student",ur:"اپنا پہلا طالب علم شامل کریں",bn:"আপনার প্রথম শিক্ষার্থী যোগ করুন",hi:"अपना पहला छात्र जोड़ें",ne:"आफ्नो पहिलो विद्यार्थी थप्नुहोस्",sw:"Ongeza mwanafunzi wako wa kwanza",ar:"أضف أول طالب"},
es_lib_t:{en:"No books yet",ur:"ابھی کوئی کتاب نہیں",bn:"এখনো কোনো বই নেই",hi:"अभी कोई किताब नहीं है",ne:"अहिलेसम्म कुनै पुस्तक छैन",sw:"Hakuna kitabu bado",ar:"لا توجد كتب بعد"},
es_lib_h:{en:"The library lists every book, lends it to a student for 14 days, and flags overdue returns. Add your first book to start.",ur:"لائبریری میں ہر کتاب کی فہرست ہوتی ہے، وہ طالب علم کو 14 دن کے لیے دی جاتی ہے اور دیر سے واپسی کی نشاندہی ہوتی ہے۔ شروع کرنے کے لیے پہلی کتاب شامل کریں۔",bn:"লাইব্রেরিতে প্রতিটি বইয়ের তালিকা থাকে, শিক্ষার্থীকে ১৪ দিনের জন্য দেওয়া হয় এবং দেরিতে ফেরত চিহ্নিত হয়। শুরু করতে প্রথম বই যোগ করুন।",hi:"पुस्तकालय में हर किताब की सूची होती है, छात्र को 14 दिन के लिए दी जाती है और देर से वापसी चिह्नित होती है। शुरू करने के लिए पहली किताब जोड़ें।",ne:"पुस्तकालयमा हरेक पुस्तकको सूची हुन्छ, विद्यार्थीलाई १४ दिनका लागि दिइन्छ र ढिलो फिर्ता चिन्ह लगाइन्छ। सुरु गर्न पहिलो पुस्तक थप्नुहोस्।",sw:"Maktaba inaorodhesha kila kitabu, humkopesha mwanafunzi kwa siku 14, na huashiria marejesho yaliyochelewa. Ongeza kitabu chako cha kwanza ili kuanza.",ar:"تسرد المكتبة كل كتاب، وتُعيره للطالب 14 يومًا، وتُعلّم الإرجاعات المتأخرة. أضف أول كتاب للبدء."},
es_lib_b:{en:"Add your first book",ur:"اپنی پہلی کتاب شامل کریں",bn:"আপনার প্রথম বই যোগ করুন",hi:"अपनी पहली किताब जोड़ें",ne:"आफ्नो पहिलो पुस्तक थप्नुहोस्",sw:"Ongeza kitabu chako cha kwanza",ar:"أضف أول كتاب"},
es_tr_t:{en:"No routes yet",ur:"ابھی کوئی روٹ نہیں",bn:"এখনো কোনো রুট নেই",hi:"अभी कोई मार्ग नहीं है",ne:"अहिलेसम्म कुनै रुट छैन",sw:"Hakuna njia bado",ar:"لا توجد طرق بعد"},
es_tr_h:{en:"Transport routes carry the bus fee onto each rider's monthly bill. Add a route with its stops, then assign students to it.",ur:"ٹرانسپورٹ روٹ کی فیس ہر سوار طالب علم کے ماہانہ بل میں شامل ہوتی ہے۔ اسٹاپس کے ساتھ روٹ شامل کریں، پھر طلبہ کو اس پر مقرر کریں۔",bn:"পরিবহন রুটের ভাড়া প্রত্যেক যাত্রী শিক্ষার্থীর মাসিক বিলে যোগ হয়। স্টপসহ একটি রুট যোগ করুন, তারপর শিক্ষার্থীদের তাতে বসান।",hi:"परिवहन मार्ग का किराया प्रत्येक सवार छात्र के मासिक बिल में जुड़ता है। स्टॉप के साथ एक मार्ग जोड़ें, फिर छात्रों को उस पर नियुक्त करें।",ne:"यातायात रुटको शुल्क हरेक यात्री विद्यार्थीको मासिक बिलमा थपिन्छ। स्टपहरूसहित एउटा रुट थप्नुहोस्, त्यसपछि विद्यार्थीहरूलाई तोक्नुहोस्।",sw:"Njia za usafiri huongeza ada ya basi kwenye bili ya kila mwanafunzi anayepanda. Ongeza njia pamoja na vituo vyake, kisha wawekee wanafunzi.",ar:"تُضاف أجرة النقل إلى الفاتورة الشهرية لكل طالب راكب. أضف طريقًا مع محطاته، ثم عيّن الطلاب عليه."},
es_tr_b:{en:"Add your first route",ur:"اپنا پہلا روٹ شامل کریں",bn:"আপনার প্রথম রুট যোগ করুন",hi:"अपना पहला मार्ग जोड़ें",ne:"आफ्नो पहिलो रुट थप्नुहोस्",sw:"Ongeza njia yako ya kwanza",ar:"أضف أول طريق"},
es_hw_t:{en:"No homework yet",ur:"ابھی کوئی ہوم ورک نہیں",bn:"এখনো কোনো হোমওয়ার্ক নেই",hi:"अभी कोई होमवर्क नहीं है",ne:"अहिलेसम्म कुनै गृहकार्य छैन",sw:"Hakuna kazi ya nyumbani bado",ar:"لا توجد واجبات منزلية بعد"},
es_hw_h:{en:"Homework set here shows up for parents under their child's result. Pick a class, write the task and set the due date.",ur:"یہاں دیا گیا ہوم ورک والدین کو ان کے بچے کے نتیجے کے نیچے دکھائی دیتا ہے۔ جماعت چنیں، کام لکھیں اور مقررہ تاریخ بتائیں۔",bn:"এখানে দেওয়া হোমওয়ার্ক অভিভাবকদের কাছে তাদের সন্তানের ফলাফলের নিচে দেখা যায়। ক্লাস বাছুন, কাজ লিখুন এবং শেষ তারিখ দিন।",hi:"यहाँ दिया गया होमवर्क अभिभावकों को उनके बच्चे के परिणाम के नीचे दिखता है। कक्षा चुनें, कार्य लिखें और नियत तिथि तय करें।",ne:"यहाँ दिइएको गृहकार्य अभिभावकहरूलाई उनीहरूका बच्चाको नतिजामुनि देखिन्छ। कक्षा छान्नुहोस्, कार्य लेख्नुहोस् र अन्तिम मिति तोक्नुहोस्।",sw:"Kazi ya nyumbani iliyowekwa hapa huonekana kwa wazazi chini ya matokeo ya mtoto wao. Chagua darasa, andika kazi na uweke tarehe ya mwisho.",ar:"تظهر الواجبات المنزلية المحددة هنا للأهل أسفل نتيجة طفلهم. اختر الصف، واكتب المهمة، وحدّد تاريخ التسليم."},
es_hw_b:{en:"Set homework",ur:"ہوم ورک دیں",bn:"হোমওয়ার্ক দিন",hi:"होमवर्क दें",ne:"गृहकार्य दिनुहोस्",sw:"Weka kazi ya nyumbani",ar:"حدّد واجبًا منزليًا"},
es_cmp_t:{en:"No complaints — good news",ur:"کوئی شکایت نہیں — اچھی خبر",bn:"কোনো অভিযোগ নেই — ভালো খবর",hi:"कोई शिकायत नहीं — अच्छी खबर",ne:"कुनै गुनासो छैन — राम्रो खबर",sw:"Hakuna malalamiko — habari njema",ar:"لا توجد شكاوى — خبر سارة"},
es_cmp_h:{en:"When a parent sends a complaint from the parent portal, it lands here. You reply to it here and mark it resolved.",ur:"جب کوئی والدین پیرنٹ پورٹل سے شکایت بھیجتے ہیں تو وہ یہاں آتی ہے۔ آپ یہیں جواب دیتے ہیں اور اسے حل شدہ قرار دیتے ہیں۔",bn:"অভিভাবক প্যারেন্ট পোর্টাল থেকে অভিযোগ পাঠালে তা এখানে আসে। আপনি এখানেই উত্তর দেন এবং সমাধান হয়েছে বলে চিহ্নিত করেন।",hi:"जब कोई अभिभावक पैरेंट पोर्टल से शिकायत भेजता है, तो वह यहाँ आती है। आप यहीं उत्तर देते हैं और उसे हल हुआ चिह्नित करते हैं।",ne:"जब अभिभावकले अभिभावक पोर्टलबाट गुनासो पठाउँछन्, त्यो यहाँ आउँछ। तपाईं यही जवाफ दिनुहुन्छ र समाधान भयो भनेर चिन्ह लगाउनुहुन्छ।",sw:"Mzazi anapotuma lalamiko kutoka kwenye lango la wazazi, linafika hapa. Unalijibu hapa na kuashiria kuwa limetatuliwa.",ar:"عندما يرسل أحد الأهل شكوى من بوابة الأهل، تصل إلى هنا. تردّ عليها هنا وتعلّمها كمحلولة."},
es_cmp_b:{en:"Back to Home",ur:"ہوم پر واپس",bn:"হোমে ফিরুন",hi:"होम पर वापस जाएँ",ne:"गृहपृष्ठमा फर्कनुहोस्",sw:"Rudi Nyumbani",ar:"عودة إلى الرئيسية"},

es_cert_h:{en:"Certificates — leaving, provisional, bonafide, character and transfer — are issued here with their own serial numbers and QR verification.",ur:"سرٹیفکیٹ — اسکول چھوڑنے، عارضی، بونافائیڈ، کردار اور ٹرانسفر — یہیں جاری ہوتے ہیں، اپنے سیریل نمبر اور کیو آر تصدیق کے ساتھ۔",bn:"সার্টিফিকেট — লিভিং, প্রভিশনাল, বোনাফাইড, ক্যারেক্টার ও ট্রান্সফার — এখানেই নিজস্ব সিরিয়াল নম্বর ও QR যাচাইসহ দেওয়া হয়।",hi:"प्रमाणपत्र — छोड़ने का, अस्थायी, बोनाफाइड, चरित्र और स्थानांतरण — यहीं अपने क्रमांक और QR सत्यापन के साथ जारी होते हैं।",ne:"प्रमाणपत्रहरू — छोड्ने, अस्थायी, बोनाफाइड, चरित्र र स्थानान्तरण — यहाँ आफ्नै क्रम सङ्ख्या र QR प्रमाणीकरणसहित जारी गरिन्छन्।",sw:"Vyeti — vya kuondoka, vya muda, vya uthibitisho, vya tabia na vya uhamisho — hutolewa hapa kwa nambari zake za mfululizo na uthibitisho wa QR.",ar:"تُصدر الشهادات — المغادرة والمؤقتة والإثبات وحسن السيرة والتحويل — هنا بأرقامها التسلسلية والتحقق عبر QR."},
es_cert_b:{en:"Issue your first certificate",ur:"اپنا پہلا سرٹیفکیٹ جاری کریں",bn:"আপনার প্রথম সার্টিফিকেট দিন",hi:"अपना पहला प्रमाणपत्र जारी करें",ne:"आफ्नो पहिलो प्रमाणपत्र जारी गर्नुहोस्",sw:"Toa cheti chako cha kwanza",ar:"أصدر أول شهادة"},

publish_locked_only:{en:"Results can only be published after the exam is locked (approved).",ur:"نتائج صرف امتحان بند (منظور) ہونے کے بعد شائع ہو سکتے ہیں۔",bn:"পরীক্ষা লক (অনুমোদিত) হওয়ার পরেই ফলাফল প্রকাশ করা যাবে।",hi:"परिणाम तभी प्रकाशित किए जा सकते हैं जब परीक्षा लॉक (स्वीकृत) हो।",ne:"नतिजा परीक्षा लक (स्वीकृत) भएपछि मात्र प्रकाशित गर्न सकिन्छ।",sw:"Matokeo yanaweza kuchapishwa tu baada ya mtihani kufungwa (kuidhinishwa).",ar:"لا يمكن نشر النتائج إلا بعد قفل الامتحان (الموافقة عليه)."},
publish_cloud_only:{en:"Publishing needs the online version and a teacher sign-in.",ur:"شائع کرنے کے لیے آن لائن ورژن اور استاد سائن ان ضروری ہے۔",bn:"প্রকাশ করতে অনলাইন সংস্করণ ও শিক্ষক সাইন-ইন লাগবে।",hi:"प्रकाशन के लिए ऑनलाइन संस्करण और शिक्षक साइन-इन चाहिए।",ne:"प्रकाशनका लागि अनलाइन संस्करण र शिक्षक साइन-इन चाहिन्छ।",sw:"Kuchapisha kunahitaji toleo la mtandaoni na kuingia kwa mwalimu.",ar:"يتطلب النشر النسخة المتصلة وتسجيل دخول معلم."},

parent_title:{en:"Check your child's result",ur:"اپنے بچے کا نتیجہ دیکھیں",bn:"আপনার সন্তানের ফলাফল দেখুন",hi:"अपने बच्चे का परिणाम देखें",ne:"आफ्नो बच्चाको नतिजा हेर्नुहोस्",sw:"Angalia matokeo ya mtoto wako",ar:"تحقق من نتيجة طفلك"},
parent_hint:{en:"Enter the admission number, the 4-digit PIN from the school, and the father's name exactly as registered.",ur:"داخلہ نمبر، اسکول سے ملا 4 ہندسوں والا PIN، اور والد کا نام بالکل ویسا ہی لکھیں جیسا رجسٹرڈ ہے۔",bn:"ভর্তি নম্বর, স্কুল থেকে দেওয়া ৪ সংখ্যার পিন এবং বাবার নাম ঠিক যেমন নিবন্ধিত আছে তেমন লিখুন।",hi:"प्रवेश संख्या, स्कूल से मिला 4 अंकों का पिन, और पिता का नाम बिल्कुल जैसा दर्ज है, वैसे ही लिखें।",ne:"भर्ना नम्बर, विद्यालयबाट प्राप्त ४ अङ्कको पिन र बुबाको नाम दर्ता भएजस्तै ठ्याक्कै लेख्नुहोस्।",sw:"Weka namba ya udahili, PIN ya tarakimu 4 kutoka shuleni, na jina la baba kama lilivyoandikishwa.",ar:"أدخل رقم القبول ورقم PIN المكوّن من 4 أرقام من المدرسة واسم الأب كما هو مسجل تمامًا."},
parent_pin:{en:"Result PIN (4 digits)",ur:"نتیجہ PIN (4 ہندسے)",bn:"ফলাফলের পিন (৪ সংখ্যা)",hi:"परिणाम पिन (4 अंक)",ne:"नतिजा पिन (४ अङ्क)",sw:"PIN ya matokeo (tarakimu 4)",ar:"رقم PIN للنتيجة (4 أرقام)"},
parent_go:{en:"Show result",ur:"نتیجہ دکھائیں",bn:"ফলাফল দেখুন",hi:"परिणाम दिखाएं",ne:"नतिजा देखाउनुहोस्",sw:"Onyesha matokeo",ar:"عرض النتيجة"},
parent_notfound:{en:"No result found — check the admission number, PIN and father's name, and try again.",ur:"کوئی نتیجہ نہیں ملا — داخلہ نمبر، PIN اور والد کا نام دوبارہ چیک کریں۔",bn:"কোনো ফলাফল পাওয়া যায়নি — ভর্তি নম্বর, পিন ও বাবার নাম যাচাই করে আবার চেষ্টা করুন।",hi:"कोई परिणाम नहीं मिला — प्रवेश संख्या, पिन और पिता का नाम जांचें, और फिर से प्रयास करें।",ne:"कुनै नतिजा भेटिएन — भर्ना नम्बर, पिन र बुबाको नाम जाँचेर फेरि प्रयास गर्नुहोस्।",sw:"Hakuna matokeo yaliyopatikana — angalia namba ya udahili, PIN na jina la baba, na ujaribu tena.",ar:"لم يتم العثور على نتيجة — تحقق من رقم القبول ورقم PIN واسم الأب، وحاول مرة أخرى."},
parent_noschool:{en:"Open your school's result link — it carries the school's name in the address.",ur:"اپنے اسکول کا نتیجہ لنک کھولیں — اس میں اسکول کا نام شامل ہے۔",bn:"আপনার স্কুলের ফলাফলের লিংকটি খুলুন — ঠিকানায় স্কুলের নাম আছে।",hi:"अपने स्कूल का परिणाम लिंक खोलें — उसमें पते में स्कूल का नाम होता है।",ne:"आफ्नो विद्यालयको नतिजा लिङ्क खोल्नुहोस् — त्यसमा ठेगानामा विद्यालयको नाम हुन्छ।",sw:"Fungua kiungo cha matokeo cha shule yako — kinabeba jina la shule kwenye anwani.",ar:"افتح رابط نتائج مدرستك — فهو يحمل اسم المدرسة في العنوان."},
parent_back:{en:"Back to teacher sign-in",ur:"استاد سائن ان پر واپس",bn:"শিক্ষক সাইন-ইনে ফিরুন",hi:"शिक्षक साइन-इन पर वापस जाएं",ne:"शिक्षक साइन-इनमा फर्कनुहोस्",sw:"Rudi kwenye kuingia kwa mwalimu",ar:"عودة إلى تسجيل دخول المعلم"},
restore_warn:{en:"Replace ALL data on this phone with the backup file? Your current entries will be lost. To combine two phones safely, use 'Receive from another phone' instead.",ur:"کیا اس فون کا تمام ڈیٹا بیک اپ فائل سے بدل دیں؟ آپ کی موجودہ اندراجات ختم ہو جائیں گی۔ دو فونز کو محفوظ طریقے سے ملانے کے لیے 'دوسرے فون سے ڈیٹا لیں' استعمال کریں۔",bn:"ব্যাকআপ ফাইল দিয়ে এই ফোনের সব ডেটা প্রতিস্থাপন করবেন? আপনার বর্তমান এন্ট্রি হারিয়ে যাবে। দুটি ফোন নিরাপদে একত্র করতে 'অন্য ফোন থেকে গ্রহণ করুন' ব্যবহার করুন।",hi:"क्या बैकअप फ़ाइल से इस फ़ोन का सारा डेटा बदल दें? आपकी मौजूदा प्रविष्टियां खो जाएंगी। दो फ़ोन सुरक्षित रूप से जोड़ने के लिए 'दूसरे फ़ोन से प्राप्त करें' इस्तेमाल करें।",ne:"ब्याकअप फाइलबाट यो फोनको सबै डाटा प्रतिस्थापन गर्ने हो? तपाईंका हालका प्रविष्टिहरू हराउनेछन्। दुई फोन सुरक्षित रूपमा जोड्न 'अर्को फोनबाट प्राप्त गर्नुहोस्' प्रयोग गर्नुहोस्।",sw:"Badilisha data YOTE kwenye simu hii kwa faili la nakala? Maingizo yako ya sasa yatapotea. Ili kuunganisha simu mbili kwa usalama, tumia 'Pokea kutoka simu nyingine' badala yake.",ar:"هل تريد استبدال جميع البيانات على هذا الهاتف بملف النسخة الاحتياطية؟ ستفقد إدخالاتك الحالية. لدمج هاتفين بأمان، استخدم 'استلام من هاتف آخر' بدلًا من ذلك."},

/* ================= IDENTITY RULE =================
   Student recognition ALWAYS uses name + father's name TOGETHER.
   displayName() is the single helper for every identity surface:
   directory rows, search results, dossier headers, marks grid labels.
   The admission number stays the unique key underneath. */
function displayName(st){return st.name+" — "+st.fatherName;}

/* ================= MODULE 4: result register ================= */
function viewResult(){
  let h='<div class="card"><h2>'+esc(t("res_title"))+'</h2><div class="toolbar">'+
    '<div class="field" style="margin:0;min-width:200px"><label>'+esc(t("select_exam"))+'</label>'+
    '<select id="r-pick">'+db().exams.map(function(ex){
      return '<option value="'+ex.id+'"'+(curResExamId===ex.id?" selected":"")+'>'+(ex.locked?"🔒 ":"")+esc(ex.name+" ("+(ex.year||"")+", "+clsLabel(ex.cls,ex.section)+")")+"</option>";
    }).join("")+'</select></div>'+
    '<button type="button" class="btn btn-sm" id="r-csv">'+esc(t("export_csv"))+'</button>'+
    '<button type="button" class="btn btn-sm" id="r-print">'+esc(t("print"))+'</button>'+
    '<button type="button" class="btn btn-sm" id="r-award">'+esc(t("award_list"))+'</button>'+
    '<button type="button" class="btn btn-sm btn-primary" id="r-batch">'+esc(t("print_all_cards"))+"</button> "+
    '<button type="button" class="btn btn-sm" id="r-publish">'+esc(t("publish_results"))+"</button> "+
    '<button type="button" class="btn btn-sm" id="r-unpublish">'+esc(t("unpublish_results"))+"</button></div>"+
    '<div id="r-pubmsg"></div>'+
    '<div id="r-sheet"></div><div id="r-awardbox" style="margin-top:1rem"></div></div>';
  h+='<div class="card"><h3>'+esc(t("report_card"))+'</h3><div class="toolbar">'+
    '<div class="field" style="margin:0;min-width:200px"><label>'+esc(t("f_name"))+'</label><select id="r-stu"></select></div>'+
    '<button type="button" class="btn btn-sm btn-primary" id="r-card">'+esc(t("view"))+'</button></div>'+
    '<div id="r-cardbox"></div></div>';
  return h;
}
function afterResult(){
  if(!curResExamId&&db().exams.length)curResExamId=db().exams[0].id;
  const pk=$("r-pick");
  const drawSheet=function(){
    const ex=db().exams.find(function(e){return e.id===curResExamId;});
    const box=$("r-sheet");
    if(!ex){box.innerHTML='<p class="muted">'+esc(t("no_records"))+"</p>";return;}
    const rows=computeResult(ex.id);
    const done=rows.filter(function(r){return r.complete;});
    const passed=done.filter(function(r){return r.pass;}).length;
    const failed=done.length-passed;
    const passPct=done.length?Math.round(passed/done.length*100):0;
    let h='<h3>'+(ex.locked?"🔒 ":"")+esc(ex.name)+'</h3>'+
      (ex.locked?'<p class="muted">🔒 '+esc(t("locked_badge"))+"</p>":"")+
      '<p class="muted">'+esc(t("sum_appeared"))+": <b>"+done.length+"</b> • "+
      esc(t("sum_passed"))+": <b>"+passed+"</b> • "+esc(t("sum_failed"))+": <b>"+failed+"</b> • "+
      esc(t("sum_passpct"))+": <b>"+passPct+"%</b>"+
      (rows.length>done.length?" • "+esc(t("sum_pending"))+": <b>"+(rows.length-done.length)+"</b>":"")+"</p>"+
      '<div class="twrap"><table class="grid"><tr><th>'+t("sno")+"</th><th>"+t("f_name")+
      "</th>"+ex.subjects.map(function(s){return '<th class="num">'+esc(s.name)+"</th>";}).join("")+
      '<th class="num">'+t("total")+'</th><th class="num">'+t("percentage")+'</th><th class="num">'+t("grade")+
      '</th><th class="num">'+t("division")+'</th><th class="num">'+t("position")+'</th><th class="num">'+t("result")+"</th><th>"+t("res_remark")+"</th></tr>";
    rows.forEach(function(r,i){
      h+="<tr><td class=\"num\">"+(i+1)+"</td><td><b>"+esc(displayName(r.student))+"</b><br><span class=\"muted\">"+esc(r.student.admNo)+"</span></td>";
      ex.subjects.forEach(function(sj){h+='<td class="num">'+(r.per[sj.name]==null?"—":r.per[sj.name])+"</td>";});
      h+='<td class="num"><b>'+(r.complete?r.total:"—")+'</b></td><td class="num">'+(r.pct==null?"—":r.pct.toFixed(1)+"%")+
        '</td><td class="num">'+r.grade+'</td><td class="num">'+r.division+'</td><td class="num">'+(r.position==null?"—":r.position)+
        '</td><td class="num">'+(r.pass==null?"—":(r.pass?esc(t("pass")):esc(t("fail"))))+"</td>"+
        '<td><input class="r-remark" data-st="'+r.student.id+'" value="'+esc(teacherRemark(ex.id,r.student.id))+'" placeholder="'+esc(t("res_remark"))+'"></td></tr>';
    });
    box.innerHTML=h+"</table></div>";
    Array.prototype.forEach.call(box.querySelectorAll(".r-remark"),function(inp){
      inp.onchange=function(){setRemark(curResExamId,inp.getAttribute("data-st"),inp.value);};
    });
    const incomplete=rows.filter(function(r){return !r.complete;}).length;
    if(incomplete)box.innerHTML+='<p class="muted">⚠ '+incomplete+" / "+rows.length+"</p>";
    const st=$("r-stu");
    st.innerHTML=rows.map(function(r){return '<option value="'+r.student.id+'">'+esc(displayName(r.student)+" ("+r.student.admNo+")")+"</option>";}).join("");
  };
  pk.onchange=function(){curResExamId=pk.value;drawSheet();};
  const pub=$("r-publish"),unp=$("r-unpublish"),pubmsg=$("r-pubmsg");
  if(pub)pub.onclick=function(){
    if(!curResExamId)return;
    const ex=db().exams.find(function(e){return e.id===curResExamId;});
    if(!ex||!ex.locked){pubmsg.innerHTML='<div class="msg err">'+esc(t("publish_locked_only"))+"</div>";return;}
    const r=publishResults(curResExamId);
    if(!r.ok){pubmsg.innerHTML='<div class="msg err">'+esc(r.error||t("login_fail"))+"</div>";return;}
    const link=parentLink();
    pubmsg.innerHTML='<div class="msg okm">'+esc(t("publish_done"))+" — "+r.count+" "+esc(t("dash_marks_done"))+".</div>"+
      (link?'<div class="card" style="margin-top:.5rem"><b>'+esc(t("publish_link"))+'</b><br><span style="word-break:break-all">'+esc(link)+"</span></div>":"");
  };
  if(unp)unp.onclick=function(){
    if(!curResExamId)return;
    const r=unpublishResults(curResExamId);
    pubmsg.innerHTML=r.ok?'<div class="msg okm">'+esc(t("unpublish_done"))+"</div>":'<div class="msg err">'+esc(r.error||t("login_fail"))+"</div>";
  };
  $("r-csv").onclick=function(){if(curResExamId)downloadFile("results.csv",exportCSV("results",curResExamId),"text/csv;charset=utf-8");};
  $("r-print").onclick=function(){if(curResExamId)doPrint(broadsheetPrintHTML(curResExamId));};
  $("r-award").onclick=function(){
    if(!curResExamId)return;
    $("r-awardbox").innerHTML=awardSheetHTML(curResExamId)+
      '<div class="toolbar"><button type="button" class="btn btn-sm" id="r-awardprint">'+esc(t("print"))+'</button> '+
      '<button type="button" class="btn btn-sm" id="r-awardcsv">'+esc(t("export_csv"))+"</button></div>";
    $("r-awardprint").onclick=function(){doPrint(awardListPrintHTML(curResExamId));};
    $("r-awardcsv").onclick=function(){downloadFile("award-list.csv",exportCSV("award",curResExamId),"text/csv;charset=utf-8");};
  };
  $("r-batch").onclick=function(){if(curResExamId)doPrint(reportCardsBatchHTML(curResExamId));};
  $("r-card").onclick=function(){
    const sid=$("r-stu").value;
    $("r-cardbox").innerHTML=reportCardHTML(curResExamId,sid)+
      '<div class="toolbar"><button type="button" class="btn btn-sm" id="r-cardprint">'+esc(t("print"))+"</button></div>";
    $("r-cardprint").onclick=function(){doPrint(reportCardHTML(curResExamId,sid));};
  };
  drawSheet();
}

/* ================= MODULE 6: certificates =================
   School Leaving + Provisional certificates.
   - Serials: separate forward-only sequences per type (SLC-YYYY-NNNN,
     PROV-YYYY-NNNN). Voided/deleted numbers are NEVER reused — same rule
     as admission numbers.
   - Frozen snapshot: the certificate stores the student's details AS
     ISSUED; later edits to the student record never change it.
   - Identity rule: joint "Name — Father's Name" everywhere. */
function nextCertSerial(type,issueDateISO){
  const key=CERT_TYPES[type]?type:"prov";
  const yr=String(issueDateISO||todayISO()).slice(0,4);
  db().seq.cert=db().seq.cert||{};
  db().seq.cert[key]=db().seq.cert[key]||{};
  const n=db().seq.cert[key][yr]||1;
  db().seq.cert[key][yr]=n+1;
  return (CERT_TYPES[key]?CERT_TYPES[key].prefix:"PROV-")+yr+"-"+String(n).padStart(4,"0");
}
/* Certificate types (Round 36): each has its own serial prefix. gate=true
   means the leaving documents that need fee clearance first. */
const CERT_TYPES={slc:{prefix:"SLC-",gate:true},prov:{prefix:"PROV-",gate:false},bon:{prefix:"BON-",gate:false},char:{prefix:"CHAR-",gate:false},trf:{prefix:"TRF-",gate:true}};
function certTypeName(type){return {slc:t("cert_slc"),prov:t("cert_prov"),bon:t("cert_bon"),char:t("cert_char"),trf:t("cert_trf")}[type]||t("cert_prov");}
function issueCertificate(studentId,type,d){
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st)return {ok:false,error:t("no_records")};
  if(!CERT_TYPES[type])return {ok:false,error:t("req")};
  if(CERT_TYPES[type].gate&&!feeClearance(studentId))return {ok:false,error:t("fee_clearance_err")};
  d=d||{};
  const issueDate=d.issueDate||todayISO();
  if(!validISODate(issueDate))return {ok:false,error:t("imp_bad_date")+": "+issueDate};
  const serial=nextCertSerial(type,issueDate);
  const cert={id:uid("ct"),serial:serial,type:type,studentId:st.id,issuedAt:issueDate,
    snapshot:{name:st.name,fatherName:st.fatherName,display:displayName(st),admNo:st.admNo,
      dob:st.dob,age:calcAge(st.dob,issueDate),admDate:st.admDate,cls:st.cls,section:st.section,gender:st.gender},
    reason:String(d.reason||"").trim(),remarks:String(d.remarks||"").trim(),
    purpose:String(d.purpose||"").trim(),
    conduct:type==="char"?(String(d.conduct||"").trim()||t("cert_conduct_good")):"",
    status:"issued",history:[]};
  cert.verifyCode=verifyCodeFor("cert",cert.id);
  cert.verifySchool=verifySchoolId();
  db().certificates=db().certificates||[];
  db().certificates.push(cert);
  if(typeof Cloud!=="undefined")Cloud.pushDoc("verifyDocs",cert.verifyCode,{type:"cert",code:cert.verifyCode,serial:cert.serial,certType:type,student:{name:cert.snapshot.name,fatherName:cert.snapshot.fatherName,admNo:cert.snapshot.admNo,cls:cert.snapshot.cls},issuedAt:cert.issuedAt,at:tsNow()});
  logHist(cert,"issue",serial+" — "+cert.snapshot.display+" ["+cert.snapshot.admNo+"]");
  audit("issue-certificate",serial+" ("+certTypeName(type)+")");
  Store.save();
  return {ok:true,cert:cert};
}
function voidCertificate(id){
  const c=getCertificate(id);
  if(!c||c.status==="void")return {ok:false};
  c.status="void";
  if(c.verifyCode&&typeof Cloud!=="undefined")Cloud.deleteDoc("verifyDocs",c.verifyCode);
  logHist(c,"void",c.serial+" ("+t("cert_voided")+")");
  Store.save();
  return {ok:true};
}
function getCertificate(id){return (db().certificates||[]).find(function(c){return c.id===id;})||null;}
function certsOfStudent(studentId){
  return (db().certificates||[]).filter(function(c){return c.studentId===studentId;})
    .sort(function(a,b){return a.issuedAt<b.issuedAt?1:-1;});
}

  h+="</div></div>";
  return h;

function afterAdmin(){
  const gs=$("adm-gemini-save");
  if(gs)gs.onclick=function(){
    const k=$("adm-gemini").value.trim(),mg=$("adm-gemini-msg");
    if(!k){mg.innerHTML='<div class="msg err">'+esc(t("ai_no_key"))+'</div>';return;}
    mg.innerHTML='<div class="msg">'+esc(t("gemini_thinking"))+'</div>';
    Cloud.setPlatformKey(k).then(function(r){
      if(r&&r.ok){mg.innerHTML='<div class="msg ok">'+esc(t("platform_key_saved"))+'</div>';$("adm-gemini").value="";}
      else{mg.innerHTML='<div class="msg err">'+esc(t("ai_test_bad"))+'</div>';}
    });
  };
  const gt2=$("adm-gemini-test");
  if(gt2)gt2.onclick=function(){
    const mg=$("adm-gemini-msg");
    if(!Cloud.platformKey){mg.innerHTML='<div class="msg err">'+esc(t("ai_no_key"))+'</div>';return;}
    mg.innerHTML='<div class="msg">'+esc(t("gemini_thinking"))+'</div>';
    geminiPing(Cloud.platformKey).then(function(r){
      if(r.ok){mg.innerHTML='<div class="msg ok">'+esc(t("ai_test_ok"))+'</div>';return;}
      const msgs={no_key:"ai_no_key",invalid_key:"gemini_key_bad",not_allowed:"gemini_key_bad",model:"gemini_model",busy:"gemini_busy",net:"gemini_offline",empty:"gemini_empty",other:"ai_test_bad"};
      mg.innerHTML='<div class="msg err">'+esc(t(msgs[r.reason]||"ai_test_bad"))+'</div>';
    });
  };
  loadAdminSignups();
  const sgBox=$("adm-signups");
  if(sgBox)sgBox.onclick=function(ev){
    const el=ev.target&&ev.target.closest?ev.target.closest("[data-sgapprove],[data-sgreject]"):null;
    if(!el)return;
    const noteIn=document.querySelector('[data-sgnote="'+(el.getAttribute("data-sgapprove")||el.getAttribute("data-sgreject"))+'"]');
    const note=noteIn?noteIn.value:"";
    el.disabled=true;el.textContent="⏳";
    if(el.hasAttribute("data-sgapprove")){
      Cloud.approveSignup(el.getAttribute("data-sgapprove")).then(function(r){
        if(r&&r.ok){sgBox.innerHTML='<div class="msg ok">✅ '+esc(t("signup_approved"))+": "+esc(r.schoolId)+"<br>"+esc(t("signup_next"))+"</div>";loadAdminList();}
        else{el.disabled=false;el.textContent=t("signup_approve");}
      });
      return;
    }
    Cloud.rejectSignup(el.getAttribute("data-sgreject"),note).then(function(r){
      if(r&&r.ok)loadAdminSignups();
      else{el.disabled=false;el.textContent=t("signup_reject");}
    });
  };
  const box=$("adm-list");
  if(box)box.onclick=function(ev){
    const el=ev.target&&ev.target.closest?ev.target.closest("[data-confirm],[data-block],[data-teachers],[data-tblock]"):null;
    if(!el)return;
    if(el.hasAttribute("data-confirm")){
      const parts=String(el.getAttribute("data-confirm")).split("|");
      if(parts.length!==2)return;
      el.disabled=true;el.textContent="⏳";
      Cloud.confirmSubPayment(parts[0],parts[1]).then(function(r){
        if(r&&r.ok)loadAdminList();
        else{el.disabled=false;el.textContent=t("sub_confirm");}
      });
      return;
    }
    if(el.hasAttribute("data-block")){
      const sid=el.getAttribute("data-block"),cur=el.getAttribute("data-cur")==="1";
      el.disabled=true;el.textContent="⏳";
      Cloud.setSchoolBlocked(sid,!cur).then(function(){loadAdminList();});
      return;
    }
    if(el.hasAttribute("data-teachers")){
      renderAdminTeachers(el.getAttribute("data-teachers"));
      return;
    }
    if(el.hasAttribute("data-tblock")){
      const parts=String(el.getAttribute("data-tblock")).split("|");
      if(parts.length!==2)return;
      const cur=el.getAttribute("data-cur")==="1";
      el.disabled=true;el.textContent="⏳";
      Cloud.setTeacherDisabled(parts[0],!cur).then(function(){renderAdminTeachers(parts[1]);});
      return;
    }
  };
  loadAdminList();
}

      h+="</div>";
      $("s-msg").innerHTML=h;
      render();

    rd.readAsText(f);
    e.target.value="";
  };
  $("s-demo").onclick=function(){if(confirm(t("seed_warn"))){seedDemo();render();}};

    render();
  };
