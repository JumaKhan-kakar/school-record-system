<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Record System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a6fd4'/%3E%3Cpath d='M18 34l10 10 18-22' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ base ============ */
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1c2733; --muted:#67727e;
  --brand:#1a6fd4; --brand-d:#1259ab; --ok:#1e8e3e; --warn:#b26a00;
  --bad:#c5221f; --line:#dfe5ea; --chip:#e8f0fe;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Nastaliq Urdu","Jameel Noori Nastaleeq",sans-serif;
  font-size:16px;line-height:1.55}
h1,h2,h3{margin:.4em 0}
button{font:inherit}
/* ============ header ============ */
.hdr{background:var(--brand);color:#fff;padding:.7rem .9rem;position:sticky;top:0;z-index:50}
.hdr .row{display:flex;align-items:center;gap:.6rem;justify-content:space-between}
.hdr .school{font-weight:700;font-size:1.15rem}
.hdr .sub{font-size:.8rem;opacity:.9}
.langbtn{background:#fff;color:var(--brand);border:0;border-radius:999px;
  padding:.45rem .95rem;font-weight:700;min-height:44px;cursor:pointer}
.langwrap{position:relative}
.langmenu{position:absolute;top:calc(100% + .3rem);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem;z-index:60;box-shadow:0 4px 16px rgba(20,40,60,.18);min-width:230px}
.langmenu input{width:100%;padding:.5rem .6rem;min-height:44px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:.3rem}
#lang-menu-list,#s-lang-list{max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* ============ tabs ============ */
.tabs{display:flex;gap:.4rem;overflow-x:auto;background:var(--card);
  border-bottom:1px solid var(--line);padding:.45rem .6rem;position:sticky;top:57px;z-index:40}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:.5rem .95rem;min-height:44px;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
/* ============ layout ============ */
.wrap{max-width:1100px;margin:0 auto;padding:.8rem .7rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:.9rem;margin-bottom:.9rem;box-shadow:0 1px 2px rgba(20,40,60,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:.65rem}
.field label{display:block;font-weight:600;margin-bottom:.25rem;font-size:.92rem}
.field input,.field select,.field textarea{width:100%;padding:.6rem .65rem;min-height:44px;
  border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.field .hint{font-size:.8rem;color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:.6rem 1rem;min-height:44px;cursor:pointer;font-weight:600;margin:.15rem}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:active{background:var(--brand-d)}
.btn-danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-sm{padding:.35rem .7rem;min-height:38px;font-size:.88rem}
.msg{border-radius:10px;padding:.6rem .8rem;margin:.5rem 0;font-weight:600}
.msg.err{background:#fdecea;color:var(--bad);border:1px solid #f5c6c2}
.err-input{border-color:#c5221f!important;box-shadow:0 0 0 2px rgba(197,34,31,.18)}
.msg.okm{background:#e6f4ea;color:var(--ok);border:1px solid #b7dfc0}
.msg.warnm{background:#fef7e0;color:var(--warn);border:1px solid #f3df9a}
/* ============ tables ============ */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
table.grid th,table.grid td{border:1px solid var(--line);padding:.45rem .5rem;text-align:start;font-size:.92rem}
table.grid th{background:#eef3f8;position:sticky;top:0}
table.grid td.num,table.grid th.num{text-align:center}
table.grid input.cell{width:64px;padding:.35rem .3rem;border:1px solid var(--line);border-radius:6px;text-align:center;font:inherit}
table.grid input.cell.bad{border-color:var(--bad);background:#fdecea}
tr.totalrow td{background:#eef3f8;font-weight:700}
.flag{display:inline-block;background:#fdecea;color:var(--bad);border-radius:6px;padding:.1rem .5rem;font-size:.82rem;font-weight:700}
.flag.okf{background:#e6f4ea;color:var(--ok)}
.chip{display:inline-block;background:var(--chip);color:var(--brand-d);border-radius:999px;padding:.15rem .7rem;font-size:.85rem;font-weight:600;margin:.1rem}
/* ============ misc ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem;text-align:center}
.kpi .n{font-size:1.6rem;font-weight:800;color:var(--brand)}
.kpi .l{font-size:.85rem;color:var(--muted)}
.hist{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:.5rem;padding-top:.4rem}
.hist div{padding:.15rem 0;border-bottom:1px dotted #eef1f4}
.toolbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.6rem}
.search{flex:1;min-width:160px;padding:.6rem .7rem;min-height:44px;border:1px solid var(--line);border-radius:10px;font:inherit}
.muted{color:var(--muted);font-size:.9rem}
hr.sep{border:0;border-top:1px solid var(--line);margin:1rem 0}
#print-area{display:none}
/* ============ register photo helper + bulk import ============ */
.regphoto{border:1px dashed var(--line);border-radius:10px;padding:.7rem;margin-bottom:.8rem;background:#fafcff}
.regphoto-img{max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:.5rem}
.tipbox{background:#fff8e1;border:1px solid #f0dfae;border-radius:10px;padding:.7rem;margin:.6rem 0;font-size:.92rem}
/* ============ student photos + award list (round 3) ============ */
.thumb{border-radius:50%;object-fit:cover;vertical-align:middle;flex:none;background:#dfe7f3;border:1px solid var(--line)}
.thumb-ph{border-radius:50%;vertical-align:middle;flex:none;background:#dfe7f3;color:#3c5a86;display:inline-flex;align-items:center;justify-content:center;font-weight:700;border:1px solid var(--line)}
.idrow{display:flex;align-items:center;gap:.5rem}
.storbar{height:10px;background:#eef2f7;border-radius:6px;overflow:hidden;margin:.4rem 0}
.storbar>div{height:100%;background:var(--brand)}
.scan-paste{width:100%;min-height:90px;padding:.6rem;border:1px solid var(--line);border-radius:8px;font:inherit;box-sizing:border-box}
.photocard{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
/* ============ scan review + voice entry ============ */
.rev-val{padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:#f2fbf4;min-height:44px;cursor:pointer}
.field input.amber,.field select.amber{border-color:var(--warn);background:#fff8e1}
.micwrap{position:relative}
.micwrap input,.micwrap textarea{padding-inline-end:56px}
.micbtn{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);min-width:44px;min-height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.15rem;line-height:1;padding:0}
.micbtn.rec{background:#fdecea;border-color:var(--bad)}
#mic-toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1a73e8;color:#fff;padding:.65rem 1.1rem;border-radius:999px;z-index:9999;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.3);animation:micpulse 1.1s ease-in-out infinite;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes micpulse{50%{opacity:.65}}
/* ============ result card (screen preview) ============ */
.rcard{border:2px solid var(--ink);border-radius:6px;padding:1rem;background:#fff;max-width:700px;margin:0 auto}
.rcard .rc-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:.6rem;margin-bottom:.8rem}
.rcard .rc-head img{height:54px;vertical-align:middle;margin-inline-end:.6rem}
.rcard .rc-head h2{margin:.1rem 0}
.rcard .rc-id{display:grid;grid-template-columns:1fr 1fr;gap:.25rem .8rem;font-size:.92rem;margin-bottom:.7rem}
.rcard .rc-sum{display:flex;flex-wrap:wrap;gap:.4rem;margin:.7rem 0}
/* ============ responsive: laptop / desktop ============ */
@media(max-width:899px){
  /* phone & tablet portrait: dossier takes the full view, directory hides behind Back */
  .dossier-open .dircol{display:none}
}
@media(min-width:900px){
  /* laptop/desktop: comfortable two-pane — directory left, dossier right */
  .wrap{max-width:1280px;padding:1rem 1.2rem 4rem}
  .dirpane{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:1rem;align-items:start}
  .dirpane .card{margin-bottom:0}
  table.grid{min-width:0}
  table.grid input.cell{width:80px;padding:.5rem .3rem}
  .hdr .school{font-size:1.3rem}
  .tab:hover{background:#e8f0fe}
  .btn:hover{filter:brightness(.96)}
}
/* ============ print ============ */
@page{size:A4;margin:11mm}
@media print{
  .app,#print-area{display:none!important}
  body{background:#fff}
  #print-area{display:block!important;direction:ltr}
  #print-area.rtl{direction:rtl}
  .prt{font-family:inherit;color:#000}
  .prt h2{text-align:center;margin:.2rem 0}
  .prt .sub{text-align:center;margin:.1rem 0 .6rem}
  .prt table{border-collapse:collapse;width:100%;font-size:11px}
  .prt th,.prt td{border:1px solid #000;padding:4px 5px;text-align:left}
  .prt.rtl th,.prt.rtl td{text-align:right}
  .prt .sign{display:flex;justify-content:space-between;margin-top:2.2rem}
  .prt .sign div{width:30%;border-top:1px solid #000;padding-top:4px;text-align:center;font-size:11px}
  .prt .rc-head{text-align:center;border:2px solid #000;padding:.5rem;margin-bottom:.6rem}
  .prt .rc-info{display:flex;justify-content:space-between;font-size:12px;margin-bottom:.5rem;flex-wrap:wrap;gap:.3rem}
  .rc-page{page-break-after:always}
  .rc-page:last-child{page-break-after:auto}
  .rcard{border:2px solid #000;border-radius:0;padding:8px;max-width:none;margin:0}
  .rcard .rc-head{border-bottom:2px solid #000}
  .rcard .rc-head img{height:50px}
  .rcard .rc-id{font-size:12px}
  .rcard table{font-size:12px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr no-print">
    <div class="row">
      <div>
        <div class="school" id="hdr-school">School Record System</div>
      </div>
      <div class="langwrap">
        <button class="langbtn" id="lang-toggle" type="button">English ▾</button>
        <div id="lang-menu" class="langmenu" hidden>
          <input id="lang-menu-search" autocomplete="off">
          <div id="lang-menu-list"></div>
        </div>
      </div>
    </div>
  </header>
  <nav class="tabs no-print" id="tabs" role="tablist"></nav>
  <main class="wrap no-print" id="view"></main>
</div>
<div id="print-area"></div>

/* age as {y,m} of dobISO as-of asOfISO */
function calcAge(dobISO,asOfISO){
  const a=String(dobISO).slice(0,10).split("-").map(Number);
  const b=String(asOfISO).slice(0,10).split("-").map(Number);
  let y=b[0]-a[0], m=b[1]-a[1];
  if(b[2]<a[2]) m--;
  if(m<0){y--;m+=12;}
  return {y:y,m:m};
}

function fmtAge(a){return a.y+t("years")+" "+a.m+t("months");}

  if(n!==9&&n!==10)return null;
  if(!st.dob)return null;

      if(!prev){this.lastSyncedJSON=JSON.stringify(cur);return;}
      const a=this.flatten(prev),b=this.flatten(cur);
      const batch=this.fs.batch();let n=0;
      const self=this;

        });
      });
      if(n>0)batch.commit().catch(function(){});
      this.lastSyncedJSON=JSON.stringify(cur);

function findDuplicateStudent(name,fatherName,dob,excludeId){
  const n=norm(name),f=norm(fatherName);

    return s.id!==excludeId&&norm(s.name)===n&&norm(s.fatherName)===f&&s.dob===dob;

function addStudent(d){
  const req=[["name","f_name"],["fatherName","father_name"],["dob","dob"],["gender","gender"],["cls","cls"],["admDate","adm_date"]];
  const missing=[];
  for(let i=0;i<req.length;i++){if(!String(d[req[i][0]]||"").trim())missing.push(req[i][0]);}
  if(missing.length){const lk={name:"f_name",fatherName:"father_name",dob:"dob",gender:"gender",cls:"cls",section:"section",admDate:"adm_date"};return {ok:false,error:t("req_some")+": "+missing.map(function(k){return t(lk[k]);}).join(", "),missing:missing};}
  if(String(d.dob||"")>todayISO())return {ok:false,error:t("dob_future"),missing:["dob"]};
  const dup=findDuplicateStudent(d.name,d.fatherName,d.dob,null);
  if(dup)return {ok:false,error:t("dup_student")+": "+dup.name+" ("+t("father_name")+": "+dup.fatherName+", "+t("dob")+": "+fmtDate(dup.dob)+") — "+t("dup_msg")+" ["+dup.admNo+"]"};
  let pin=String(d.pin||"").trim()||null;
  if(!pin){let tries=0;do{pin=String(1000+Math.floor(Math.random()*9000));tries++;}while(tries<25&&db().students.some(function(s){return s.pin===pin;}));}
  const st={id:uid("st"),admNo:nextAdmNo(d.admDate),name:d.name.trim(),fatherName:d.fatherName.trim(),
    dob:d.dob,gender:d.gender,cls:String(d.cls).trim(),section:String(d.section||"").trim(),
    admDate:d.admDate,contact:String(d.contact||"").trim(),address:String(d.address||"").trim(),
    pin:pin,history:[]};
  db().students.push(st);
  logHist(st,"admit",st.admNo+" — "+st.name);
  Store.save();
  return {ok:true,student:st};
}
function updateStudent(id,d){
  const st=db().students.find(function(s){return s.id===id;});
  if(!st)return {ok:false,error:t("no_records")};
  const dup=findDuplicateStudent(d.name,d.fatherName,d.dob,id);
  if(dup)return {ok:false,error:t("dup_student")+": "+dup.admNo+" — "+t("dup_msg")};
  const before=st.name+" ("+st.admNo+")";
  ["name","fatherName","dob","gender","cls","section","admDate","contact","address"].forEach(function(k){
    if(d[k]!==undefined)st[k]=String(d[k]).trim();
  });
  if(d.pin!==undefined)st.pin=String(d.pin).trim()||null;
  logHist(st,"update",before+" → "+st.name);
  Store.save();
  return {ok:true,student:st};
}
function deleteStudent(id){
  const i=db().students.findIndex(function(s){return s.id===id;});
  if(i<0)return {ok:false};
  const st=db().students[i];
  db().students.splice(i,1);
  audit("delete",st.admNo+" — "+st.name+" ("+t("nav_adm")+")");
  Store.save();
  return {ok:true};
}
/* ================= student photos (round 3) =================
   Teachers capture each student's face on the phone; the photo travels with
   the joint identity on every surface so same-name students are recognized
   at a glance. Stored as a downscaled JPEG data URL on the student record
   (target ~20–50 KB each). Optional everywhere — everything works without
   a photo. Quota failures revert the change and report; data is never
   corrupted. */
const PHOTO_MAX_CHARS=200000; /* ~150KB data-URL ceiling per photo */
function studentPhotoHTML(st,px){
  px=Number(px)||40;
  const sz="width:"+px+"px;height:"+px+"px;";
  if(st&&st.photo)return '<img class="thumb" src="'+st.photo+'" style="'+sz+'" alt="">';
  const ini=st?String(st.name||"?").trim().slice(0,1).toUpperCase():"?";
  return '<span class="thumb-ph" style="'+sz+'font-size:'+Math.max(12,Math.round(px*0.42))+'px">'+esc(ini)+"</span>";
}
function setStudentPhoto(id,dataUrl){
  const st=db().students.find(function(s){return s.id===id;});
  if(!st)return {ok:false,error:t("no_records")};
  dataUrl=String(dataUrl||"");
  if(dataUrl&&dataUrl.length>PHOTO_MAX_CHARS)return {ok:false,error:t("photo_big")};
  const prev=st.photo||"";
  st.photo=dataUrl;
  if(!Store.trySave()){st.photo=prev;return {ok:false,error:t("photo_quota")};}
  logHist(st,"photo",dataUrl?(prev?"photo replaced":"photo added"):"photo removed");
  return {ok:true};
}
/* browser-only: downscale a captured photo file to a small JPEG data URL */
function captureStudentPhoto(file,cb){
  const rd=new FileReader();
  rd.onload=function(){
    const img=new Image();
    img.onload=function(){
      const MAX=480;let w=img.width,h=img.height;
      const sc=Math.min(1,MAX/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.7));
    };
    img.onerror=function(){cb(null);};
    img.src=rd.result;
  };
  rd.onerror=function(){cb(null);};
  rd.readAsDataURL(file);
}

/* class promotion (session end): move a whole class/section to the next
   class in one tap. Admission numbers NEVER change; every student gets a
   "promoted" history entry and the global audit records the batch. */
function promoteClass(cls,section,toCls,toSec){
  const list=studentsOf(cls,section);
  if(!list.length)return {ok:false,error:t("no_records")};
  toCls=String(toCls==null?"":toCls).trim();toSec=String(toSec==null?"":toSec).trim();
  if(!toCls)return {ok:false,error:t("req")};
  const from=clsLabel(cls,section);
  list.forEach(function(st){
    st.cls=toCls;st.section=toSec;
    logHist(st,"promoted",from+" → "+clsLabel(toCls,toSec));
  });
  Store.save();
  return {ok:true,count:list.length,from:from,to:clsLabel(toCls,toSec)};
}

function isBoardClass(cls){const n=parseInt(String(cls==null?"":cls).trim(),10);return n===8||n===9||n===10;}

function deleteExam(id){

function lockExam(id,locked){

function setMark(examId,studentId,subject,raw){
  const ex=db().exams.find(function(e){return e.id===examId;});
  if(!ex)return {ok:false,error:t("no_records")};
  if(ex.locked)return {ok:false,error:t("marks_locked")};
  const sub=ex.subjects.find(function(s){return s.name===subject;});
  if(!sub)return {ok:false,error:t("no_records")};
  const r=String(raw==null?"":raw).trim();
  if(r==="")return {ok:false,error:t("v_required")};
  const v=Number(r);
  if(!isFinite(v))return {ok:false,error:t("v_number")};
  if(v<0||v>sub.max)return {ok:false,error:t("v_range")+" "+sub.max+"."};
  db().marks[examId]=db().marks[examId]||{};
  db().marks[examId][studentId]=db().marks[examId][studentId]||{};
  db().marks[examId][studentId][subject]=v;
  return {ok:true,value:v};
}
/* ================= results ================= */
function gradeFor(pct){const s=db().settings.gradeScale.slice().sort(function(a,b){return b.min-a.min;});for(let i=0;i<s.length;i++){if(pct>=s[i].min)return s[i].g;}return "F";}
function divisionFor(pct){const s=db().settings.divisions.slice().sort(function(a,b){return b.min-a.min;});for(let i=0;i<s.length;i++){if(pct>=s[i].min)return s[i].d;}return "";}
function remarkFor(g){return g==="A+"?t("rk_excellent"):g==="A"?t("rk_vgood"):g==="B"?t("rk_good"):g==="C"?t("rk_fair"):t("rk_poor");}
/* result row for one student in one exam (no position yet) */
function resultRow(ex,st){
  const passPct=Number(db().settings.passPct)||33;
  const m=(db().marks[ex.id]&&db().marks[ex.id][st.id])||{};
  const per={};let total=0,maxTotal=0,complete=true,pass=true;
  ex.subjects.forEach(function(sj){
    maxTotal+=sj.max;
    const v=m[sj.name];
    if(v==null||!isFinite(Number(v))){complete=false;per[sj.name]=null;}
    else{per[sj.name]=Number(v);total+=Number(v);if(Number(v)<sj.max*passPct/100)pass=false;}
  });
  const pct=complete&&maxTotal>0?total/maxTotal*100:null;
  return {student:st,per:per,total:total,maxTotal:maxTotal,complete:complete,
    pct:pct,grade:pct==null?"—":gradeFor(pct),division:pct==null?"—":divisionFor(pct),
    pass:complete?pass:null,position:null};
}
/* standard competition ranking: 1,2,2,4 — assigns positions in place */
function assignPositions(rows){
  const done=rows.filter(function(r){return r.complete;});
  done.forEach(function(r){let higher=0;done.forEach(function(o){if(o.total>r.total)higher++;});r.position=higher+1;});
}
function computeResult(examId){
  const ex=db().exams.find(function(e){return e.id===examId;});
  if(!ex)return [];
  const rows=studentsOf(ex.cls,ex.section).map(function(st){return resultRow(ex,st);});
  assignPositions(rows);
  return rows;
}
/* one student's row inside an exam's cohort (for the dossier, even if the
   student has since changed class/section) */
function resultRowFor(examId,studentId){
  const ex=db().exams.find(function(e){return e.id===examId;});if(!ex)return null;
  const st=db().students.find(function(s){return s.id===studentId;});if(!st)return null;
  const row=resultRow(ex,st);
  if(row.complete){
    const cohort=studentsOf(ex.cls,ex.section).map(function(s){return resultRow(ex,s);});
    let higher=0;cohort.forEach(function(o){if(o.complete&&o.total>row.total)higher++;});
    row.position=higher+1;
  }
  return {exam:ex,row:row};
}
/* ================= AWARD LIST (round 3) =================
   Per-exam award roll: per-subject obtained/total, pass marks per paper,

/* Remarks per the paper award roll: Fail, or Pass with 1st/2nd/3rd position. */
function awardRemark(r){

  if(r.position===2)return t("pass")+" — 2nd";
  if(r.position===3)return t("pass")+" — 3rd";
  return t("pass");
}

/* ================= STUDENT DOSSIER — the student-centric hub =================
   One call returns the student's complete record: profile, admission, DOB+age,
   and every exam term organized year -> term -> subject. The dossier views
   read straight off this; it is the primary read path, not an afterthought. */
function getDossier(studentId,asOf){
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st)return null;
  asOf=asOf||todayISO();
  const age=calcAge(st.dob,asOf),band=db().settings.ageBands[st.cls];
  const withMarks=db().exams.filter(function(ex){const m=db().marks[ex.id];return m&&m[studentId];});
  const upcoming=db().exams.filter(function(ex){
    return ex.cls===st.cls&&ex.section===st.section&&!(db().marks[ex.id]&&db().marks[ex.id][studentId]);
  });
  const terms=withMarks.concat(upcoming).map(function(ex){
    const rr=resultRowFor(ex.id,studentId);
    return {exam:ex,row:rr?rr.row:null};
  }).sort(function(a,b){
    const ya=Number(a.exam.year)||0,yb=Number(b.exam.year)||0;
    if(ya!==yb)return yb-ya;
    return (a.exam.term==="mid"?0:1)-(b.exam.term==="mid"?0:1);
  });
  return {student:st,age:age,asOf:asOf,band:band,
    eligible:band?inBand(age,band):null,boardElig:boardEligible(st),terms:terms};
}

   Weekly class timetable: 6 days (Mon-Sat) x 8 periods, subject + teacher per cell.

function ttConflicts(){
  /* returns [{day,per,teacher,classes:[...]}] for every clash */
  const map={};
  Object.keys(db().timetable||{}).forEach(function(cls){
    const g=db().timetable[cls];
    Object.keys(g||{}).forEach(function(day){
      Object.keys(g[day]||{}).forEach(function(per){
        const t=(g[day][per]||{}).teacher;
        if(!t)return;
        const key=day+"|"+per+"|"+t.toLowerCase();
        map[key]=map[key]||{day:+day,per:+per,teacher:t,classes:[]};
        if(map[key].classes.indexOf(cls)<0)map[key].classes.push(cls);
      });
    });
  });

/* Attendance flags (Round 18, pain #12): below-75% and chronic absence.
   Boards expect >=75% attendance to sit exams; a register only shows the
   slide at the end of term. A student is flagged when the month's % is under
   75, OR absent 5+ days in the month, OR absent 3+ days in any one week. */
function weekKey(dateISO){
  const d=new Date(dateISO+"T00:00:00");
  const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  /* local date parts, NOT toISOString(): UTC conversion shifts the day back
     in PKT (midnight local = 19:00 UTC the day before). */
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function attFlags(month){
  const att=db().attendance||{};
  const per={};
  Object.keys(att).forEach(function(date){
    if(date.slice(0,7)!==month)return;
    Object.keys(att[date]||{}).forEach(function(sid){
      const v=att[date][sid];
      if(!per[sid])per[sid]={total:0,present:0,absent:0,weeks:{}};
      per[sid].total++;
      if(v==="P"||v==="L")per[sid].present++;
      if(v==="A"){per[sid].absent++;const wk=weekKey(date);per[sid].weeks[wk]=(per[sid].weeks[wk]||0)+1;}
    });
  });
  const out=[];
  Object.keys(per).forEach(function(sid){
    const p=per[sid];
    const pct=p.total?Math.round(p.present/p.total*100):100;
    const reasons=[];
    if(pct<75)reasons.push("below75");
    if(p.absent>=5)reasons.push("chronic");
    Object.keys(p.weeks).forEach(function(wk){if(p.weeks[wk]>=3&&reasons.indexOf("chronic")<0)reasons.push("chronic");});
    if(!reasons.length)return;
    const st=db().students.find(function(s){return s.id===sid;});
    if(!st)return;
    out.push({student:st,total:p.total,present:p.present,absent:p.absent,pct:pct,reasons:reasons});
  });
  out.sort(function(a,b){return a.pct-b.pct;});
  return out;
}
function attFlagsHTML(month){
  const flags=attFlags(month);
  if(!flags.length)return "";
  let h='<div class="card"><h3>⚠ '+esc(t("att_flags"))+'</h3><div class="twrap"><table class="grid"><tr><th>'+esc(t("f_name"))+'</th><th class="num">'+esc(t("att_pct"))+'</th><th class="num">'+esc(t("att_a"))+'</th><th>'+esc(t("att_flag_reason"))+"</th></tr>";
  flags.forEach(function(f){

/* ================= attendance (Round 14) =================
   One register per day: attendance[dateISO] = {studentId: "P"|"A"|"L"|"V"}.
   P = present, A = absent, L = late, V = leave.
   Late counts as present for the attendance % (the child came), shown separately.
   Absent parents get a WhatsApp message: the app builds the text and opens wa.me
   with the guardian's number from the student's contact field — no SMS gateway,
   no cost, works on any phone. */
function attStudents(cls){
  return db().students.filter(function(s){return s.cls===String(cls);})
    .sort(function(a,b){return a.admNo<b.admNo?-1:1;});
}
function attClasses(){
  const out=[];
  db().students.forEach(function(s){if(out.indexOf(s.cls)<0)out.push(s.cls);});
  return out.sort();
}
function attGet(date,studentId){
  const rec=(db().attendance||{})[date];
  return rec?String(rec[studentId]||""):"";
}
function setAtt(date,studentId,status){
  if(!validISODate(date))return {ok:false,error:t("imp_bad_date")+": "+date};
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st)return {ok:false,error:t("no_records")};
  if(status&&["P","A","L","V"].indexOf(status)<0)return {ok:false,error:t("req")};
  if(!db().attendance)db().attendance={};
  if(!db().attendance[date])db().attendance[date]={};
  if(status)db().attendance[date][studentId]=status;
  else delete db().attendance[date][studentId];
  if(!Object.keys(db().attendance[date]).length)delete db().attendance[date];
  audit("attendance",date+" — "+displayName(st)+" → "+(status||"—"));
  Store.save();
  return {ok:true};
}
function attMarkAll(date,cls,status){
  if(!validISODate(date))return {ok:false,error:t("imp_bad_date")+": "+date};
  if(["P","A","L","V"].indexOf(status)<0)return {ok:false,error:t("req")};
  const list=attStudents(cls);
  if(!db().attendance)db().attendance={};
  if(!db().attendance[date])db().attendance[date]={};
  list.forEach(function(s){db().attendance[date][s.id]=status;});
  audit("attendance",date+" — "+list.length+" × "+(cls||t("kpi_students"))+" → "+status);
  Store.save();
  return {ok:true,count:list.length};
}
function attSummary(date,cls){
  const list=cls?attStudents(cls):db().students;
  const s={total:list.length,P:0,A:0,L:0,V:0,unmarked:0};
  list.forEach(function(st){
    const v=attGet(date,st.id);
    if(v==="P")s.P++;else if(v==="A")s.A++;else if(v==="L")s.L++;else if(v==="V")s.V++;else s.unmarked++;
  });
  s.pct=s.total?Math.round((s.P+s.L)/s.total*100):0;
  return s;
}
function attAbsentees(date,cls){
  const list=cls?attStudents(cls):db().students;
  return list.filter(function(st){return attGet(date,st.id)==="A";});
}
function attMonthStats(studentId,ym){
  const s={P:0,A:0,L:0,V:0};
  Object.keys(db().attendance||{}).forEach(function(d){
    if(d.slice(0,7)!==ym)return;
    const v=db().attendance[d][studentId];
    if(v==="P")s.P++;else if(v==="A")s.A++;else if(v==="L")s.L++;else if(v==="V")s.V++;
  });
  return s;
}
function attMonthGrid(cls,year,month){
  const daysInMonth=new Date(year,month,0).getDate();
  const days=[];
  for(let d=1;d<=daysInMonth;d++)days.push(year+"-"+String(month).padStart(2,"0")+"-"+String(d).padStart(2,"0"));
  const list=attStudents(cls);
  const rows=list.map(function(st){
    const cells={};
    days.forEach(function(dt){cells[dt]=attGet(dt,st.id);});
    return {st:st,cells:cells};
  });
  return {days:days,rows:rows};
}
function attWaNumber(st){
  const digits=String(st.contact||"").replace(/\D/g,"");

}

/* ================= staff: attendance + salary (Round 28) =================
   Staff directory (the school's own roster — separate from the login
   accounts in teachers/{uid}) -> daily attendance -> monthly salary.
   Salary math: working days in the month = Mon-Sat days (the school week).
   per-day = base / working days. Deduction = (absent + 0.5 x late) x per-day.
   Approved leave (V) costs nothing. Days with NO attendance recorded are
   NOT counted as absent — the salary view warns when a month's register is
   incomplete. A generated salary is FROZEN (base, days, deduction);
   allowances and advances can be adjusted after. */
function staffActive(){
  return (db().staff||[]).filter(function(x){return x.active!==false;});
}
function addStaff(d){
  const name=String(d.name||"").trim();
  const salary=Math.max(0,Number(d.salary)||0);
  if(!name)return {ok:false,error:t("req")};
  if(salary<=0)return {ok:false,error:t("req")};
  const role=["teacher","head","principal","clerk","other"].indexOf(String(d.role||""))>=0?String(d.role):"teacher";
  const st={id:uid("stf"),name:name,role:role,phone:String(d.phone||"").trim(),salary:salary,joinDate:String(d.joinDate||todayISO()),active:true};
  db().staff.push(st);
  audit("staff-add",st.name+" ("+t("role_"+role)+") "+salary);
  Store.save();
  return {ok:true,staff:st};
}
function setStaffActive(id,active){
  const st=(db().staff||[]).find(function(x){return x.id===id;});
  if(!st)return {ok:false,error:t("req")};
  st.active=!!active;
  audit("staff-active",st.name+" -> "+(active?t("staff_active"):t("staff_inactive")));
  Store.save();
  return {ok:true};
}
function staffName(staffId){
  const st=(db().staff||[]).find(function(x){return x.id===staffId;});
  return st?st.name:"?";
}
function staffGet(date,staffId){
  const rec=(db().staffAtt||{})[date];
  return rec?String(rec[staffId]||""):"";
}
function setStaffAtt(date,staffId,status){
  if(!validISODate(date))return {ok:false,error:t("imp_bad_date")+": "+date};
  const st=(db().staff||[]).find(function(x){return x.id===staffId;});
  if(!st)return {ok:false,error:t("no_records")};
  if(status&&["P","A","L","V"].indexOf(status)<0)return {ok:false,error:t("req")};
  if(!db().staffAtt)db().staffAtt={};
  if(!db().staffAtt[date])db().staffAtt[date]={};
  if(status)db().staffAtt[date][staffId]=status;
  else delete db().staffAtt[date][staffId];
  if(!Object.keys(db().staffAtt[date]).length)delete db().staffAtt[date];
  audit("staff-att",date+" — "+st.name+" -> "+(status||"—"));
  Store.save();
  return {ok:true};
}
function staffMarkAll(date,status){
  if(!validISODate(date))return {ok:false,error:t("imp_bad_date")+": "+date};
  if(["P","A","L","V"].indexOf(status)<0)return {ok:false,error:t("req")};
  const list=staffActive();
  if(!db().staffAtt)db().staffAtt={};
  if(!db().staffAtt[date])db().staffAtt[date]={};
  list.forEach(function(s){db().staffAtt[date][s.id]=status;});
  audit("staff-att",date+" — "+list.length+" staff -> "+status);
  Store.save();
  return {ok:true,count:list.length};
}
function staffAttSummary(date){
  const list=staffActive();
  const s={total:list.length,P:0,A:0,L:0,V:0,unmarked:0};
  list.forEach(function(st){
    const v=staffGet(date,st.id);
    if(v==="P")s.P++;else if(v==="A")s.A++;else if(v==="L")s.L++;else if(v==="V")s.V++;else s.unmarked++;
  });
  s.pct=s.total?Math.round((s.P+s.L)/s.total*100):0;
  return s;
}
function staffAbsentees(date){
  return staffActive().filter(function(st){return staffGet(date,st.id)==="A";});
}
/* Mon-Sat days in a YYYY-MM month (the school week). */
function workingDaysInMonth(ym){
  const p=String(ym||"").split("-");if(p.length<2)return 0;
  const y=+p[0],m=+p[1]-1,last=new Date(y,m+1,0).getDate();
  let n=0;
  for(let d=1;d<=last;d++){const wd=new Date(y,m,d).getDay();if(wd!==0)n++;}
  return n;
}
function staffMonthStats(staffId,ym){
  const s={P:0,A:0,L:0,V:0,unmarked:0};
  const att=db().staffAtt||{};
  Object.keys(att).forEach(function(date){
    if(date.slice(0,7)!==ym)return;
    const v=att[date][staffId];if(!v){s.unmarked++;return;}
    if(v==="P")s.P++;else if(v==="A")s.A++;else if(v==="L")s.L++;else if(v==="V")s.V++;
  });
  return s;
}
function salaryRecord(staffId,month){
  return (db().salaryRecords||[]).find(function(r){return r.staffId===staffId&&r.month===month;});
}
function salaryPaid(rec){return (rec.payments||[]).reduce(function(a,p){return a+Number(p.amount||0);},0);}
function salaryStatus(rec){
  const bal=rec.net-salaryPaid(rec);
  if(bal<=0)return "paid";
  if(salaryPaid(rec)>0)return "partial";
  return "unpaid";
}
function generateSalary(staffId,month){
  const st=(db().staff||[]).find(function(x){return x.id===staffId;});
  if(!st)return {ok:false,error:t("no_records")};
  if(salaryRecord(staffId,month))return {ok:false,error:t("sal_already")};
  const wd=workingDaysInMonth(month);
  const perDay=wd>0?Math.round(st.salary/wd):0;
  const ms=staffMonthStats(staffId,month);
  const ded=Math.round((ms.A+0.5*ms.L)*perDay);
  const rec={id:uid("sal"),staffId:staffId,month:month,base:st.salary,presentDays:ms.P,absentDays:ms.A,lateDays:ms.L,leaveDays:ms.V,workingDays:wd,perDay:perDay,deduction:ded,allowances:0,advances:0,net:Math.max(0,st.salary-ded),payments:[]};
  db().salaryRecords.push(rec);
  audit("salary-gen",month+" — "+st.name+" net "+rec.net+" (base "+rec.base+" - ded "+ded+")");
  Store.save();
  return {ok:true,record:rec};
}
function generateAllSalaries(month){
  const out={ok:true,generated:0,skipped:0};
  staffActive().forEach(function(st){
    const r=generateSalary(st.id,month);
    if(r.ok)out.generated++;else out.skipped++;
  });
  return out;
}
function salarySetAdjust(staffId,month,allowances,advances){
  const rec=salaryRecord(staffId,month);
  if(!rec)return {ok:false,error:t("no_records")};
  rec.allowances=Math.max(0,Number(allowances)||0);
  rec.advances=Math.max(0,Number(advances)||0);
  rec.net=Math.max(0,rec.base-rec.deduction+rec.allowances-rec.advances);
  audit("salary-adjust",month+" — "+staffName(staffId)+" allowances "+rec.allowances+" advances "+rec.advances+" net "+rec.net);
  Store.save();
  return {ok:true,record:rec};
}
function recordSalaryPayment(staffId,month,amount,method,txnId){
  amount=Number(amount)||0;
  if(amount<=0)return {ok:false,error:t("req")};
  if(["Cash","JazzCash","EasyPaisa","Bank"].indexOf(method)<0)return {ok:false,error:t("req")};
  const rec=salaryRecord(staffId,month);
  if(!rec)return {ok:false,error:t("no_records")};
  const pay={amount:amount,method:method,txnId:String(txnId||"").trim(),at:tsNow()};
  rec.payments.push(pay);
  audit("salary-pay",month+" — "+staffName(staffId)+" +"+amount+" ("+method+")");
  Store.save();
  return {ok:true,record:rec,payment:pay};
}
function salarySummary(month){
  const recs=(db().salaryRecords||[]).filter(function(r){return r.month===month;});
  const s={total:0,paid:0,outstanding:0,unpaid:0,records:recs.length};
  recs.forEach(function(r){
    const p=salaryPaid(r);
    s.total+=r.net;s.paid+=p;s.outstanding+=Math.max(0,r.net-p);
    if(salaryStatus(r)==="unpaid")s.unpaid++;
  });
  return s;
}
function salarySlipHTML(rec){
  const st=(db().staff||[]).find(function(x){return x.id===rec.staffId;});
  if(!st)return "";
  const paid=salaryPaid(rec),bal=Math.max(0,rec.net-paid);
  const stKey=salaryStatus(rec)==="paid"?"paid_full":salaryStatus(rec);
  const row=function(l,v){return "<tr><td>"+esc(l)+"</td><td style='text-align:end'>"+esc(String(v))+"</td></tr>";};
  return schoolHead(t("sal_slip")+" — "+rec.month)+
    '<p><b>'+esc(st.name)+'</b> • '+esc(t("role_"+st.role))+' • '+esc(t("staff_join"))+": "+esc(st.joinDate||"—")+"</p>"+
    "<table>"+
    row(t("sal_base"),rec.base)+
    row(t("sal_working")+" ("+t("sal_per_day")+": "+rec.perDay+")",rec.workingDays)+
    row(t("sal_present"),rec.presentDays)+
    row(t("sal_absent"),rec.absentDays)+
    row(t("sal_late")+" (½ "+t("sal_per_day")+")",rec.lateDays)+
    row(t("sal_leave"),rec.leaveDays)+
    row(t("sal_deduction"),"− "+rec.deduction)+
    row(t("sal_allowance"),"+ "+rec.allowances)+
    row(t("sal_advance"),"− "+rec.advances)+
    row(t("sal_net"),rec.net)+
    row(t("sal_paid"),paid)+
    row(t("sal_balance"),bal)+
    "</table>"+
    '<p style="margin-top:1.2rem">'+esc(t("sal_status"))+": <b>"+esc(t("sal_"+stKey))+"</b></p>"+
    '<div style="display:flex;justify-content:space-between;margin-top:2.5rem"><span>______________<br>'+esc(t("staff_name"))+'</span><span>______________<br>'+esc(t("role_head"))+" / "+esc(t("role_principal"))+"</span></div>";
}
function askFindStaff(q){
  const nq=askNorm(q);
  let best=null;
  (db().staff||[]).forEach(function(s){
    const nm=askNorm(s.name);
    if(nm&&nq.indexOf(nm)>=0&&(!best||nm.length>askNorm(best.name).length))best=s;
  });
  return best;
}

/* ================= date sheets + admit cards (Round 29) =================
   A date sheet is the exam's paper schedule: one row per paper
   (date, subject, start, end, room). It auto-saves as the teacher types,
   like the timetable. An admit card is one student's card for an exam:
   photo, name + father, class, admission number, the paper list, and a QR
   code anyone can scan to verify the card is genuine (a public verifyDoc,
   type "admit"). Issuing writes those public records; withdrawing deletes
   them. The card prints even before a date sheet exists — it then says
   the papers are to be announced. */
function dateSheetFor(examId){
  const sh=(db().dateSheets||{})[examId];
  return sh&&sh.entries?{entries:sh.entries.slice()}:{entries:[]};
}
function dateSheetEntries(examId){
  return (dateSheetFor(examId).entries||[]).filter(function(e){
    return e&&validISODate(e.date)&&String(e.subject||"").trim();
  }).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
}
function setDateSheet(examId,entries){
  const ex=(db().exams||[]).find(function(e){return e.id===examId;});
  if(!ex)return {ok:false,error:t("no_records")};
  if(!Array.isArray(entries))return {ok:false,error:t("req")};
  const seen={},clean=[];
  for(let i=0;i<entries.length;i++){
    const e=entries[i];
    if(!e)continue;
    const date=String(e.date||""),subject=String(e.subject||"").trim();
    if(!date&&!subject)continue; /* skip a blank row */
    if(!validISODate(date)||!subject)return {ok:false,error:t("ds_invalid_row")};
    const k=date+"|"+subject;
    if(seen[k])return {ok:false,error:t("ds_invalid_row")};
    seen[k]=1;
    clean.push({date:date,subject:subject,start:String(e.start||"").trim(),end:String(e.end||"").trim(),room:String(e.room||"").trim()});
  }
  clean.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  if(!db().dateSheets)db().dateSheets={};
  db().dateSheets[examId]={entries:clean};
  audit("datesheet",ex.name+" — "+clean.length+" papers");
  Store.save();
  return {ok:true,sheet:{entries:clean}};
}
function admitCodeFor(examId,studentId){
  return verifyCodeFor("admit",examId+"|"+studentId);
}

      papers.map(function(p){
        return "<tr><td>"+esc(fmtDate(p.date))+"</td><td>"+esc(p.subject)+"</td><td>"+esc(p.start||"—")+(p.end?"–"+esc(p.end):"")+"</td><td>"+esc(p.room||"—")+"</td></tr>";
      }).join("")+"</table>";

  h+='<div style="font-size:.8rem;color:#555;margin-top:.4rem">'+esc(t("admit_card"))+" • "+esc(t("verify_title"))+": "+esc(code)+"</div></div>";

function issueAdmitCards(examId){
  const ex=(db().exams||[]).find(function(e){return e.id===examId;});
  if(!ex)return {ok:false,error:t("no_records")};
  const studs=studentsOf(ex.cls,ex.section);
  if(!studs.length)return {ok:false,error:t("ds_no_students")};
  const papers=dateSheetEntries(examId);
  const cloudOn=(typeof Cloud!=="undefined"&&Cloud.enabled&&Cloud.fs&&Cloud.schoolId);
  studs.forEach(function(st){
    const code=admitCodeFor(examId,st.id);
    if(cloudOn)Cloud.pushDoc("verifyDocs",code,{type:"admit",code:code,student:{name:st.name,fatherName:st.fatherName,admNo:st.admNo,cls:st.cls},exam:{id:ex.id,name:ex.name,year:ex.year,term:ex.term},papers:papers,at:tsNow()});
  });
  if(!db().admitIssued)db().admitIssued={};
  db().admitIssued[examId]={at:tsNow(),count:studs.length};
  audit("admit-issue",ex.name+" — "+studs.length+" cards"+(cloudOn?" (verifiable)":" (local only)"));
  Store.save();
  return {ok:true,count:studs.length,cloud:!!cloudOn};
}
function withdrawAdmitCards(examId){
  const ex=(db().exams||[]).find(function(e){return e.id===examId;});
  if(!ex)return {ok:false,error:t("no_records")};
  const studs=studentsOf(ex.cls,ex.section);
  if(typeof Cloud!=="undefined"&&Cloud.enabled){
    studs.forEach(function(st){Cloud.deleteDoc("verifyDocs",admitCodeFor(examId,st.id));});
  }
  if(db().admitIssued)delete db().admitIssued[examId];
  audit("admit-withdraw",ex.name);
  Store.save();
  return {ok:true};
}

/* ---- bulk WhatsApp broadcast (Round 30) ---- */
function bcOn(){return (db().settings||{}).bcEnabled!==false;}
var BC_TEMPLATES={absent:"bc_msg_absent",fee:"bc_msg_fee",result:"bc_msg_result",datesheet:"bc_msg_datesheet",general:"bc_msg_general"};
function bcClasses(){
  const seen={},out=[];
  (db().students||[]).forEach(function(st){const c=String(st.cls||"").trim();if(c&&!seen[c]){seen[c]=1;out.push(c);}});
  return out.sort();
}
function bcClassStudents(cls){
  return (db().students||[]).filter(function(s){return s.cls===String(cls);}).sort(function(a,b){return a.admNo<b.admNo?-1:1;});
}
function bcResolve(template,st){
  const s=db().settings||{};
  return String(template||"")
    .replace(/{name}/g,st?st.name||"":"")
    .replace(/{father}/g,st?st.fatherName||"":"")
    .replace(/{class}/g,st?clsLabel(st.cls,st.section):"")
    .replace(/{adm}/g,st?st.admNo||"":"")
    .replace(/{school}/g,s.schoolName||"—")
    .replace(/{date}/g,fmtDate(todayISO()));
}
function bcRecipients(cls){
  return bcClassStudents(cls).filter(function(st){return !!attWaNumber(st);});
}
function bcNoContact(cls){
  return bcClassStudents(cls).filter(function(st){return !attWaNumber(st);});
}
function createBroadcast(cls,tplKey,customText){
  const list=bcClassStudents(cls);
  if(!list.length)return {ok:false,error:"bc_no_class"};
  let msg="";
  if(tplKey==="custom"){msg=String(customText||"").trim();if(!msg)return {ok:false,error:"req"};}
  else{const key=BC_TEMPLATES[tplKey]||BC_TEMPLATES.general;msg=t(key);}
  const recs=bcRecipients(cls);
  if(!recs.length)return {ok:false,error:"ask_no_broadcast"};
  const noC=bcNoContact(cls).length;
  const bc={id:uid("bc"),at:tsNow(),cls:cls,tpl:tplKey,message:msg,recipients:recs.map(function(st){return {studentId:st.id,name:displayName(st),phone:attWaNumber(st),status:"pending"};})};
  if(!db().broadcasts)db().broadcasts=[];
  db().broadcasts.push(bc);
  audit("broadcast_start","Broadcast "+cls+": "+recs.length+" recipients");
  Store.save();
  return {ok:true,id:bc.id,count:recs.length,noContact:noC};
}
function bcGet(id){return (db().broadcasts||[]).find(function(b){return b.id===id;})||null;}
function bcNext(id){
  const bc=bcGet(id);if(!bc)return null;
  return bc.recipients.find(function(r){return r.status==="pending";})||null;
}
function bcWaLink(bc,rec){
  const st=(db().students||[]).find(function(x){return x.id===rec.studentId;});
  return "https://wa.me/"+rec.phone+"?text="+encodeURIComponent(bcResolve(bc.message,st||null));
}
function broadcastMark(id,studentId,status){
  const bc=bcGet(id);if(!bc)return {ok:false,error:"req"};
  const rec=bc.recipients.find(function(r){return r.studentId===studentId;});
  if(!rec)return {ok:false,error:"req"};
  if(status!=="sent"&&status!=="skipped")return {ok:false,error:"req"};
  rec.status=status;rec.at=tsNow();
  audit("broadcast_mark",rec.name+": "+status);
  Store.save();
  return {ok:true};
}
function bcSummary(id){
  const bc=bcGet(id);if(!bc)return null;
  const s={total:bc.recipients.length,sent:0,skipped:0,pending:0};
  bc.recipients.forEach(function(r){s[r.status==="sent"?"sent":r.status==="skipped"?"skipped":"pending"]++;});
  return s;
}

function schoolSummary(){
  const d=db();
  const month=todayISO().slice(0,7);
  let feeDue=0,feeCollected=0;
  (d.feeRecords||[]).forEach(function(rec){
    if(rec.month!==month)return;
    feeDue+=Number(rec.total||0)-Number(rec.discount||0)+Number(rec.fine||0);
    feeCollected+=feePaid(rec);
  });
  const att=attSummary(todayISO(),"");
  return {students:(d.students||[]).length,staff:staffActive().length,feeDue:feeDue,feeCollected:feeCollected,attPct:att.total?att.pct:null,at:tsNow()};
}
function hoAggregate(rows){
  const agg={schools:rows.length,active:0,trial:0,expired:0,blocked:0,students:0,staff:0,feeDue:0,feeCollected:0,mrr:0,renewalsDue:0,reported:0};
  rows.forEach(function(row){
    const s=row.school;
    if(s.blocked)agg.blocked++;
    const due=subDue(s);
    if(due.state==="overdue")agg.expired++;
    else if(s.plan==="trial")agg.trial++;
    else agg.active++;
    if(due.state!=="active")agg.renewalsDue++;
    const pk=countryPack(s.country||"PK");
    const cycle=s.billing==="annual"?"annual":"monthly";
    if(s.status==="active"&&s.plan==="paid")agg.mrr+=Math.round(subAmountFor(pk,cycle)/(cycle==="annual"?12:1));
    (row.pays||[]).forEach(function(p){if(p.status==="reported")agg.reported++;});
    const sm=row.info&&row.info.summary;
    if(sm){agg.students+=Number(sm.students||0);agg.staff+=Number(sm.staff||0);agg.feeDue+=Number(sm.feeDue||0);agg.feeCollected+=Number(sm.feeCollected||0);}
  });
  return agg;
}
function hoSummaryHTML(agg){
  const chip=function(label,val){return '<div class="card" style="flex:1;min-width:120px;text-align:center"><div class="muted">'+esc(label)+'</div><b style="font-size:1.3em">'+esc(fmtNum(val))+"</b></div>";};
  return '<div class="card"><h3>'+esc(t("ho_title"))+'</h3><p class="muted">'+esc(t("ho_hint"))+"</p>"+

function addRoute(name,vehicle,driver,phone,fee,stopsText){

/* ---- library (Round 34) ---- */
function libOn(){return db().settings.libEnabled!==false;}
function addDaysISO(iso,days){
  const p=String(iso||"").split("-");
  const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])+Number(days||0));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function libBookById(id){return (db().libBooks||[]).find(function(b){return b.id===id;})||null;}
function libOutstanding(bookId){return (db().libLoans||[]).filter(function(l){return (!bookId||l.bookId===bookId)&&!l.returned;});}
function libAvailable(bookId){
  const b=libBookById(bookId);
  if(!b)return 0;
  return Math.max(0,Number(b.copies||0)-libOutstanding(bookId).length);
}
function addBook(title,author,copies){
  title=String(title||"").trim();author=String(author||"").trim();copies=Number(copies);
  if(!title)return {ok:false,error:t("req")};
  if(!(copies>=1))return {ok:false,error:t("req")};
  const book={id:uid("lb"),title:title,author:author,copies:Math.floor(copies),at:tsNow()};
  db().libBooks.push(book);
  audit("book-add",title+" ("+book.copies+")");
  Store.save();
  return {ok:true,id:book.id};
}
function deleteBook(id){
  const b=libBookById(id);
  if(!b)return {ok:false};
  if(libOutstanding(id).length)return {ok:false,error:t("lib_book_out")};
  db().libBooks=db().libBooks.filter(function(x){return x.id!==id;});
  audit("book-delete",b.title);
  Store.save();
  return {ok:true};
}
function issueBook(bookId,studentId,dueDays){
  const b=libBookById(bookId);
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!b||!st)return {ok:false,error:t("no_records")};
  dueDays=Number(dueDays)||14;
  if(dueDays<1)dueDays=14;

/* ---- higher education, HEC 4.0 engine (Round 41) ----
   Grade table: HEC Policy Guidelines for Implementation of Uniform
   Semester System §13.1. Pass mark 50%. CGPA = Σ(points × credits) ÷
   Σ(credits). A CGPA converts back to a percentage at the BOTTOM of
   its band (CGPA 3.00 = 71%). Graduation floor: BS 2.00, MS/MPhil 2.50.
   Attendance gate: 75% to sit finals. Repeats: the BETTER grade
   substitutes the old one for CGPA (the common HEC rule; some
   universities count both — a per-institution setting for later). */
const HEC_GRADES=[
  {min:85,grade:"A",points:4.00},{min:80,grade:"A-",points:3.66},
  {min:75,grade:"B+",points:3.33},{min:71,grade:"B",points:3.00},
  {min:68,grade:"B-",points:2.66},{min:64,grade:"C+",points:2.33},
  {min:61,grade:"C",points:2.00},{min:58,grade:"C-",points:1.66},
  {min:54,grade:"D+",points:1.30},{min:50,grade:"D",points:1.00},
  {min:0,grade:"F",points:0}
];
const HEC_FLOOR={BS:2.00,AD:2.00,MS:2.50};
function heOn(){return db().settings.heEnabled===true;}
function heGradeFor(marks){
  const m=Number(marks);
  if(isNaN(m)||m<0||m>100)return null;
  for(let i=0;i<HEC_GRADES.length;i++)if(m>=HEC_GRADES[i].min)return {grade:HEC_GRADES[i].grade,points:HEC_GRADES[i].points};
  return {grade:"F",points:0};
}
function hePctFor(cgpa){
  const c=Number(cgpa);
  if(isNaN(c)||c<=0)return 0;
  for(let i=0;i<HEC_GRADES.length;i++)if(c>=HEC_GRADES[i].points)return HEC_GRADES[i].min;
  return 0;
}
function heAttGate(pct){return Number(pct)>=75;}
function heProgramById(id){return (db().hePrograms||[]).find(function(p){return p.id===id;})||null;}
function heCourseById(id){return (db().heCourses||[]).find(function(c){return c.id===id;})||null;}
function heProgramCourses(programId){return (db().heCourses||[]).filter(function(c){return c.programId===programId;}).sort(function(a,b){return (a.semester-b.semester)||String(a.code).localeCompare(String(b.code));});}
function heEnrollmentOf(studentId){return (db().heEnrollments||[]).find(function(e){return e.studentId===studentId&&e.status==="active";})||null;}
function addHeProgram(d){
  d=d||{};
  const name=String(d.name||"").trim();
  const level=["BS","MS","AD"].indexOf(d.level)>=0?d.level:"BS";
  const semesters=Math.max(1,Math.min(12,parseInt(d.semesters,10)||8));
  const totalCredits=Math.max(1,parseInt(d.totalCredits,10)||0);
  const mode=d.mode==="annual"?"annual":"semester";
  if(!name||!totalCredits)return {ok:false,error:t("req")};
  const p={id:uid("hp"),name:name,level:level,semesters:semesters,totalCredits:totalCredits,mode:mode,at:tsNow()};
  db().hePrograms.push(p);Store.save();
  return {ok:true,id:p.id};
}

  if((db().heCourses||[]).some(function(c){return c.programId===id;}))return {ok:false,error:t("he_prog_in_use")};

  db().heEnrollments=(db().heEnrollments||[]).filter(function(e){return e.programId!==id;});
  Store.save();
  return {ok:true};
}
function addHeCourse(d){
  d=d||{};
  const program=heProgramById(d.programId);
  const code=String(d.code||"").trim().toUpperCase(),title=String(d.title||"").trim();
  const credits=Math.max(1,Math.min(6,parseInt(d.credits,10)||0));
  const semester=Math.max(1,parseInt(d.semester,10)||1);
  if(!program||!code||!title||!credits)return {ok:false,error:t("req")};
  if(semester>program.semesters)return {ok:false,error:t("req")};
  if((db().heCourses||[]).some(function(c){return c.programId===program.id&&c.code===code;}))return {ok:false,error:t("req")};
  const c={id:uid("hc"),programId:program.id,code:code,title:title,credits:credits,semester:semester,at:tsNow()};
  db().heCourses.push(c);Store.save();
  return {ok:true,id:c.id};
}
function deleteHeCourse(id){
  if((db().heResults||[]).some(function(r){return r.courseId===id;}))return {ok:false,error:t("req")};
  db().heCourses=(db().heCourses||[]).filter(function(c){return c.id!==id;});
  Store.save();
  return {ok:true};
}
function enrollHe(studentId,programId,semester){
  const st=(db().students||[]).find(function(x){return x.id===studentId;});
  const program=heProgramById(programId);
  const sem=Math.max(1,Math.min(program?program.semesters:12,parseInt(semester,10)||1));
  if(!st||!program)return {ok:false,error:t("req")};
  (db().heEnrollments||[]).forEach(function(e){if(e.studentId===studentId)e.status="ended";});
  db().heEnrollments.push({id:uid("he"),studentId:studentId,programId:programId,semester:sem, status:"active",at:tsNow()});
  Store.save();
  return {ok:true};
}
function recordHeResult(studentId,courseId,marks){
  const course=heCourseById(courseId);
  const st=(db().students||[]).find(function(x){return x.id===studentId;});
  const g=heGradeFor(marks);
  if(!course||!st||!g)return {ok:false,error:t("req")};
  const enr=heEnrollmentOf(studentId);
  if(!enr||enr.programId!==course.programId)return {ok:false,error:t("req")};
  const attempt=(db().heResults||[]).filter(function(r){return r.studentId===studentId&&r.courseId===courseId;}).length+1;
  const r={id:uid("hr"),studentId:studentId,courseId:courseId,semester:course.semester,marks:Number(marks),grade:g.grade,points:g.points,credits:course.credits,attempt:attempt,at:tsNow()};
  db().heResults.push(r);Store.save();
  return {ok:true,id:r.id};
}
function heBestResults(studentId,semester){
  /* best attempt per course; semester null = all semesters */
  const best={};
  (db().heResults||[]).forEach(function(r){
    if(r.studentId!==studentId)return;
    if(semester!=null&&r.semester!==semester)return;
    const k=r.courseId;
    if(!best[k]||r.points>best[k].points||(r.points===best[k].points&&r.attempt>best[k].attempt))best[k]=r;
  });
  return Object.keys(best).map(function(k){return best[k];});
}
function heGPA(studentId,semester){
  const rs=heBestResults(studentId,semester);
  let pts=0,cr=0;
  rs.forEach(function(r){pts+=r.points*r.credits;cr+=r.credits;});
  if(!cr)return null;
  return {gpa:Math.round(pts/cr*100)/100,credits:cr,courses:rs.length};
}
function heCGPA(studentId){
  const rs=heBestResults(studentId,null);
  let pts=0,cr=0;
  rs.forEach(function(r){pts+=r.points*r.credits;cr+=r.credits;});
  if(!cr)return null;
  return {cgpa:Math.round(pts/cr*100)/100,credits:cr,courses:rs.length};
}
function heStanding(studentId){
  const cg=heCGPA(studentId);
  const enr=heEnrollmentOf(studentId);
  const level=enr&&heProgramById(enr.programId)?heProgramById(enr.programId).level:"BS";
  const floor=HEC_FLOOR[level]||2.00;
  if(!cg)return {cgpa:null,floor:floor,canGraduate:false,probation:false,level:level};
  return {cgpa:cg.cgpa,floor:floor,canGraduate:cg.cgpa>=floor,probation:cg.cgpa<2.00,level:level};
}

/* Standing concession (Round 18, pain #6): attached to the student record,
   applied automatically when a monthly bill is generated. kind: sibling |
   staff | hardship | other. amount = flat PKR off the bill; pct = % off the
   heads total. Bills already generated never change (frozen totals) — a new
   or changed concession applies from the next generated month. */
function concAmount(st,total){
  const c=st&&st.concession;if(!c)return 0;
  if(c.amount&&c.amount>0)return Math.min(c.amount,total);
  if(c.pct&&c.pct>0)return Math.round(total*c.pct/100);
  return 0;
}
function setConcession(studentId,conc){
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st)return {ok:false,error:t("req")};
  const kind=String(conc.kind||"");
  if(["sibling","staff","hardship","other"].indexOf(kind)<0)return {ok:false,error:t("req")};
  const amount=Math.max(0,Number(conc.amount)||0), pct=Math.max(0,Math.min(100,Number(conc.pct)||0));
  if(!amount&&!pct)return {ok:false,error:t("req")};
  st.concession={kind:kind,amount:amount,pct:pct,approver:String(conc.approver||"").trim(),at:todayISO()};
  audit("concession",displayName(st)+" — "+kind+" "+(amount||pct+"%"));
  Store.save();
  return {ok:true};
}
function removeConcession(studentId){
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st||!st.concession)return {ok:false,error:t("req")};
  delete st.concession;

function feeEnsureRecord(studentId,month){
  let rec=feeRecord(studentId,month);
  if(rec)return rec;
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st)return null;
  const trFee=transportFeeFor(st);
  const total=feeHeadsFor(st.cls).reduce(function(a,h){return a+h.amount;},0)+trFee;
  rec={id:uid("fr"),studentId:studentId,month:month,total:total,transportFee:trFee,discount:0,fine:0,payments:[]};
  const ca=concAmount(st,total);
  if(ca>0){rec.discount=ca;rec.discountKind="concession";rec.discountNote=(st.concession.kind||"")+" — "+(st.concession.approver||"");}
  db().feeRecords.push(rec);
  return rec;
}
function feePaid(rec){return (rec.payments||[]).reduce(function(a,p){return a+Number(p.amount||0);},0);}
function feeBill(studentId,month){
  const st=db().students.find(function(s){return s.id===studentId;});
  if(!st)return null;
  const rec=feeRecord(studentId,month);
  const items=feeHeadsFor(st.cls).map(function(h){return {name:h.name,amount:h.amount};});
  const trFee=rec?Number(rec.transportFee||0):transportFeeFor(st);
  if(trFee>0)items.push({name:t("tr_fee_label")+(rec&&st.transport&&routeById(st.transport.routeId)?" — "+routeById(st.transport.routeId).name:""),amount:trFee});
  const total=rec?rec.total:items.reduce(function(a,i){return a+i.amount;},0);
  const discount=rec?rec.discount:0, fine=rec?rec.fine:0, paid=rec?feePaid(rec):0;
  return {student:st,month:month,items:items,total:total,discount:discount,fine:fine,paid:paid,
    balance:total-discount+fine-paid,record:rec,payments:rec?rec.payments:[]};
}
function feeGenerate(month){
  if(!/^\d{4}-\d{2}$/.test(month))return {ok:false,error:t("req")};
  let created=0;

    if(!feeRecord(st.id,month)){feeEnsureRecord(st.id,month);created++;}

}
function nextFeeReceipt(year){

function recordFeePayment(studentId,month,amount,method,txnId){

/* Fees on/off (Round 19): true unless the school explicitly turned fees off.
   Old data has no feesEnabled field, so it defaults to on. */
function feesOn(){return (db().settings||{}).feesEnabled!==false;}
/* ---- subscription billing (Round 23) ----
   Annual plan = 12 months for the price of 10.8 (10% off the annual total).
   ANNUAL_DISC is the one number that changes the discount. */
const ANNUAL_DISC=0.10;
function annualPrice(pack){return Math.round((pack.price||0)*12*(1-ANNUAL_DISC));}
function annualSave(pack){return (pack.price||0)*12-annualPrice(pack);}
function subAmountFor(pack,cycle){return cycle==="annual"?annualPrice(pack):(pack.price||0);}
function subCycleMonths(cycle){return cycle==="annual"?12:1;}
/* Add months to a YYYY-MM-DD date, clamping the day (31 Jan + 1 mo = 28 Feb). */
function addMonthsISO(iso,months){
  const p=String(iso||"").split("-");if(p.length<3)return todayISO();
  let y=+p[0],m=+p[1]-1+months,d=+p[2];
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  const last=new Date(y,m+1,0).getDate();
  if(d>last)d=last;
  return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
/* Renewal state of a school doc: {days, state} — "overdue" | "due_soon" (<=7d) | "active". */
function subDue(school){
  const until=(school&&(school.paidUntil||school.trialEndsAt))||"";
  if(!until)return {days:null,state:"active"};
  const t=new Date(todayISO()+"T00:00:00"),u=new Date(String(until).slice(0,10)+"T00:00:00");
  const days=Math.round((u-t)/86400000);
  return {days:days,state:days<0?"overdue":days<=7?"due_soon":"active"};
}
/* Teacher reports a subscription payment. It stays "reported" until the
   platform admin confirms it — only the confirm extends paidUntil. */
function reportSubPayment(d){
  const cycle=d.cycle==="annual"?"annual":"monthly";
  const amt=Number(d.amount);
  if(!(amt>0))return {ok:false,error:t("req")};
  if(["Cash","JazzCash","EasyPaisa","Bank"].indexOf(d.method)<0)return {ok:false,error:t("req")};
  const p={id:uid("sp"),at:tsNow(),amount:amt,method:d.method,txnId:String(d.txnId||"").trim(),cycle:cycle,months:subCycleMonths(cycle),status:"reported",reportedBy:(typeof Cloud!=="undefined"&&Cloud.user?Cloud.user.email:"")};
  db().subPayments.push(p);
  audit("sub-report",p.cycle+" "+p.amount+" "+p.method+" "+(p.txnId||"—"));
  Store.save();
  return {ok:true,payment:p};
}

/* Phone -> WhatsApp number (03… -> 92…), same rule as the attendance alerts. */
function waNumber(phone){
  const digits=String(phone||"").replace(/\D/g,"");
  if(digits.length<7)return "";
  if(digits.length===11&&digits[0]==="0")return "92"+digits.slice(1);
  return digits;
}

   turned it off in Settings. Old data has no field, so it defaults to on. */
function attOn(){return (db().settings||{}).attEnabled!==false;}

/* Payment status (Round 19): the tool itself works out whether a month's fee
   is paid in full, half, a quarter, three quarters, or only partly — from the
   amount due (total - discount + fine) and the amount paid, never typed. */
function feePayStatus(studentId,month){
  const b=feeBill(studentId,month);
  if(!b)return null;
  const due=b.total-b.discount+b.fine;
  if(due<=0)return {due:due,paid:b.paid,pct:100,key:"fee_full",balance:0};
  const pct=Math.round(b.paid/due*100);
  let key;
  if(b.paid<=0)key="fee_unpaid";
  else if(pct>=100)key="fee_full";
  else if(pct===50)key="fee_half";
  else if(pct===25)key="fee_quarter";
  else if(pct===75)key="fee_threeq";
  else key="fee_part";
  return {due:due,paid:b.paid,pct:pct,key:key,balance:b.balance};
}
function feePayStatusText(studentId,month){
  const st=feePayStatus(studentId,month);
  if(!st)return "";
  return t(st.key)+(st.key==="fee_part"?" ("+st.pct+"%)":"");
}
function feeSummary(month){
  const s={billed:0,collected:0,outstanding:0,defaulters:0,students:0,full:0,half:0,quarter:0,part:0,unpaid:0};
  (db().feeRecords||[]).forEach(function(rec){
    if(rec.month!==month)return;
    s.students++;
    s.billed+=rec.total;
    const paid=feePaid(rec);
    s.collected+=paid;
    const bal=rec.total-rec.discount+rec.fine-paid;
    s.outstanding+=bal;
    if(bal>0)s.defaulters++;
    const st=feePayStatus(rec.studentId,month);
    if(st){if(st.key==="fee_full")s.full++;else if(st.key==="fee_half")s.half++;else if(st.key==="fee_quarter")s.quarter++;else if(st.key==="fee_unpaid")s.unpaid++;else s.part++;}
  });
  return s;
}
function feeClearance(studentId){
  if(!feesOn())return true;
  return (db().feeRecords||[]).filter(function(r){return r.studentId===studentId;})
    .every(function(rec){return (rec.total-rec.discount+rec.fine-feePaid(rec))<=0;});
}

}

/* ================= verification QR (Round 16) =================
   Every published result and issued certificate carries a verification code
   and a QR. Anyone who scans it (or types the code) opens the public verify
   page and sees the genuine record — a forged card cannot fake the code,
   because the code is the document's id in the public verifyDocs collection
   and only the school's teachers can write there.
   The code is deterministic: first 10 hex chars of SHA-256(schoolId|type|ref),
   so re-publishing the same document rewrites the same public record. */
function verifySchoolId(){return (typeof Cloud!=="undefined"&&Cloud.schoolId)||"local";}
function verifyCodeFor(type,refId,schoolId){
  const sid=schoolId||verifySchoolId();
  const hex=sha256Hex(sid+"|"+type+"|"+refId);
  const c=hex.slice(0,10).toUpperCase();
  return c.slice(0,5)+"-"+c.slice(5,10);
}
function verifyURL(code,schoolId){
  const sid=schoolId||verifySchoolId();
  const base=(typeof location!=="undefined"&&location.origin&&location.origin!=="null"&&location.pathname)
    ? location.origin+location.pathname
    : "https://JumaKhan-kakar.github.io/school-record-system/";
  return base+"?school="+encodeURIComponent(sid)+"&code="+encodeURIComponent(code)+"#verify";
}
/* ---- ROUND 24: student ID card + scan to open ----
   No face matching: the ID card's QR code is the key. A teacher points the
   phone camera at the card (or uploads a photo of it) and the student's full
   dossier opens. The QR text is "SRS-STUDENT:<schoolId>:<admNo>"; the
   admission number is the unique key, the school part only rejects a card
   from a different school. */
var idScanOpen=false,idScanTimer=null,idScanStream=null;
function scanSchoolId(){return (typeof Cloud!=="undefined"&&Cloud.schoolId)?Cloud.schoolId:"local";}
function scanQRText(st){return "SRS-STUDENT:"+scanSchoolId()+":"+st.admNo;}
function findStudentByScan(text){
  const m=String(text||"").trim().match(/^SRS-STUDENT:([^:]+):(.+)$/);
  if(!m)return {ok:false,error:"idscan_notfound"};
  const sid=scanSchoolId();
  if(m[1]!==sid&&m[1]!=="local"&&sid!=="local")return {ok:false,error:"idscan_wrong_school"};
  const st=(db().students||[]).find(function(s){return s.admNo===m[2];});
  if(!st)return {ok:false,error:"idscan_notfound"};
  return {ok:true,student:st};
}

function idStopScan(){
  if(typeof document==="undefined")return;

  if(idScanStream){try{idScanStream.getTracks().forEach(function(tr){tr.stop();});}catch(e){}idScanStream=null;}
  const v=$("scan-video");if(v){v.srcObject=null;v.hidden=true;}

function idStartScan(){
  const v=$("scan-video");

    idScanMsg('<div class="msg err">'+esc(t("idscan_no_camera"))+'</div>');return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(stream){
    idScanStream=stream;v.srcObject=stream;v.hidden=false;v.play();
    idScanMsg('<div class="msg">'+esc(t("idscan_scanning"))+'</div>');
    const cv=document.createElement("canvas"),cx=cv.getContext("2d");
    idScanTimer=setInterval(function(){

      cx.drawImage(v,0,0,cv.width,cv.height);
      let code=null;
      try{code=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);}catch(e){}
      if(!code||!code.data)return;
      const r=openStudentByScan(code.data);
      idScanMsg(r.ok?'<div class="msg ok">'+esc(t("idscan_found"))+'</div>'
                   :'<div class="msg err">'+esc(t(r.error||"idscan_notfound"))+'</div>');
    },350);

}
function idDecodeScanFile(file){
  if(!file||typeof jsQR==="undefined")return Promise.resolve({ok:false,error:"scan_no_qr"});
  return new Promise(function(resolve){
    const img=new Image();
    img.onload=function(){
      const cv=document.createElement("canvas");
      const scale=Math.min(1,800/Math.max(img.width,img.height));
      cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
      const cx=cv.getContext("2d");cx.drawImage(img,0,0,cv.width,cv.height);
      let code=null;
      try{code=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);}catch(e){}
      if(!code||!code.data){resolve({ok:false,error:"scan_no_qr"});return;}
      resolve(openStudentByScan(code.data));
    };
    img.onerror=function(){resolve({ok:false,error:"scan_no_qr"});};
    img.src=URL.createObjectURL(file);
  });
}
function qrSVG(text,size){

}

/* ============ SAFE MERGE — two phones, never overwrites ============

   fields are NEVER overwritten, nothing is ever deleted. Matching uses the
